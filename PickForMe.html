  /** 单个候选输入块。idx 用作唯一标记，no 只用于显示序号；data 来自场景模板示例 */
  function optionRow(idx, no, data) {
    var d = data || {};
    var ps = d.params || [];
    var p1 = ps[0] ? (ps[0].k + ' ' + (ps[0].v || '')).trim() : '';
    var p2 = ps[1] ? (ps[1].k + ' ' + (ps[1].v || '')).trim() : '';
    var priceVal = (d.price == null || d.price === '') ? '' : d.price;

    return '' +
      '<div class="card" data-opt="' + idx + '" style="margin-bottom:10px;padding:12px;background:var(--surface-2)">' +
        '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">' +
          '<span class="tag">候选 ' + (no + 1) + '</span>' +
          '<span class="spacer" style="margin-left:auto"></span>' +
          '<button type="button" class="btn btn-line btn-sm" data-remove="' + idx + '">删除</button>' +
        '</div>' +
        '<div class="form-grid">' +
          '<div class="field" style="margin-bottom:8px">' +
            '<input class="input" name="optName" maxlength="30" placeholder="名称，如 A 款 · 大电池" ' +
                   'value="' + esc(d.name || '') + '">' +
          '</div>' +
          '<div class="field" style="margin-bottom:8px">' +
            '<input class="input" name="optPrice" type="number" min="0" placeholder="价格（可空）" ' +
                   'value="' + esc(priceVal) + '">' +
          '</div>' +
        '</div>' +
        '<div class="form-grid">' +
          '<div class="field" style="margin-bottom:0">' +
            '<input class="input" name="optP1" maxlength="16" placeholder="参数1：键 值，如 电池 大" ' +
                   'value="' + esc(p1) + '">' +
          '</div>' +
          '<div class="field" style="margin-bottom:0">' +
            '<input class="input" name="optP2" maxlength="16" placeholder="参数2：键 值，如 屏幕 6.7 寸" ' +
                   'value="' + esc(p2) + '">' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function bindNew(root, rerender) {
    var list = D.$('#optList', root);
    /* 未登录时这一页渲染的是登录引导，没有候选列表；直接返回，不要往下取元素 */
    if (!list) return;
    var count = 0;   // 当前行数，用于上限判断
    var seq = 0;     // 唯一序号，删除后不复用，避免 data-opt 撞车

    var sceneKey = '';

    function addRow(data) {
      if (count >= 8) { D.toast('一个投票最多 8 个候选'); return; }
      list.insertAdjacentHTML('beforeend', optionRow(seq, count, data));
      seq++;
      count++;
    }

    addRow(); addRow();

    D.$('#addOpt', root).addEventListener('click', function () { addRow(); });

    /* ---- poll-designer：一句话起草候选（规则匹配） ---- */
    var dInput = D.$('#fd-text', root);
    var dBtn = D.$('[data-design]', root);
    var dOut = D.$('#designerOut', root);

    function runDesigner() {
      var text = (dInput && dInput.value || '').trim();
      if (!text) { D.toast('先写一句需求'); if (dInput) dInput.focus(); return; }
      var res = null;
      try {
        if (typeof Designer !== 'undefined' && Designer && Designer.build) {
          res = Designer.build({ text: text });
        }
      } catch (e) { res = null; }

      if (!res || !res.ok) {
        if (dOut) {
          dOut.hidden = false;
          dOut.innerHTML = '<div class="dz-note">起草不可用（内核没加载），请手动填候选。</div>';
        }
        return;
      }

      var p = res.parsed || {};
      var noCat = !res.candidates.length;
      dOut.hidden = false;
      dOut._res = res;
      dOut._text = text;
      dOut.innerHTML =
        '<div class="dz-line">' +
          '<span class="dz-k">品类</span><b>' + esc(p.category || '没认出') + '</b>' +
          '<span class="dz-k">预算</span><b>' + esc(p.budgetLabel || '没找到') + '</b>' +
          '<span class="dz-k">用途</span><b>' + esc(p.usage || '没说') + '</b>' +
          '<span class="dz-conf">置信度 ' + Math.round((res.confidence || 0) * 100) + '%</span>' +
        '</div>' +
        (res.params.length
          ? '<div class="dz-line"><span class="dz-k">参数</span><b>' +
            esc(res.params.map(function (x) { return x.k; }).join(' / ')) + '</b></div>'
          : '') +
        (noCat
          ? '<div class="dz-note">没认出品类，生成不了候选。可以直接手填，或者换个说法再试。</div>'
          : '<div class="dz-actions"><button type="button" class="btn btn-sm" data-design-fill="1">填进表单</button>' +
            '<span class="dz-note">参数值是相对档位，填进去后按实际商品改。</span></div>');
    }

    if (dBtn) dBtn.addEventListener('click', runDesigner);

    D.on(root, 'click', '[data-design-fill]', function () {
      var res = dOut && dOut._res;
      if (!res) return;
      while (list.firstChild) list.removeChild(list.firstChild);
      count = 0;
      seq = 0;
      res.candidates.forEach(function (c) { addRow(c); });
      var t = D.$('#f-title', root);
      if (t && !t.value.trim()) t.value = (dOut._text || '').slice(0, 60);
      D.toast('已起草 ' + res.candidates.length + ' 个候选');
    });

    D.on(list, 'click', '[data-remove]', function (e, btn) {
      if (count <= 2) { D.toast('至少保留 2 个候选'); return; }
      btn.closest('[data-opt]').remove();
      count--;
    });

    /* ---- 权限组合预览：可见性 × 门槛 × 结果展示 ---- */
    function updatePreview() {
      var host = D.$('#permPreview', root);
      if (!host) return;

      var vis = D.$('#f-vis', root).value;
      var gateKey = D.$('#f-gate', root).value;
      var modeKey = D.$('#f-result', root).value;
      var gate = Store.GATES[gateKey] || Store.GATES.all;
      var mode = Store.RESULT_MODES[modeKey] || Store.RESULT_MODES.full;
      var aud = Store.gateAudience({ gate: gateKey });

      var visTxt = vis === 'link'
        ? '不上首页列表，只有拿到链接的人进得来'
        : '首页列表可见，谁都能自己找到';
      var gateTxt = gateKey === 'all'
        ? '所有人，不设信用门槛'
        : gate.label + '（需 5 次可计入统计的投票）';
      var combo = '→ ' + (vis === 'link'
        ? '首页看不到这次投票；拿到链接的人里，'
        : '首页能刷到这次投票；点进来的人里，') +
        (gateKey === 'all' ? '任何人都能投。' : '只有「' + gate.label + '」能投。');

      var warn = '';
      if (gateKey !== 'all') {
        warn = '门槛会减少参与人数：还没攒够 5 次统计的人会被挡在门外。' +
          '当前演示数据里满足这个门槛的约 ' + aud.pass + ' 人（共 ' + aud.total + ' 个带档案的投票人）。';
      }

      host.innerHTML =
        '<div class="perm-row"><span class="perm-k">谁能看到</span><b>' + esc(visTxt) + '</b></div>' +
        '<div class="perm-row"><span class="perm-k">谁能投</span><b>' + esc(gateTxt) + '</b></div>' +
        '<div class="perm-row"><span class="perm-k">结果展示</span><b>' + esc(mode.desc) + '</b></div>' +
        '<div class="perm-combo">' + esc(combo) + '</div>' +
        (warn ? '<div class="perm-warn">' + esc(warn) + '</div>' : '');
    }

    function setSelect(sel, val) {
      var el = D.$(sel, root);
      if (el) el.value = val;
    }

    /* ---- 场景模板：只改默认值，不改用户已经填的内容 ---- */
    function applyScene(key) {
      var s = Store.SCENES[key];
      if (!s) return;

      sceneKey = key;
      var d = s.defaults;
      setSelect('#f-vis', d.visibility);
      setSelect('#f-gate', d.gate);
      setSelect('#f-type', d.type);
      setSelect('#f-anon', d.anonymous ? '1' : '0');
      setSelect('#f-result', d.resultMode);

      /* 模板还带时间和两个规则开关：省掉"三个都手动点一遍" */
      var dl = D.$('#f-deadline', root);
      if (dl && d.deadlineHours) dl.value = dtLocal(Date.now() + d.deadlineHours * 3600 * 1000);
      var aa = D.$('#f-allowadd', root);
      if (aa) aa.checked = !!d.allowAddOption;
      var mr = D.$('#f-multi', root);
      if (mr) mr.checked = !!d.allowMultiRound;

      // 候选区还是空的，就把模板示例填进去，省掉从零开始
      var rows = D.$$('[data-opt]', list);
      var filled = rows.some(function (row) {
        return D.$('[name="optName"]', row).value.trim() !== '';
      });

      if (!filled && s.examples && s.examples.length) {
        list.innerHTML = '';
        count = 0;
        s.examples.slice(0, 3).forEach(function (ex) { addRow(ex); });
      }

      D.$$('[data-scene]', root).forEach(function (el) {
        var on = el.getAttribute('data-scene') === key;
        if (on) el.classList.add('is-on'); else el.classList.remove('is-on');
        el.setAttribute('aria-pressed', on ? 'true' : 'false');
      });

      var hint = D.$('#sceneHint', root);
      if (hint) hint.textContent = s.label + '：' + s.hint + '（示例候选已填入，可直接改）';

      updatePreview();
      /* 模板也改了截止时间，提示必须跟着变，否则输入框和提示会互相打架 */
      if (typeof refreshDeadlineHint === 'function') refreshDeadlineHint();
    }

    D.on(root, 'click', '[data-scene]', function (e, el) {
      applyScene(el.getAttribute('data-scene'));
    });

    ['#f-vis', '#f-gate', '#f-result', '#f-type', '#f-anon'].forEach(function (sel) {
      var el = D.$(sel, root);
      if (el) el.addEventListener('change', updatePreview);
    });

    updatePreview();

    /* ---- 截止时间：快捷按钮 + 一句人话提示 ---- */
    var dlInput = D.$('#f-deadline', root);

    function refreshDeadlineHint() {
      var el = D.$('#f-deadline', root);
      var hint = D.$('#dlHint', root);
      if (!el || !hint) return;
      if (!el.value) {
        hint.className = 'deadline-hint';
        hint.textContent = '不限时：一直开着，直到你在详情页手动结束。';
        return;
      }
      var ms = Date.parse(el.value);
      if (isNaN(ms)) { hint.textContent = ''; return; }
      if (ms <= Date.now()) {
        hint.className = 'deadline-hint is-bad';
        hint.textContent = '这个时间已经过去了，换一个，或者选「不限时」。';
        return;
      }
      hint.className = 'deadline-hint';
      hint.textContent = '到 ' + fmtShort(new Date(ms).toISOString()) + ' 自动关闭，到点后谁都不能再投。';
    }

    D.on(root, 'click', '[data-dl]', function (e, el) {
      var h = Number(el.getAttribute('data-dl'));
      if (!dlInput) return;
      dlInput.value = h > 0 ? dtLocal(Date.now() + h * 3600 * 1000) : '';
      refreshDeadlineHint();
    });

    if (dlInput) dlInput.addEventListener('change', refreshDeadlineHint);
    refreshDeadlineHint();

    D.$('#pollForm', root).addEventListener('submit', function (e) {
      e.preventDefault();
      var title = D.$('#f-title', root).value.trim();
      if (!title) { D.toast('先写"要选什么"'); D.$('#f-title', root).focus(); return; }

      var rows = D.$$('[data-opt]', list);
      var options = [];
      rows.forEach(function (row, i) {
        var name = D.$('[name="optName"]', row).value.trim();
        if (!name) return;
        var p1 = D.$('[name="optP1"]', row).value.trim();
        var p2 = D.$('[name="optP2"]', row).value.trim();
        var params = [];
        if (p1) params.push(splitParam(p1));
        if (p2) params.push(splitParam(p2));

        var pv = D.$('[name="optPrice"]', row).value;
        options.push({
          id: 'o' + (i + 1) + '_' + Date.now().toString(36).slice(-4),
          name: name,
          price: pv === '' ? null : Number(pv),
          emoji: '',
          params: params,
          reason: ''
        });
      });

      if (options.length < 2) { D.toast('至少填 2 个候选名称'); return; }

      /* 截止时间：空 = 不限；填了就必须晚于现在 */
      var deadline = null;
      if (dlInput && dlInput.value) {
        var dms = Date.parse(dlInput.value);
        if (isNaN(dms)) { D.toast('截止时间格式不对'); dlInput.focus(); return; }
        if (dms <= Date.now()) { D.toast('截止时间要晚于现在'); dlInput.focus(); return; }
        deadline = new Date(dms).toISOString();
      }

      var vis = D.$('#f-vis', root).value;
      var allowAdd = D.$('#f-allowadd', root);
      var allowMulti = D.$('#f-multi', root);
      var nowIso = new Date().toISOString();
      var poll = {
        title: title,
        note: D.$('#f-note', root).value.trim(),
        type: D.$('#f-type', root).value,
        anonymous: D.$('#f-anon', root).value === '1',
        visibility: vis,
        owner: Store.meId(),
        gate: D.$('#f-gate', root).value,
        scene: sceneKey || null,
        resultMode: D.$('#f-result', root).value,
        allowAddOption: !!(allowAdd && allowAdd.checked),
        reopenRound: 0,
        allowMultiRound: !!(allowMulti && allowMulti.checked),
        round: 1,
        roundStartedAt: nowIso,
        roundLog: [],
        deadline: deadline,
        weights: { budget: 40, durable: 25, look: 20, portable: 15 },
        options: options,
        votes: []
      };

      Store.save('polls', poll);

      var gate = Store.gateMeta(poll);
      var gateTxt = gate.key === 'all' ? '' : ' · 门槛：' + gate.label;

      if (vis === 'link') {
        // 只有链接能进，所以建完必须立刻给出链接
        try { sessionStorage.setItem('pf:justShared', poll.id); } catch (e) { /* 隐私模式 */ }
        D.toast('已创建 · 仅链接可见' + gateTxt);
      } else {
        D.toast('投票已创建' + gateTxt);
      }

      location.hash = '#/poll/' + poll.id;
    });
  }

  /** "亮度 500" → {k:'亮度', v:'500'} */
  function splitParam(s) {
    var m = s.match(/^(.+?)[\s:：]+(.+)$/);
    if (m) return { k: m[1].trim(), v: m[2].trim() };
    return { k: s, v: '' };
  }

  /* ============================================================
     投票详情 + 结果
     ============================================================ */

  /* 别人发来的链接：本地还没有时先问云端，问到之前不报 404。
     只记 id → 状态，避免每次重绘都重复请求。 */
  var remoteLookup = {};

  /** 从 hash 里取投票 id，忽略 ? 之后的参数 */
  function pollIdOfHash(hash) {
    var h = (hash || '').replace(/^#\/?/, '');
    var qi = h.indexOf('?');
    if (qi >= 0) h = h.slice(0, qi);
    var parts = h.split('/').filter(Boolean);
    return parts[0] === 'poll' ? (parts[1] || '') : '';
  }

  function renderPollLoading(id) {
    return statePage({
      tone: 'muted', code: '', icon: '↻',
      title: '正在从云端取这条投票',
      text: '第一次打开别人发来的链接要先拉一下数据，通常一两秒；网络慢的话多等一会儿。',
      detail: '<div class="state-kv"><span>投票编号</span><code>' + esc(id) + '</code></div>',
      actions: [{ label: '回到首页', href: '#/', primary: true }]
    });
  }

  function renderPollGone(id) {
    return statePage({
      tone: 'muted', code: '404', icon: '?',
      title: '这个投票不存在了',
      text: '可能是链接被截断、少了几位；也可能发起者把它删掉了。已经结束的投票仍然能打开。',
      detail: '<div class="state-kv"><span>你打开的投票 id</span><code>' + esc(id || '（空）') + '</code></div>',
      actions: [
        { label: '回到首页看还在的投票', href: '#/', primary: true },
        { label: '发起一个新的', href: '#/new' }
      ],
      links: [
        { label: '选品攻略', href: '#/guides' },
        { label: '信用规则说明', href: '#/rules' }
      ]
    });
  }

  var pollWatchStop = null;

  function renderPoll(id) {
    /* 每次重绘都先停掉上一场的轮询，避免路由切换后还在拉旧投票 */
    if (pollWatchStop) { pollWatchStop(); pollWatchStop = null; }

    /* 先查进行中的，再查已归档的：旧链接指向结束的投票时，要看到"已结束"而不是 404 */
    var poll = Store.getAnyPoll(id);
    if (!poll) {
      if (window.PFSync && window.PFSync.enabled()) {
        var st = remoteLookup[id];
        if (st === 'gone') return renderPollGone(id);
        if (!st) {
          remoteLookup[id] = 'pending';
          PFSync.fetchPoll(id, function (remote) {
            if (remote && remote.id) {
              remoteLookup[id] = 'found';
              /* 交给同步层搬：直接 Store.remove 会被 onWrite 当成「本地删掉了」，
                 反过来把云端那行真删掉，后面的人打开就变 404 */
              if (PFSync.adopt) PFSync.adopt(remote);
            } else {
              remoteLookup[id] = 'gone';
            }
            if (pollIdOfHash(location.hash) === id) {
              window.dispatchEvent(new Event('hashchange'));
            }
          });
          /* 网络太慢或离线：8 秒后不再转圈，按找不到处理 */
          setTimeout(function () {
            if (remoteLookup[id] === 'pending') {
              remoteLookup[id] = 'gone';
              if (pollIdOfHash(location.hash) === id) {
                window.dispatchEvent(new Event('hashchange'));
              }
            }
          }, 8000);
        }
        return renderPollLoading(id);
      }
      return renderPollGone(id);
    }

    /* 别人结束了这场投票，本页要自己发现：
       进入页面先查一次，之后每 5 秒问一次云端（标签页重新可见时也补查）。 */
    if (!poll.archived && window.PFSync && window.PFSync.watchPoll) {
      pollWatchStop = PFSync.watchPoll(poll.id, function () {
        if (pollIdOfHash(location.hash) === poll.id) {
          window.dispatchEvent(new Event('hashchange'));
        }
      }, 5000);
    }

    var t = Store.tallyOf(poll);
    var meId = Store.meId();
    var mine = myVoteOf(poll);
    var isOwner = !!meId && poll.owner === meId;
    var gate = Store.gateMeta(poll);
    var gateRes = Store.canVote(poll, meId);
    var mode = Store.resultModeOf(poll);
    var scene = Store.sceneOf(poll);
    var reopenRound = poll.reopenRound || 0;
    var openRound = poll.round || 1;
    var closed = Store.isClosed(poll);
    var timing = Store.pollTiming(poll);
    var canRevote = !closed && !!mine && Store.needsRevote(poll, mine);
    var revoting = !closed && !!pendingRevote && pendingRevote.pollId === poll.id;
    var picks = revoting ? pendingRevote.choice : (mine ? (mine.choice || []) : []);

    /* --- 候选投票区 --- */
    var voteCards = poll.options.map(function (o, i) {
      var picked = picks.indexOf(o.id) >= 0;
      var params = (o.params || []).map(function (p) {
        return '<span class="tag">' + esc(p.k) + (p.v ? ' ' + esc(p.v) : '') + '</span>';
      }).join(' ');

      var cls = 'card zone vote-card' +
        (picked ? ' is-picked' : '') +
        (!gateRes.ok || closed ? ' is-locked' : '') +
        (revoting ? ' is-revote' : '') +
        (lastVotedId === o.id ? ' just-voted' : '');

      var badges = '';
      if (o.isNew) badges += ' <span class="tag tag-new">新增选项</span>';
      if (picked) badges += ' <span class="tag brand">' + (revoting ? '已选' : '你选了') + '</span>';

      return '' +
        '<button type="button" class="' + cls + '" data-vote="' + esc(o.id) + '"' +
                ((!gateRes.ok || closed) ? ' aria-disabled="true"' : '') + '>' +
          '<h3><span class="opt-no" aria-hidden="true">' + (i + 1) + '</span>' + esc(o.name) +
            badges + '</h3>' +
          '<p>' + esc(price(o.price)) + (o.reason ? ' · ' + esc(o.reason) : '') + '</p>' +
          (params ? '<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">' + params + '</div>' : '') +
        '</button>';
    }).join('');

    /* --- 结果条 --- */
    var unit = unitOf(poll);
    var bars = t.rows.map(function (r) {
      var pct = t.max > 0 ? Math.round(r.score / t.max * 100) : 0;
      var lead = t.winners.indexOf(r) >= 0;
      return '' +
        '<div class="bar-row">' +
          '<div class="bar-top">' +
            '<span>' + esc(r.option.name) + '</span>' +
            '<span class="bar-num">' + esc(r.score) + ' ' + unit + '</span>' +
          '</div>' +
          '<div class="bar-track">' +
            '<div class="bar-fill' + (lead ? ' is-lead' : '') + '" style="width:' + pct + '%"></div>' +
          '</div>' +
        '</div>';
    }).join('');

    /* --- 环形图：纯 CSS conic-gradient，不引第三方库 ---
       柱状条看排序，环形图看占比，两个一起给评委看"结果长什么样"。 */
    var donut = '';
    if (t.total > 0) {
      var palette = ['var(--brand)', '#7c9cc4', '#c9a227', '#b57ba6', '#8aa06a', '#9a9a9a'];
      var acc = 0;
      var stops = [];
      var legend = '';
      t.rows.forEach(function (r, i) {
        var pct = r.score / t.total * 100;
        if (pct <= 0) return;
        var color = palette[i % palette.length];
        stops.push(color + ' ' + acc.toFixed(2) + '% ' + (acc + pct).toFixed(2) + '%');
        acc += pct;
        legend += '<li><i style="background:' + color + '"></i>' +
          '<span>' + esc(r.option.name) + '</span>' +
          '<b>' + Math.round(pct) + '%</b></li>';
      });
      if (stops.length) {
        donut = '<div class="donut-wrap">' +
          '<div class="donut" role="img" aria-label="票数占比环形图" ' +
            'style="background:conic-gradient(' + stops.join(',') + ')">' +
            '<span class="donut-hole"><b>' + esc(t.total) + '</b><i>' + esc(unit) + '</i></span>' +
          '</div>' +
          '<ul class="donut-legend">' + legend + '</ul>' +
        '</div>';
      }
    }

    /* --- 结论卡 / 平票兜底 --- */
    var conclusion;
    if (t.total === 0) {
      conclusion = '' +
        '<div class="notice">' +
          '<div>还没有人投票。把链接发给要一起选的人，或者先在下面点一个试试。</div>' +
          '<div style="margin-top:10px">' +
            '<button type="button" class="btn btn-line btn-sm" data-share="1">分享链接</button>' +
          '</div>' +
        '</div>';
    } else if (t.tie) {
      conclusion = '' +
        '<div class="card card--tie">' +
          '<div class="conclusion-label">平票</div>' +
          '<h3 style="margin:0 0 8px;font-size:15.5px">票数打平了，但不用卡在这</h3>' +
          '<p class="conclusion-sub" style="margin:0 0 12px">' +
            '并列第一：' + t.winners.map(function (w) { return esc(w.option.name); }).join(' / ') +
            '（各 ' + esc(t.max) + ' ' + unit + '）。在你更倾向的那个上补一票，通常就能分出结果；' +
            '还是拿不定，就让我们按你设的权重给个建议。' +
          '</p>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
            t.winners.map(function (w) {
              return '<button type="button" class="btn btn-primary btn-sm" ' +
                     'data-vote="' + esc(w.option.id) + '">投 ' + esc(w.option.name) + '</button>';
            }).join('') +
            '<button type="button" class="btn btn-line btn-sm" data-suggest="1">' +
              '还是拿不定，帮我决定' +
            '</button>' +
          '</div>' +
          '<div id="suggestBox"></div>' +
        '</div>';
    } else {
      var w = t.winners[0];
      conclusion = '' +
        '<div class="card card--win">' +
          '<div class="conclusion-label">结论</div>' +
          '<div class="conclusion-main">建议选 ' + esc(w.option.name) + '</div>' +
          '<div class="conclusion-sub">' +
            esc(w.score) + ' ' + unit + '（共 ' + esc(t.total) + ' ' +
            (poll.type === 'rank' ? '人' : '票') + '）' +
            (w.option.price != null ? ' · ' + esc(price(w.option.price)) : '') +
          '</div>' +
        '</div>';
    }

    /* --- 计算来源徽章（v0.1.5）---
       默认走技能内核；点右侧按钮切到本地预演，选择记在 localStorage。
       只影响这一页的结论展示，票数本身不变。 */
    var srcBar = '' +
      '<div class="src-bar">' +
        '<span class="src-badge' + (t._source === 'skill' ? ' is-skill' : '') + '"' +
          ' title="' + (t._source === 'skill'
            ? '结论由 poll-result 内核计算（与技能同源的浏览器镜像），不是远程调用平台'
            : '结论由 store.js 本地计算，v0.1.0 以来的旧逻辑') + '">' +
          (t._source === 'skill' ? '技能内核' : '本地预演') +
        '</span>' +
        '<span class="src-note">' + (t._source === 'skill'
          ? '与 .opencode/skills/poll-result 同一套算法'
          : '旧逻辑，用来对比两套结果是否一致') + '</span>' +
        '<button type="button" class="src-toggle" data-toggle-src="1">' +
          '切到' + (t._source === 'skill' ? '本地预演' : '技能内核') +
        '</button>' +
      '</div>';

    /* --- 对比表 --- */
    var keys = [];
    poll.options.forEach(function (o) {
      (o.params || []).forEach(function (p) {
        if (p.k && keys.indexOf(p.k) < 0) keys.push(p.k);
      });
    });

    /* 每个参数有几个候选填了：0 的整列不要，1 的就是这个候选的独有优势 */
    var filled = {};
    keys.forEach(function (k) {
      filled[k] = poll.options.filter(function (o) {
        return (o.params || []).some(function (p) { return p.k === k; });
      }).length;
    });
    keys = keys.filter(function (k) { return filled[k] > 0; });

    /* 每个参数都只有一款填的时候，「独有」等于没说，整表不标 */
    var anyShared = keys.some(function (k) { return filled[k] > 1; });
    var markOnly = anyShared && keys.some(function (k) { return filled[k] === 1; });

    var cmp = '';
    if (keys.length) {
      var colLabel = poll.type === 'rank' ? '得分' : '票数';
      cmp = '' +
        '<div class="table-wrap" style="margin-top:12px">' +
          '<table class="cmp"><thead><tr>' +
            '<th>候选</th><th>价格</th>' +
            keys.map(function (k) { return '<th>' + esc(k) + '</th>'; }).join('') +
            '<th>' + colLabel + '</th>' +
          '</tr></thead><tbody>' +
          poll.options.map(function (o) {
            var row = t.rows.filter(function (r) { return r.option.id === o.id; })[0];
            return '<tr>' +
              '<td><b>' + esc(o.name) + '</b></td>' +
              '<td>' + esc(price(o.price)) + '</td>' +
              keys.map(function (k) {
                var hit = (o.params || []).filter(function (p) { return p.k === k; })[0];
                if (!hit) return '<td class="cmp-no">—</td>';
                var v = hit.v == null ? '' : String(hit.v).trim();
                /* 写了这个参数就打「有」，顺带把具体值带上；
                   值只是把参数名又抄了一遍的情况就不重复显示 */
                return '<td class="cmp-yes">' +
                  '<span class="cmp-mark">有</span>' +
                  (v && v !== k ? '<span class="cmp-val">' + esc(v) + '</span>' : '') +
                  (markOnly && filled[k] === 1 ? '<span class="cmp-only">独有</span>' : '') +
                '</td>';
              }).join('') +
              '<td>' + esc(row ? row.score : 0) + '</td>' +
            '</tr>';
          }).join('') +
          '</tbody></table>' +
        '</div>' +
        '<p class="cmp-legend">「有」表示这个候选写了该参数，后面的小字是它填的值；' +
          (markOnly ? '「独有」表示只有这一个候选写了它；' : '') +
          '横杠表示没有这一项。</p>';
    }

    /* --- 权限提示：门槛只挡投票，不挡看结果 --- */
    var gateNotice = '';

    /* 已结束的投票优先显示结束横幅，不再谈门槛。
       手动结束和到点结束要分开说，否则用户会以为是发起者不想让人投了。 */
    if (closed) {
      var endedByDeadline = !poll.archived && timing.byDeadline;
      var endedAt = poll.closedAt || poll.deadline || poll.createdAt;
      gateNotice = '' +
        '<div class="ended-banner' + (endedByDeadline ? ' is-deadline' : '') + '" role="status">' +
          '<div class="ended-main">' +
            '<b>' + (endedByDeadline ? '到截止时间了，投票已经关闭' : '这次投票已经结束') + '</b>' +
            '<span>于 ' + esc(fmtShort(endedAt)) + ' ' +
              (endedByDeadline ? '自动关闭' : '由发起者关闭') + ' · ' +
              '共 ' + esc(t.total) + ' ' + (poll.type === 'rank' ? '人' : '票') + '</span>' +
          '</div>' +
          '<div class="ended-sub">结果、票型和投票人都在下面，只是不能再投了。' +
            (isOwner
              ? (endedByDeadline
                  ? '这次是到点自动结束，不需要你再操作。'
                  : '你是发起者，结束后的投票会留在归档里。')
              : '') +
          '</div>' +
        '</div>';
    } else if (!gateRes.ok && gateRes.needLogin) {
      gateNotice = '' +
        '<div class="gate-block" role="status">' +
          '<div class="gate-block-head">' +
            '<b>登录后才能投票</b>' +
            '<span class="tag">还没登录</span>' +
          '</div>' +
          '<p>票要记在某个人头上，信用分和分组才成立。现在可以先看结果。</p>' +
          '<a class="btn btn-primary btn-sm" href="' + esc(loginLink('#/poll/' + poll.id)) + '">登录 / 注册</a>' +
        '</div>';
    } else if (gate.key !== 'all') {
      if (gateRes.ok) {
        gateNotice = '' +
          '<div class="gate-note is-ok">' +
            '<b>投票门槛：' + esc(gate.label) + '</b>' +
            '<span>你符合条件（' + esc(gateRes.tierLabel) + '），可以投票。</span>' +
          '</div>';
      } else {
        gateNotice = '' +
          '<div class="gate-block" role="status">' +
            '<div class="gate-block-head">' +
              '<b>这次投票要求「' + esc(gate.label) + '」</b>' +
              '<span class="tag">你被门槛挡住了</span>' +
            '</div>' +
            '<p>门槛只看你过去的投票记录，不看这次投给谁；被挡住也不扣分。</p>' +
            '<ul class="gate-steps">' +
              '<li>你的档位：<b>' + esc(gateRes.tierLabel) + '</b>' +
                (gateRes.needSample
                  ? '（还要 ' + esc(Math.max(0, Store.THRESHOLD.MIN_SAMPLE - (Store.creditOf(Store.meId()) || { n: 0 }).n)) +
                    ' 次计入统计的投票才分档）'
                  : '') + '</li>' +
              '<li>这次要求：<b>' + esc(gate.label) + '</b>（规则与别人完全一致）</li>' +
              '<li>结果仍然对所有人可见</li>' +
            '</ul>' +
            '<div class="gate-block-actions">' +
              '<a class="btn btn-primary btn-sm" href="#/">去投几个不设门槛的</a>' +
              '<a class="btn btn-line btn-sm" href="#/rules">信用规则说明</a>' +
            '</div>' +
          '</div>';
      }
    }

    /* 私密投票：说明"为什么列表里搜不到" */
    var linkNotice = '';
    if (poll.visibility === 'link') {
      linkNotice = '' +
        '<div class="notice link-notice"><div>' +
          '这是一条<b>仅链接可见</b>的投票：首页列表里搜不到，拿到链接的人才能打开。' +
          (isOwner ? '（你是发起者，链接在下面可以复制。）' : '') +
        '</div></div>';
    }

    /* --- 重投提示：新增候选后，上一轮的人可以完整重投一次 --- */
    var revoteBanner = '';
    if (revoting) {
      revoteBanner = '' +
        '<div class="revote-banner is-active">' +
          '<div class="revote-text">' +
                '<b>候选更新了，可以重投一次</b>' +
            '<span>把全部 ' + esc(poll.options.length) + ' 个选项重新选一遍。' +
            '确认后，上一轮的选择会被覆盖，不保留。</span>' +
          '</div>' +
          '<div class="revote-actions">' +
            '<button type="button" class="btn btn-primary btn-sm" data-revote-confirm="1">' +
              '确认重投（覆盖上一轮）' +
            '</button>' +
            '<button type="button" class="btn btn-line btn-sm" data-revote-cancel="1">取消</button>' +
          '</div>' +
        '</div>';
    } else if (canRevote) {
      revoteBanner = '' +
        '<div class="revote-banner">' +
          '<div class="revote-text">' +
            '<b>候选在上一轮之后有更新</b>' +
            '<span>你在候选更新前投过票。现在可以重新完整投一次，' +
            '上一轮的选择会被覆盖。</span>' +
          '</div>' +
          '<button type="button" class="btn btn-line btn-sm" data-revote-start="1">重新投一次</button>' +
        '</div>';
    }

    /* --- 发起者工具：投票中增补候选（默认关闭） --- */
    var ownerTools = '';
    if (isOwner) {
      var revs = (poll.revisions || []).filter(function (r) { return r.type === 'add-option'; });
      var revList = revs.length
        ? '<ul class="rev-list">' + revs.map(function (r) {
            return '<li>第 ' + esc(r.round) + ' 次更新 · ' + esc(fmtShort(r.at)) + ' · ' + esc(r.name) + '</li>';
          }).join('') + '</ul>'
        : '';

      var addForm = poll.allowAddOption
        ? '<form id="addOptForm" class="add-opt-form" novalidate>' +
            '<div class="form-grid">' +
              '<div class="field">' +
                '<label for="addName">新候选名称</label>' +
                '<input class="input" id="addName" name="addName" maxlength="30" ' +
                       'placeholder="例：D · 温泉民宿，人均 780" required>' +
              '</div>' +
              '<div class="field">' +
                '<label for="addPrice">价格（可空）</label>' +
                '<input class="input" id="addPrice" name="addPrice" type="number" min="0" placeholder="780">' +
              '</div>' +
            '</div>' +
            '<div class="form-grid">' +
              '<div class="field">' +
                '<label for="addP1">参数1（可空）</label>' +
                '<input class="input" id="addP1" name="addP1" maxlength="16" placeholder="场地 民宿整栋">' +
              '</div>' +
              '<div class="field">' +
                '<label for="addP2">参数2（可空）</label>' +
                '<input class="input" id="addP2" name="addP2" maxlength="16" placeholder="雨天 室内温泉">' +
              '</div>' +
            '</div>' +
            '<label class="risk-check">' +
              '<input type="checkbox" name="addRisk" value="1">' +
              '<span>我明白：新增选项后，所有人都要重新完整投一次，原有投票会被覆盖，结果可能改变。</span>' +
            '</label>' +
            '<div class="form-actions">' +
              '<button type="submit" class="btn btn-primary btn-sm">新增候选并开启重投</button>' +
              '<span class="hint">当前 ' + esc(poll.options.length) + ' / 12 个候选</span>' +
            '</div>' +
          '</form>'
        : '';

      ownerTools = '' +
        '<section class="section" data-owner-tools>' +
          pageHead('发起者工具', '只有你能看到') +
          '<div class="card owner-tools">' +
            (closed
              ? '<div class="owner-row">' +
                  '<div>' +
                    '<b>' + (endedByDeadline ? '已到截止时间，自动关闭' : '这次投票已经结束') + '</b>' +
                    '<span class="owner-sub">' +
                      (endedByDeadline
                        ? '到点自动锁，不需要你再操作。想继续讨论，就复制链接再发一次新的投票。'
                        : '结果与票型都留在下面；结束后不能再改候选，也不能重新打开。') +
                    '</span>' +
                  '</div>' +
                  '<span class="status-tag is-done">已结束</span>' +
                '</div>'
              : '<div class="owner-row">' +
                  '<div>' +
                    '<b>投票中增补候选</b>' +
                    '<span class="owner-sub">默认关闭。打开后，投票进行中也能追加候选。</span>' +
                  '</div>' +
                  '<button type="button" class="btn btn-line btn-sm" data-toggle-add="1">' +
                    (poll.allowAddOption ? '关闭这个功能' : '打开') +
                  '</button>' +
                '</div>' +
                '<div class="risk-box">' +
                  '<b>风险提示</b> 新增选项会允许所有人重新完整投一次（不是只补投新选项），' +
                  '原有投票记录会被覆盖，可能改变最终结果。' +
                  (reopenRound ? ' 当前已增补 ' + esc(reopenRound) + ' 次。' : '') +
                '</div>' +
                (poll.allowAddOption
                  ? '<div class="owner-open">' + addForm + revList + '</div>'
                  : '<div class="owner-closed">功能已关闭，投票页不会出现新增候选入口。</div>') +
                (poll.allowMultiRound
                  ? '<div class="owner-row owner-row-next">' +
                      '<div>' +
                        '<b>开第 ' + esc(openRound + 1) + ' 轮</b>' +
                        '<span class="owner-sub">当前是第 ' + esc(openRound) + ' 轮。' +
                        '开下一轮会把这一轮的票冻结存档、票数从零重算，投过的人会收到通知。' +
                        ((Store.roundVotes(poll).length) ? '' : ' 现在还没人投，开了也只是空转。') + '</span>' +
                      '</div>' +
                      '<button type="button" class="btn btn-line btn-sm" data-next-round="1"' +
                        ((Store.roundVotes(poll).length) ? '' : ' disabled') + '>开下一轮</button>' +
                    '</div>'
                  : '') +
                '<div class="owner-row owner-row-end">' +
                  '<div>' +
                    '<b>结束这次投票</b>' +
                    '<span class="owner-sub">结束后不能再投，但结果、票型和投票人都会保留；' +
                    '投过票的人会收到一条站内消息。</span>' +
                  '</div>' +
                  '<button type="button" class="btn btn-line btn-sm" data-end-poll="1">结束投票</button>' +
                '</div>') +
          '</div>' +
        '</section>';
    }

    /* --- 投票人：仅实名投票展示。这里也是信用徽章与隐私开关的对外落点 --- */
    var voterList = '';
    if (!poll.anonymous && Store.roundVotes(poll).length) {
      var vItems = Store.roundVotes(poll).map(function (v) {
        var c = Store.creditOf(v.voterId);
        var badge = (global.Credit && c) ? Credit.badgeHtml(v.voterId, false) : '';
        var name = (c && c.name) || v.by || '匿名';
        var picked = (v.choice || []).map(function (oid) {
          var o = (poll.options || []).filter(function (x) { return x.id === oid; })[0];
          return o ? o.name : '';
        }).filter(Boolean).join('、');

        return '<li class="voter-item">' +
          '<span class="voter-item-name">' + esc(name) + '</span>' +
          badge +
          '<span class="voter-item-pick">' + esc(picked || '—') + '</span>' +
        '</li>';
      }).join('');

      voterList = '<div class="block-gap">' +
        pageHead('投票人', '实名投票，能看到谁投了什么') +
        '<div class="card"><ul class="voter-list">' + vItems + '</ul></div>' +
      '</div>';
    }

    var voteHint = '点一个就是投票，可重复修改';
    if (closed) voteHint = '投票已结束，这里只作结果对照';
    else if (!gateRes.ok) {
      voteHint = !Store.isLoggedIn()
        ? '登录后才能投票，用上方的「登录 / 注册」'
        : '当前不满足这次投票的门槛，条件见上方';
    }
    else if (revoting) voteHint = '重新选一遍，确认后覆盖上一轮';
    else if (canRevote) voteHint = '候选更新过，你可以完整重投一次';
    else if (gate.key !== 'all') voteHint = '门槛：' + gate.label;

    /* --- 规则卡：把"谁能投 / 能不能改 / 第几轮 / 何时结束"四件事置顶 ---
       分享出去的人第一眼就能判断这次投票值不值得参与。 */
    var ruleAllow = poll.allowAddOption
      ? (reopenRound ? '允许 · 已加 ' + reopenRound + ' 次' : '允许')
      : '不允许';
    var ruleRound = poll.allowMultiRound
      ? ('第 ' + openRound + ' 轮' + (openRound > 1 ? ' · 已存档 ' + (openRound - 1) + ' 轮' : ''))
      : '单轮';
    var ruleItems = [
      {
        k: '谁可以投', v: gate.label,
        s: gate.key === 'all' ? '不设信用门槛' : '需累计 5 次计入统计的投票'
      },
      {
        k: '候选增补', v: ruleAllow,
        s: poll.allowAddOption ? '增补后可改投一次，不算新一轮' : '锁死，中途不能加'
      },
      {
        k: '投票轮次', v: ruleRound,
        s: poll.allowMultiRound ? '发起者可手动开下一轮' : '一次投完就定，不会自动开新一轮'
      },
      {
        k: '截止', v: timing.label,
        s: timing.byDeadline ? '已自动关闭'
          : (poll.archived ? '已由发起者结束'
            : (timing.hasDeadline ? '到点自动锁，谁都不能再投' : '不限时，等发起者手动结束'))
      }
    ];
    var ruleCard = '<div class="rule-card" aria-label="这次投票的规则">' +
      ruleItems.map(function (it) {
        return '<div class="rule-item">' +
          '<span class="rule-k">' + esc(it.k) + '</span>' +
          '<b class="rule-v">' + esc(it.v) + '</b>' +
          '<span class="rule-s">' + esc(it.s) + '</span>' +
        '</div>';
      }).join('') + '</div>';

    return '' +
      '<div class="section-head">' +
        '<h2>' + esc(poll.title) + '</h2>' +
        '<span class="hint">' + esc(typeLabel(poll.type)) + ' · ' +
          (poll.anonymous ? '匿名' : '实名') + ' · ' + esc(t.total) + ' 票' +
          (poll.visibility === 'link' ? ' · 仅链接可见' : '') +
          (gate.key !== 'all' ? ' · 门槛：' + esc(gate.label) : '') +
          ' · ' + esc(mode.label) +
        '</span>' +
        (scene ? '<span class="tag">' + esc(scene.label) + '</span>' : '') +
      '</div>' +

      ruleCard +

      (poll.note
        ? '<div class="notice" style="margin-bottom:16px"><div>' + esc(poll.note) + '</div></div>'
        : '') +

      linkNotice +
      gateNotice +
      revoteBanner +

      '<section class="section" style="margin-top:0">' +
        pageHead('候选', voteHint) +
        '<div class="card-grid">' + voteCards + '</div>' +
      '</section>' +

      '<section class="section">' +
        pageHead('结果', '实时统计' + (mode.key === 'simple' ? ' · 精简展示' : '')) +
        conclusion +
        srcBar +
        (mode.key === 'full' && global.Credit ? Credit.insightHtml(poll) : '') +
        '<div class="card result-chart' + (donut ? ' has-donut' : '') + '" style="margin-top:12px">' +
          '<div class="chart-bars">' + bars + '</div>' +
          (donut ? '<div class="chart-donut">' + donut + '</div>' : '') +
        '</div>' +
        recapHtml(poll, t) +
        (mode.key === 'simple'
          ? '<div class="notice mode-note"><div>发起者把结果展示设为<b>精简结论</b>：' +
            '只给结论和票数，不展示分歧洞察与信用分组。</div></div>'
          : '') +
        (mode.key === 'full' && global.Credit ? Credit.panelHtml(poll) : '') +
        (mode.key === 'full' && global.Credit ? Credit.tagPickerHtml(poll) : '') +
        (cmp ? '<div class="block-gap">' + pageHead('横向对比', '') + cmp + '</div>' : '') +
        voterList +
      '</section>' +

      ownerTools +

      '<section class="section">' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
          '<button type="button" class="btn btn-primary" data-share="1">分享链接</button>' +
          '<a class="btn btn-line" href="#/">返回</a>' +
          '<button type="button" class="btn btn-line" data-to-guide="1">存成攻略</button>' +
          '<a class="btn btn-line" href="#/credit">我的信用</a>' +
        '</div>' +
        '<div id="shareHost"></div>' +
      '</section>';
  }

  /**
   * 投票记录摘要：只给统计量。
   * 匿名投票在这里也只有"多少人、多少票"，不会因为要看摘要而暴露个人选择。
   */
  function recapHtml(poll, t) {
    var votes = Store.roundVotes(poll);
    var people = {};
    votes.forEach(function (v) { if (v.voterId) people[v.voterId] = 1; });
    var peopleCount = Object.keys(people).length;

    var touched = t.rows.filter(function (r) { return r.score > 0; }).length;
    var leadPct = (t.total && !t.tie && t.winners[0])
      ? Math.round(t.winners[0].score / t.total * 100) : 0;

    var items = [
      { k: '参与人数', v: String(peopleCount), u: '人' },
      { k: '总票数', v: String(t.total), u: '票' },
      { k: '被选过', v: touched + ' / ' + (poll.options || []).length, u: '个候选' },
      { k: '领先占比', v: t.tie ? '打平' : String(leadPct), u: t.tie ? '' : '%' }
    ];

    var grid = items.map(function (it) {
      return '<div class="recap-item">' +
        '<span class="recap-k">' + esc(it.k) + '</span>' +
        '<b class="recap-v">' + esc(it.v) + (it.u ? '<i>' + esc(it.u) + '</i>' : '') + '</b>' +
      '</div>';
    }).join('');

    var logRows = '';
    if ((poll.roundLog || []).length) {
      logRows = '<ol class="recap-log">' + poll.roundLog.map(function (r) {
        var lead = r.tie ? '打平，没有唯一优胜项'
          : (r.lead ? ('结论是「' + r.lead + '」') : '没有票');
        return '<li><b>第 ' + esc(r.round) + ' 轮</b>' +
          '<span>' + esc(r.total) + ' 票 · ' + esc(lead) + '</span></li>';
      }).join('') + '</ol>';
    }

    return '' +
      '<div class="recap">' +
        '<div class="recap-head">' +
          '<b>投票记录摘要</b>' +
          '<span>' + (poll.anonymous ? '匿名投票 · ' : '') + '只统计，不暴露个人选择</span>' +
        '</div>' +
        '<div class="recap-grid">' + grid + '</div>' +
        logRows +
        '<p class="recap-note">' +
          (poll.anonymous
            ? '这次是匿名投票：页面不展示任何投票人姓名，也不会因为看摘要而泄露谁投了什么。'
            : '这次是实名投票：只展示昵称与信用档位，不展示手机号；上方摘要仍是纯统计量。') +
        '</p>' +
      '</div>';
  }

  /** 分享面板：链接 + 可见性说明 + 复制。原地展开，不弹窗 */
  function shareHtml(poll) {
    var isLink = poll.visibility === 'link';
    var url = pollUrl(poll.id);

    return '' +
      '<div class="share-box" role="group" aria-label="分享这次投票">' +
        '<div class="share-head">' +
          '<span class="share-title">' + (isLink ? '这条链接是唯一入口' : '把链接发给他们') + '</span>' +
          '<span class="vis-badge' + (isLink ? ' is-link' : '') + '">' +
            (isLink ? '仅链接可见' : '公开') +
          '</span>' +
        '</div>' +
        '<p class="share-sub">' + (isLink
          ? '首页列表里查不到这次投票，只有拿到这条链接的人能打开。发到哪个群，就等于让那个群里的人投。'
          : '这次投票已经在首页列表里，谁都能自己找到。链接只是让你能直接转发到群里。') +
        '</p>' +
        '<div class="share-field">' +
          '<input class="input share-url" id="shareUrl" value="' + esc(url) + '" readonly aria-label="投票链接">' +
          '<button type="button" class="btn btn-primary btn-sm" data-copy="1">复制</button>' +
        '</div>' +
        '<p class="share-note">' +
          (isLink
            ? '链接里的投票编号就是这次私密投票的钥匙：猜不到，列表里也搜不到。'
            : '') +
          (cloudOn()
            ? (window.PFSync.pending && PFSync.pending(poll.id)
                ? '这条投票还在往云端同步，等一两秒再发；现在发出去别人可能打不开。'
                : '这条投票已同步到云端，谁拿到链接、在别的设备上打开，看到的都是同一份。')
            : '离线版的数据存在本机浏览器里，换一台设备打开是空的；部署到线上之后，这条链接才是所有人共享的同一条投票。') +
        '</p>' +
      '</div>';
  }

  function myVoteOf(poll) {
    return Store.myVoteIn(poll);
  }

  /** 写票时用的显示名：来自当前账号 */
  function getMe() {
    return Store.myName() || '访客';
  }

  function bindPoll(root, id, rerender) {
    var poll = Store.getAnyPoll(id);
    if (!poll) return;

    /* 写一票（普通投票）。重投走单独的确认分支，不经过这里 */
    function castVote(oid) {
      var meId = Store.meId();
      if (!meId) { askLogin('#/poll/' + poll.id); return; }

      /* 写之前先取最新的一份：渲染之后发起者可能已经结束了这场投票。
         拿旧快照整份保存会把 archived=false 写回本地，还会推回云端。 */
      var cur = Store.getAnyPoll(poll.id) || poll;
      if (Store.isClosed(cur)) {
        D.toast('这次投票已经结束了，下面是结果');
        rerender();
        return;
      }

      var me = getMe();
      /* 只基于当前轮的票重写，上一轮的残留不会跟着写回去 */
      var votes = Store.roundVotes(cur).filter(function (v) { return v.voterId !== meId; });
      var prev = myVoteOf(cur);
      var round = cur.reopenRound || 0;

      if (cur.type === 'multi' && prev && (prev.choice || []).indexOf(oid) >= 0) {
        var next = (prev.choice || []).filter(function (x) { return x !== oid; });
        if (next.length) {
          votes.push({
            id: Store.uid('v'), voterId: meId, by: me,
            at: new Date().toISOString(), choice: next, round: round
          });
        }
      } else if (cur.type === 'multi' && prev) {
        votes.push({
          id: Store.uid('v'), voterId: meId, by: me, at: new Date().toISOString(),
          choice: (prev.choice || []).concat([oid]), round: round
        });
      } else {
        votes.push({
          id: Store.uid('v'), voterId: meId, by: me,
          at: new Date().toISOString(), choice: [oid], round: round
        });
      }

      cur.votes = votes;
      Store.save('polls', cur);
      lastVotedId = oid;
    }

    D.on(root, 'click', '[data-vote]', function (e, el) {
      var oid = el.getAttribute('data-vote');

      /* 门槛与结束判定都放在点击时再跑一次，不依赖渲染时的快照 */
      var gateRes = Store.canVote(Store.getAnyPoll(poll.id) || poll, Store.meId());
      if (!gateRes.ok) {
        if (gateRes.needLogin) { askLogin('#/poll/' + poll.id); return; }
        D.toast(gateRes.reason);
        return;
      }

      /* 重投模式：只改内存里的暂存选择，确认后才覆盖旧票 */
      if (pendingRevote && pendingRevote.pollId === poll.id) {
        var choice = pendingRevote.choice.slice();
        var at = choice.indexOf(oid);

        if (poll.type === 'multi') {
          if (at >= 0) choice.splice(at, 1); else choice.push(oid);
        } else {
          choice = [oid];
        }

        pendingRevote.choice = choice;
        rerender();
        return;
      }

      castVote(oid);
      D.toast('已记录你的一票');
      rerender();
      setTimeout(function () { lastVotedId = null; }, 420);
    });

    /* --- 发起者结束投票 --- */
    D.on(root, 'click', '[data-end-poll]', function () {
      var here = Store.getAnyPoll(poll.id);
      if (!here || Store.isClosed(here)) { D.toast('这次投票已经结束了'); return; }
      var ok = window.confirm('结束后不能再投，但结果、票型和投票人都会保留。确定结束？');
      if (!ok) return;

      var res = Store.endPoll(poll.id, Store.meId());
      if (!res.ok) { D.toast(res.reason); return; }
      D.toast(res.notified
        ? ('已结束，通知了 ' + res.notified + ' 位投票人')
        : '投票已结束');
      rerender();
    });

    /* --- 发起者开下一轮（多轮投票） --- */
    D.on(root, 'click', '[data-next-round]', function () {
      var here = Store.getAnyPoll(poll.id);
      if (!here) return;
      var cur = here.round || 1;
      var total = (here.votes || []).length;
      if (!total) { D.toast('这一轮还没人投票，开下一轮没有意义'); return; }

      var ok = window.confirm(
        '开第 ' + (cur + 1) + ' 轮？\n\n' +
        '第 ' + cur + ' 轮的 ' + total + ' 票会冻结存档，页面上的票数从 0 重新算。\n' +
        '投过的人会收到一条通知，可以重新投。'
      );
      if (!ok) return;

      var res = Store.startNextRound(poll.id, Store.meId());
      if (!res.ok) { D.toast(res.reason); return; }
      D.toast('已开始第 ' + res.round + ' 轮' +
        (res.notified ? '，通知了 ' + res.notified + ' 人' : ''));
      rerender();
    });

    /* --- 完整重投：开始 / 取消 / 确认 --- */
    D.on(root, 'click', '[data-revote-start]', function () {
      pendingRevote = { pollId: poll.id, choice: [] };
      D.toast('重投模式：选完点「确认重投」，上一轮会被覆盖');
      rerender();
    });

    D.on(root, 'click', '[data-revote-cancel]', function () {
      pendingRevote = null;
      rerender();
    });

    D.on(root, 'click', '[data-revote-confirm]', function () {
      if (!pendingRevote || pendingRevote.pollId !== poll.id) return;
      if (!pendingRevote.choice.length) {
        D.toast('至少选一个选项再确认');
        return;
      }

      var meId = Store.meId();
      var me = getMe();
      var now = Store.getAnyPoll(poll.id);
      if (!now) { D.toast('这次投票不存在了'); return; }
      if (Store.isClosed(now)) {
        pendingRevote = null;
        D.toast('这次投票已经结束了，不能再重投');
        rerender();
        return;
      }
      if (!meId) { askLogin('#/poll/' + poll.id); return; }

      var votes = (now.votes || []).filter(function (v) { return v.voterId !== meId; });
      votes.push({
        id: Store.uid('v'), voterId: meId, by: me,
        at: new Date().toISOString(),
        choice: pendingRevote.choice.slice(),
        round: now.reopenRound || 0,
        revoted: true
      });

      now.votes = votes;
      now.revisions = (now.revisions || []).concat([{
        at: new Date().toISOString(), type: 'revote', round: now.reopenRound || 0
      }]);
      Store.save('polls', now);

      pendingRevote = null;
      D.toast('已重新投票，上一轮记录已覆盖');
      rerender();
    });

    /* --- 发起者：开关「投票中增补候选」 --- */
    D.on(root, 'click', '[data-toggle-add]', function () {
      var now = Store.get('polls', poll.id);
      if (!now) return;
      now.allowAddOption = !now.allowAddOption;
      Store.save('polls', now);
      D.toast(now.allowAddOption
        ? '已打开：投票进行中可以增补候选'
        : '已关闭增补候选');
      rerender();
    });

    /* --- 发起者：新增候选（必须勾风险确认） --- */
    root.addEventListener('submit', function (e) {
      var form = e.target;
      if (!form || form.id !== 'addOptForm') return;
      e.preventDefault();

      var now = Store.get('polls', poll.id);
      if (!now || !now.allowAddOption) {
        D.toast('「投票中增补候选」已经关闭');
        return;
      }

      var nameEl = D.$('[name="addName"]', form);
      var name = nameEl ? nameEl.value.trim() : '';
      if (!name) { D.toast('先填新候选的名称'); return; }

      var risk = D.$('[name="addRisk"]', form);
      if (!risk || !risk.checked) {
        D.toast('先勾选风险提示，再新增候选');
        return;
      }

      var p1El = D.$('[name="addP1"]', form);
      var p2El = D.$('[name="addP2"]', form);
      var params = [];
      if (p1El && p1El.value.trim()) params.push(splitParam(p1El.value.trim()));
      if (p2El && p2El.value.trim()) params.push(splitParam(p2El.value.trim()));

      var priceEl = D.$('[name="addPrice"]', form);
      var r = Store.addOptionDuringPoll(now, {
        name: name,
        price: priceEl ? priceEl.value : '',
        params: params
      }, Store.meId());

      if (!r.ok) {
        if (r.reason === 'too-many') D.toast('最多 12 个候选');
        else if (r.reason === 'empty') D.toast('名称不能为空');
        else D.toast('新增失败，请重试');
        return;
      }

      D.toast('已新增「' + r.option.name + '」' +
        (r.notified ? '，已通知 ' + r.notified + ' 位投过票的人' : '') +
        '。之前的票仍然有效，也可以改投');
      rerender();
    });

    D.on(root, 'click', '[data-suggest]', function () {
      var box = D.$('#suggestBox', root);
      if (!box) return;
      box.innerHTML = suggestHtml(poll);
    });

    /* 计算来源切换：只改展示来源，不改数据 */
    D.on(root, 'click', '[data-toggle-src]', function () {
      var next = Store.computeSource() === 'skill' ? 'local' : 'skill';
      Store.setComputeSource(next);
      D.toast(next === 'skill' ? '已切到技能内核' : '已切到本地预演');
      rerender();
    });

    D.on(root, 'click', '[data-to-guide]', function () {
      var g = guideFromPoll(poll);
      Store.save('guides', g);
      D.toast('已存成攻略');
      location.hash = '#/guides';
    });

    /* --- 分享 --- */
    function openShare() {
      var host = D.$('#shareHost', root);
      if (!host) return;
      if (host.innerHTML) { host.innerHTML = ''; return; }   // 再点一次收起
      host.innerHTML = shareHtml(poll);
      var input = D.$('#shareUrl', root);
      if (input) {
        // preventScroll：面板就在按钮下方，别把整页顶走
        try { input.focus({ preventScroll: true }); } catch (e) { input.focus(); }
        input.select();
        /* 点"分享链接"就等于复制：不用再找第二个按钮 */
        var copyBtn = D.$('[data-copy]', host);
        copyText(input.value, input).then(function () {
          if (copyBtn) copyBtn.textContent = '已复制';
          D.toast('链接已复制，去粘贴就行');
        }).catch(function () {
          if (copyBtn) copyBtn.textContent = '按 Ctrl+C';
          D.toast('链接已选中，按 Ctrl+C 复制');
        });
      }
      /* 刚建完的投票还在上传：同步完了把"等一等"换成"可以发了" */
      if (cloudOn() && window.PFSync.pending && PFSync.pending(poll.id)) {
        setTimeout(function () {
          if (!host.innerHTML) return;
          host.innerHTML = shareHtml(poll);
          var again = D.$('#shareUrl', host);
          if (again) {
            try { again.focus({ preventScroll: true }); } catch (e) { again.focus(); }
            again.select();
          }
        }, 1600);
      }
    }

    D.on(root, 'click', '[data-share]', function () { openShare(); });

    D.on(root, 'focusin', '#shareUrl', function (e, el) { el.select(); });

    D.on(root, 'click', '[data-copy]', function (e, btn) {
      var input = D.$('#shareUrl', root);
      if (!input) return;
      copyText(input.value, input).then(function () {
        btn.textContent = '已复制';
        D.toast('链接已复制');
        setTimeout(function () { btn.textContent = '复制'; }, 1600);
      }).catch(function () {
        try { input.focus({ preventScroll: true }); } catch (e) { input.focus(); }
        input.select();
        btn.textContent = '按 Ctrl+C';
        D.toast('浏览器不允许自动复制，链接已选中，按 Ctrl+C');
      });
    });

    /* 刚建完「仅链接」的投票：直接把面板打开，别让人自己去找入口 */
    try {
      if (sessionStorage.getItem('pf:justShared') === poll.id) {
        sessionStorage.removeItem('pf:justShared');
        openShare();
      }
    } catch (e) { /* 隐私模式 */ }

    if (global.Credit) Credit.bind(root, rerender);
  }

  /**
   * 平票兜底：先用价格 + 预算权重给建议，并说明理由。
   * ⚠️ 临时实现：迁移后由 option-scorer 工作流返回建议与理由。
   */
  function suggestHtml(poll) {
    var t = Store.tally(poll);
    var tied = t.winners.map(function (w) { return w.option; });
    var budgetW = (poll.weights && poll.weights.budget) || 40;

    var withPrice = tied.filter(function (o) { return o.price != null && !isNaN(o.price); });
    var pick, reason;

    if (withPrice.length >= 2) {
      pick = withPrice.slice().sort(function (a, b) { return a.price - b.price; })[0];
      var others = withPrice.filter(function (o) { return o.id !== pick.id; });
      var diff = others[0].price - pick.price;
      reason = '你给"预算"设的权重是 ' + budgetW + '%，' +
        pick.name + ' 比 ' + others[0].name + ' 便宜 ' + price(diff) +
        '，在票数相同的情况下按预算维度优先。';
    } else {
      pick = tied[0];
      reason = '这几个的价格信息不全，先按参数完整度选 ' + pick.name +
        '。建议补上价格后重新看一次。';
    }

    return '' +
      '<div class="suggest-box">' +
        '<div class="suggest-label">建议</div>' +
        '<div class="suggest-main">选 ' + esc(pick.name) + '</div>' +
        '<div class="suggest-why">' + esc(reason) + '</div>' +
        '<div class="suggest-note">这是按你设定的权重的建议，不是投票结果。你可以不采纳。</div>' +
      '</div>';
  }

  /** 从投票生成攻略草稿（四区块结构）
      优先交给 guide-writer 技能（浏览器镜像），镜像缺失或抛错时回退下面的本地实现。 */
  function guideFromPoll(poll) {
    if (typeof Guide !== 'undefined' && Guide && Guide.build) {
      try {
        var dec = Store.decisionOf ? Store.decisionOf(poll) : null;
        var res = Guide.build({ poll: poll, result: dec ? dec.result : null });
        if (res && res.ok && res.draft) return res.draft;
      } catch (e) { /* 落到本地实现 */ }
    }

    var t = Store.tally(poll);
    var winner = t.winners[0] ? t.winners[0].option : poll.options[0];

    var prices = poll.options
      .map(function (o) { return o.price; })
      .filter(function (p) { return p != null && !isNaN(p); })
      .sort(function (a, b) { return a - b; });

    var budget = [];
    if (prices.length >= 2) {
      budget = [
        { label: '低档 ≤ ' + price(prices[0]), note: '最省，参数通常要妥协' },
        { label: '中档 ' + price(prices[0]) + ' — ' + price(prices[prices.length - 1]), note: '本次候选主要落在这个区间' },
        { label: '高档 ≥ ' + price(prices[prices.length - 1]), note: '预算够再考虑' }
      ];
    } else {
      budget = [{ label: '待补充', note: '这次没填价格，补上后会更准' }];
    }

    var keys = [];
    poll.options.forEach(function (o) {
      (o.params || []).forEach(function (p) {
        if (p.k && keys.indexOf(p.k) < 0) keys.push(p.k);
      });
    });

    return {
      title: poll.title + ' · 选购要点',
      fromPollId: poll.id,
      budget: budget,
      params: (keys.length ? keys : ['待补充']).map(function (k) {
        return { name: k, why: '这次比较时用到的维度' };
      }),
      audience: [{ who: '多数人', pick: winner.name + '（' + t.max + ' 分最高）' }],
      pitfalls: ['参数以实际商品页为准，本文来自 ' + (poll.votes || []).length + ' 票的投票结果']
    };
  }

  /* ============================================================
     攻略
     ============================================================ */

  /* ---------- 攻略：hash 查询参数（搜索 / 分类） ---------- */

  function hashQuery() {
    var h = location.hash || '';
    var i = h.indexOf('?');
    var out = {};
    if (i < 0) return out;
    h.slice(i + 1).split('&').forEach(function (kv) {
      if (!kv) return;
      var p = kv.split('=');
      out[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
    });
    return out;
  }

  var GUIDE_EMOJI = { '数码': '📱', '家电': '🔌', '日用': '💡', '户外': '🏕️', '饮食': '🍳', '其他': '📦' };

  function guideEmoji(g) {
    return GUIDE_EMOJI[g && g.category] || '📦';
  }

  function guideCatChips(cat) {
    var rows = [{ key: 'all', label: '全部' }].concat(Store.GUIDE_CATS.map(function (c) {
      return { key: c, label: c };
    }));
    return rows.map(function (c) {
      return '<button type="button" class="chip' + (cat === c.key ? ' is-on' : '') + '"' +
        ' data-guide-cat="' + esc(c.key) + '">' + esc(c.label) + '</button>';
    }).join('');
  }

  function guideCardHtml(g) {
    var fav = Store.isFav(g.id);
    var cover = (g.images && g.images[0]) || g.cover || '';
    var points = (g.budget || []).length + (g.params || []).length +
      (g.audience || []).length + (g.pitfalls || []).length;
    return '' +
      '<div class="card guide-card" data-guide-id="' + esc(g.id) + '">' +
        '<a class="guide-card-main" href="#/guide/' + esc(g.id) + '">' +
          (cover
            ? '<img class="guide-thumb" src="' + esc(cover) + '" alt="" loading="lazy">'
            : '<div class="guide-thumb is-empty" aria-hidden="true">' + esc(guideEmoji(g)) + '</div>') +
          '<div class="guide-card-body">' +
            '<span class="chip-sm">' + esc(g.category || '其他') + '</span>' +
            '<h3>' + esc(g.title) + '</h3>' +
            '<p class="guide-sum">' + esc(g.summary || '四区块结构化攻略') + '</p>' +
            '<p class="guide-meta">' + esc(g.author || '匿名') + ' · ' + points + ' 条要点 · ' +
              esc(ago(g.createdAt)) + (g.fromPollId ? ' · 来自一次投票' : '') + '</p>' +
          '</div>' +
        '</a>' +
        '<button type="button" class="fav-btn' + (fav ? ' is-on' : '') + '"' +
                ' data-fav="' + esc(g.id) + '" aria-pressed="' + (fav ? 'true' : 'false') + '">' +
          (fav ? '★ 已收藏' : '☆ 收藏') +
        '</button>' +
      '</div>';
  }

  function renderGuides() {
    var q = hashQuery();
    var cat = q.cat || 'all';
    var kw = q.q || '';
    var guides = Store.findGuides(kw, cat);
    var total = Store.guides().length;

    var grid = guides.length
      ? guides.map(guideCardHtml).join('')
      : emptyBox('没有匹配的攻略', '换个关键词，或切回"全部"分类。', '');

    return '' +
      pageHead('选品攻略', total + ' 篇 · 四区块结构',
        '<a class="btn btn-primary btn-sm" href="#/guide/new">投稿攻略</a>') +
      subTabs('guides') +
      '<div class="notice" style="margin-bottom:14px">' +
        '<div>攻略固定四块：<b>预算档位 / 关键参数 / 适用人群 / 避坑点</b>。' +
        '因为它有固定结构，所以能被检索、也能反过来生成新投票。</div>' +
      '</div>' +
      '<div class="filter-bar">' +
        '<input type="search" class="input filter-search" id="guideSearch" data-guide-search' +
          ' placeholder="搜标题、参数、避坑点" value="' + esc(kw) + '">' +
        '<span class="result-count" id="guideCount">' + guides.length + ' 篇</span>' +
      '</div>' +
      '<div class="chip-row" id="guideCats">' + guideCatChips(cat) + '</div>' +
      '<div class="card-grid" id="guideGrid">' + grid + '</div>';
  }

  /* 收藏统一入口：未登录先引导登录，其余交给 Store */
  function handleFav(guideId, rerender) {
    var res = Store.toggleFav(guideId);
    if (!res.ok) {
      if (res.reason === 'login') { askLogin(location.hash || '#/guides'); return; }
      D.toast('收藏失败');
      return;
    }
    D.toast(res.fav ? '已收藏这篇攻略' : '已取消收藏');
    if (rerender) rerender();
  }

  function bindGuides(root, rerender) {
    D.on(root, 'click', '[data-fav]', function (e, el) {
      e.preventDefault();
      handleFav(el.getAttribute('data-fav'), rerender);
    });

    /* 分类：写进 hash，浏览器后退能回到上一个筛选 */
    D.on(root, 'click', '[data-guide-cat]', function (e, el) {
      var cat = el.getAttribute('data-guide-cat');
      var q = hashQuery();
      var parts = [];
      if (q.q) parts.push('q=' + encodeURIComponent(q.q));
      if (cat && cat !== 'all') parts.push('cat=' + encodeURIComponent(cat));
      location.hash = '#/guides' + (parts.length ? '?' + parts.join('&') : '');
    });

    /* 搜索：只重绘列表，不整页渲染，输入框不会失焦 */
    var input = D.$('#guideSearch', root);
    var grid = D.$('#guideGrid', root);
    var count = D.$('#guideCount', root);
    var onChip = D.$('.chip.is-on', root);
    var activeCat = onChip ? onChip.getAttribute('data-guide-cat') : 'all';

    function repaint() {
      if (!grid) return;
      var list = Store.findGuides(input ? input.value : '', activeCat || 'all');
      grid.innerHTML = list.length
        ? list.map(guideCardHtml).join('')
        : emptyBox('没有匹配的攻略', '换个关键词，或切回"全部"分类。', '');
      if (count) count.textContent = list.length + ' 篇';
    }

    if (input) {
      var timer = null;
      input.addEventListener('input', function () {
        clearTimeout(timer);
        timer = setTimeout(repaint, 160);
      });
    }
  }

  function bindGuide(root, id, rerender) {
    D.on(root, 'click', '[data-fav]', function (e, el) {
      e.preventDefault();
      handleFav(el.getAttribute('data-fav') || id, rerender);
    });
  }

  function linkedPollHtml(pollId) {
    if (!pollId) return '';
    var p = Store.get('polls', pollId);
    if (!p) return '';
    var t = Store.tally(p);
    var top = t.rows[0];
    return '' +
      '<section class="section">' +
        pageHead('关联投票案例', '这篇攻略就是从那场讨论里沉淀出来的') +
        '<a class="card poll-link-card" href="#/poll/' + esc(p.id) + '">' +
          '<div class="poll-link-info">' +
            '<h3>' + esc(p.title) + '</h3>' +
            '<p>' + t.total + ' 票 · ' +
              (top && t.total ? '当前领先：' + esc(top.option.name) + '（' + top.score + ' 票）'
                              : '还没有人投') + '</p>' +
          '</div>' +
          '<span class="go">去看投票 →</span>' +
        '</a>' +
      '</section>';
  }

  function renderGuide(id) {
    var g = Store.guide(id);
    if (!g) {
      return statePage({
        tone: 'muted', code: '404', icon: '?',
        title: '这篇攻略不存在了',
        text: '可能是作者删掉了它，也可能链接少了几位。攻略广场里的其它几篇还在。',
        detail: '<div class="state-kv"><span>你打开的攻略 id</span><code>' + esc(id || '（空）') + '</code></div>',
        actions: [
          { label: '回到攻略广场', href: '#/guides', primary: true },
          { label: '自己写一篇', href: '#/guide/new' }
        ],
        links: [{ label: '信用规则说明', href: '#/rules' }]
      });
    }
    var favNow = Store.isFav(g.id);
    var cover = (g.images && g.images[0]) || g.cover || '';

    function rowsHtml(list, k1, k2, fallback) {
      return (list || []).map(function (r) {
        return '<div class="spec-row"><b>' + esc(r[k1] || '') + '</b>' +
          '<span>' + esc(r[k2] || '') + '</span></div>';
      }).join('') || '<div class="spec-empty">' + esc(fallback) + '</div>';
    }

    function block(title, rows) {
      return '<section class="section section-tight">' +
        pageHead(title) +
        '<div class="card">' + rows + '</div>' +
      '</section>';
    }

    var pitfalls = (g.pitfalls || []).map(function (p) {
      return '<li>' + esc(p) + '</li>';
    }).join('') || '<li class="spec-empty">待补充</li>';

    var links = (g.links || []).length
      ? '<section class="section section-tight">' +
          pageHead('参考链接', '投稿者自己补充的出处') +
          '<div class="card link-list">' +
            g.links.map(function (l) {
              return '<a href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer">' +
                esc(l.label || l.url) + ' ↗</a>';
            }).join('') +
          '</div>' +
        '</section>'
      : '';

    return '' +
      '<div class="guide-hero">' +
        (cover
          ? '<img class="guide-cover" src="' + esc(cover) + '" alt="">'
          : '<div class="guide-cover is-empty" aria-hidden="true">' + esc(guideEmoji(g)) + '</div>') +
        '<div class="guide-hero-info">' +
          '<span class="chip-sm">' + esc(g.category || '其他') + '</span>' +
          '<h1>' + esc(g.title) + '</h1>' +
          (g.summary ? '<p class="guide-sum">' + esc(g.summary) + '</p>' : '') +
          '<p class="guide-meta">' + esc(g.author || '匿名') + ' 投稿 · ' + esc(ago(g.createdAt)) + '</p>' +
        '</div>' +
      '</div>' +
      block('预算档位', rowsHtml(g.budget, 'label', 'note', '待补充')) +
      block('关键参数', rowsHtml(g.params, 'name', 'why', '待补充')) +
      block('适用人群', rowsHtml(g.audience, 'who', 'pick', '待补充')) +
      block('避坑点', '<ul class="pitfall-list">' + pitfalls + '</ul>') +
      links +
      linkedPollHtml(g.fromPollId) +

  function collectRows(root, prefix, k1, k2, n) {
    var out = [];
    for (var i = 0; i < n; i++) {
      var a = D.$('[data-g="' + prefix + '.' + i + '.' + k1 + '"]', root);
      var b = D.$('[data-g="' + prefix + '.' + i + '.' + k2 + '"]', root);
      var o = {};
      o[k1] = a ? a.value.trim() : '';
      o[k2] = b ? b.value.trim() : '';
      if (o[k1] || o[k2]) out.push(o);
    }
    return out;
  }

  function bindGuideNew(root) {
    var btn = D.$('[data-guide-submit]', root);
    if (!btn) return;
    btn.addEventListener('click', function () {
      var pitfallsRaw = (D.$('#gPitfalls', root) || {}).value || '';
      var res = Store.createGuide({
        title: (D.$('#gTitle', root) || {}).value || '',
        category: (D.$('#gCat', root) || {}).value || '其他',
        summary: (D.$('#gSummary', root) || {}).value || '',
        cover: (D.$('#gCover', root) || {}).value || '',
        fromPollId: (D.$('#gPoll', root) || {}).value || '',
        budget: collectRows(root, 'budget', 'label', 'note', 3),
        params: collectRows(root, 'params', 'name', 'why', 4),
        audience: collectRows(root, 'audience', 'who', 'pick', 3),
        pitfalls: pitfallsRaw.split('\n').map(function (s) { return s.trim(); }).filter(Boolean),
        links: collectRows(root, 'links', 'label', 'url', 2)
      });
      if (!res.ok) {
        D.toast(res.error || '发布失败');
        return;
      }
      D.toast('攻略已发布');
      location.hash = '#/guide/' + res.id;
    });
  }

  function bindSwap(root, rerender) {
    D.on(root, 'click', '[data-swap-cat]', function (e, el) {
      var c = el.getAttribute('data-swap-cat');
      location.hash = '#/swap' + (c === 'all' ? '' : '?cat=' + encodeURIComponent(c));
    });

    /* ---- swap-matcher：按我的意向给列表排序 ---- */
    var SWAP_BAND = { high: '很合适', mid: '可以考虑', low: '差得较远' };

    D.on(root, 'click', '[data-swmatch]', function () {
      var box = D.$('#swmatchOut', root);
      if (!box) return;
      var me = Store.meId();
      if (!me) { D.toast('登录后才能按自己的意向匹配'); return; }

      var all = Store.swaps();
      var mine = all.filter(function (s) { return s.owner === me; });
      if (!mine.length) {
        box.hidden = false;
        box.innerHTML = '<div class="dz-note">你还没发过交换单。先发一条「我有 X 想换 Y」，' +
          '才有东西可比。</div>';
        return;
      }

      var res = null;
      try {
        if (typeof SwapMatch !== 'undefined' && SwapMatch && SwapMatch.build) {
          res = SwapMatch.build({
            me: { id: me }, mine: mine, list: all, now: Date.now(), limit: 8
          });
        }
      } catch (e) { res = null; }

      if (!res || !res.ok) {
        box.hidden = false;
        box.innerHTML = '<div class="dz-note">匹配内核没加载，暂时算不了。</div>';
        return;
      }

      var byId = {};
      all.forEach(function (s) { byId[s.id] = s; });

      box.hidden = false;
      if (!res.matches.length) {
        box.innerHTML = '<div class="dz-note">列表里没有别人可申请的交换，等有人发布再来。</div>';
        return;
      }

      box.innerHTML = '<div class="sm-sum">按你的 ' + mine.length + ' 张交换单比了 ' +
        res.meta.scanned + ' 条，最值得点开的 ' + res.matches.length + ' 条：</div>' +
        res.matches.map(function (m) {
          var s = byId[m.swapId] || {};
          var h = s.have || {};
          return '<a class="sm-item" href="#/swap/' + esc(m.swapId) + '">' +
            '<span class="sm-score is-' + esc(m.band) + '">' + Math.round(m.score) +
              '<i>分</i><em>' + esc(SWAP_BAND[m.band] || '') + '</em></span>' +
            '<span class="sm-body">' +
              '<b>' + esc(h.name || '交换单') + '</b>' +
              '<span class="sm-meta">' + esc(h.category || '其他') +
                (h.value ? ' · ' + price(h.value) : '') +
                (h.condition ? ' · ' + esc(h.condition) : '') + '</span>' +
              '<span class="sm-why">' + esc(m.reasons.join('；')) + '</span>' +
              (m.gaps.length ? '<span class="sm-gap">注意：' + esc(m.gaps.join('、')) + '</span>' : '') +
            '</span>' +
          '</a>';
        }).join('');
    });
  }

      D.toast('申请已发出，等对方确认');

    });

    D.on(root, 'click', '[data-req]', function (e, el) {
      var reqId = el.getAttribute('data-req');
      var act = el.getAttribute('data-act');
      var res = act === 'done' ? Store.completeReq(reqId) : Store.decideReq(reqId, act);
      if (!res.ok) {
        if (res.reason === 'login') { askLogin('#/swap/' + id); return; }
        D.toast(res.error || '操作失败');
        return;
      }
      D.toast(act === 'accepted' ? '已同意，对方会收到通知'
        : act === 'rejected' ? '已拒绝'
        : '交换已完成');
      if (rerender) rerender();
    });

  function bindSwapNew(root) {
    var withPoll = D.$('#sWithPoll', root);
    var pollBox = D.$('#sPollBox', root);
    if (withPoll && pollBox) {
      withPoll.addEventListener('change', function () {
        pollBox.classList.toggle('is-hidden', !withPoll.checked);
      });
    }

    /* 门槛卡片的高亮：选中哪个就把 is-on 挪过去 */
    D.on(root, 'change', 'input[name="minTier"]', function (e, el) {
      D.$$('.radio-card', root).forEach(function (c) { c.classList.remove('is-on'); });
      var card = el.closest('.radio-card');
      if (card) card.classList.add('is-on');
    });

    var btn = D.$('[data-swap-submit]', root);
    if (!btn) return;
    btn.addEventListener('click', function () {
      function val(sel) {
        var el = D.$(sel, root);
        return el ? el.value.trim() : '';
      }
      var tierEl = D.$('input[name="minTier"]:checked', root);
      var opts = [];
      for (var i = 0; i < 4; i++) {
        var o = D.$('[data-poll-opt="' + i + '"]', root);
        if (o && o.value.trim()) opts.push(o.value.trim());
      }
      var res = Store.createSwap({
        have: {
          name: val('#sHaveName'),
          condition: val('#sCond'),
          category: val('#sCat'),
          value: Number(val('#sValue')) || 0,
          desc: val('#sDesc'),
          images: val('#sImages').split('\n')
        },
        want: {
          name: val('#sWantName'),
          category: val('#sWantCat'),
          valueMin: Number(val('#sWantMin')) || 0,
          valueMax: Number(val('#sWantMax')) || 0,
          desc: val('#sWantDesc')
        },
        minTier: tierEl ? tierEl.value : 'all',
        contact: val('#sContact'),
        withPoll: !!(withPoll && withPoll.checked),
        pollTitle: val('#sPollTitle'),
        pollOptions: opts
      });
      if (!res.ok) {
        if (res.reason === 'login') { askLogin('#/swap/new'); return; }
        D.toast(res.error || '发布失败');
        return;
      }
      D.toast(res.pollId ? '已发布，附带小投票也建好了' : '已发布');
      location.hash = '#/swap/' + res.id;
    });
  }

  function maskContact(acc) {
    var c = String((acc && acc.contact) || '');
    if (!acc) return '';
    if (acc.method === 'phone' && c.length === 11) {

    }
    if (acc.method === 'email') {
      var at = c.indexOf('@');
      if (at > 1) return c.slice(0, 1) + '***' + c.slice(at);
    }
    return c;
  }

      location.hash = '#/';
    });

    /* --- 数据备份：导出 --- */
    D.on(root, 'click', '[data-export]', function () {
      var res = Store.exportData();
      if (!res.ok) { D.toast(res.error); return; }
      var text = JSON.stringify(res.payload, null, 2);
      var stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
      var count = Object.keys(res.payload.entries).length;
      if (!(window.Blob && window.URL && window.URL.createObjectURL)) {
        D.toast('这个浏览器不支持直接下载，共 ' + count + ' 项数据');
        return;
      }
      var url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      var a = document.createElement('a');
      a.href = url;
      a.download = 'pick-for-me-' + stamp + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      D.toast('已导出 ' + count + ' 项数据');
    });

    /* --- 数据备份：导入 --- */
    D.on(root, 'change', '[data-import]', function (e, el) {
      var file = el.files && el.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        var res = Store.importData(String(reader.result || ''));
        if (!res.ok) { D.toast(res.error); el.value = ''; return; }
        D.toast('已恢复 ' + res.count + ' 项数据' + (res.failed ? '，' + res.failed + ' 项失败' : ''));
        setTimeout(function () { location.reload(); }, 900);
      };
      reader.onerror = function () { D.toast('读取文件失败'); el.value = ''; };
      reader.readAsText(file, 'utf-8');
    });

    /* --- 数据备份：清空 --- */
    D.on(root, 'click', '[data-reset]', function () {
      if (!window.confirm(cloudOn()
        ? '会清空这台设备上的本地副本（云端的数据不受影响，重新登录会拉回来），然后重新载入演示数据。确定？'
        : '会清空这台电脑上的账号、投票、交换与收藏，然后重新载入演示数据。确定？')) return;
      var res = Store.resetData();
      if (!res.ok) { D.toast(res.error); return; }
      location.reload();
    });

    /* --- 我发起的：复制链接 --- */
    D.on(root, 'click', '[data-copy-poll]', function (e, el) {
      var id = el.getAttribute('data-copy-poll');
      if (!id) return;
      copyText(pollUrl(id)).then(function () {
        D.toast('链接已复制，发给要一起选的人');
      }).catch(function () {
        D.toast('复制失败，点进详情页手动复制');
      });
    });

    /* --- 我发起的：提前结束 --- */
    D.on(root, 'click', '[data-end-poll]', function (e, el) {
      var id = el.getAttribute('data-end-poll');
      if (!id || id === '1') return;
      if (!window.confirm('结束后不能再投，结果会留给所有人看。确定结束？')) return;

      var res = Store.endPoll(id, Store.meId());
      if (!res.ok) { D.toast(res.reason); return; }
      D.toast(res.notified
        ? ('已结束，通知了 ' + res.notified + ' 位投票人')
        : '投票已结束');
      rerender();
    });
  }

  function bindLogin(root, rerender) {
    var method = (window.PFAuth && window.PFAuth.enabled()) ? 'email' : 'phone';

    function applyMethod(m) {
      method = m;
      D.$$('.auth-tab', root).forEach(function (b) {
        b.classList.toggle('is-on', b.getAttribute('data-method') === m);
      });

      var contact = D.$('#lgContact', root);
      var secret = D.$('#lgSecret', root);
      var cl = D.$('#lgContactLabel', root);
      var sl = D.$('#lgSecretLabel', root);
      var send = D.$('#sendCode', root);

      if (m === 'phone') {
        cl.textContent = '手机号';
        contact.placeholder = '11 位手机号';
        contact.setAttribute('inputmode', 'numeric');
        sl.textContent = '验证码';
        secret.placeholder = '6 位数字（演示填 123456）';
        if (send) send.hidden = false;
      } else if (m === 'email') {
        cl.textContent = '邮箱';
        contact.placeholder = 'you@example.com';
        contact.removeAttribute('inputmode');
        sl.textContent = '密码';
        secret.placeholder = '至少 6 位';
        if (send) send.hidden = true;
      } else {
        cl.textContent = '账号';
        contact.placeholder = '至少 3 个字符';
        contact.removeAttribute('inputmode');
        sl.textContent = '密码';
        secret.placeholder = '至少 6 位';
        if (send) send.hidden = true;
      }
    }

    applyMethod(method);

    D.on(root, 'click', '.auth-tab', function (e, el) {
      applyMethod(el.getAttribute('data-method'));
    });

    D.on(root, 'click', '#sendCode', function () {
      var contact = D.$('#lgContact', root).value.trim();
      if (!/^1\d{10}$/.test(contact)) { D.toast('先填 11 位手机号'); return; }
      D.toast('演示环境不发短信，验证码填 123456');
    });

    D.$('#loginForm', root).addEventListener('submit', function (e) {
      e.preventDefault();
      var contact = String(D.$('#lgContact', root).value || '').trim();
      var secret = D.$('#lgSecret', root).value;
      var name = D.$('#lgName', root).value;

      /* 配了 Supabase：走真实账号，邮箱 + 密码 */
      if (window.PFAuth && window.PFAuth.enabled()) {
        if (method !== 'email') { D.toast('云端账号请切到「邮箱」登录'); return; }
        if (contact.indexOf('@') < 1) { D.toast('邮箱格式不对'); return; }
        if (String(secret).length < 6) { D.toast('密码至少 6 位'); return; }

        var btn = D.$('#loginForm button[type="submit"]', root);
        var label = btn ? btn.textContent : '';
        if (btn) { btn.disabled = true; btn.textContent = '处理中…'; }
        var unlock = function () { if (btn) { btn.disabled = false; btn.textContent = label; } };
        var done = function (user, isNew) {
          Store.adoptAccount({
            remoteId: user.id,
            email: contact,
            name: name || contact.split('@')[0]
          });
          var next = loginNext();
          D.toast(isNew ? '账号已创建，欢迎' : '已登录');
          location.hash = next || '#/me';
        };
        var fail = function (err) {
          unlock();
          D.toast('登录失败：' + ((err && err.message) || err));
        };

        PFAuth.signIn(contact, secret).then(function (u) { done(u, false); }).catch(function (err) {
          var msg = String((err && err.message) || '');
          if (err && err.status === 400) {
            /* 400 既可能是「没注册」，也可能是「密码错」——先试着注册来区分 */
            PFAuth.signUp(contact, secret).then(function (u) {
              if (!u) { unlock(); D.toast('注册成功，请到邮箱点确认链接后再登录'); return; }
              done(u, true);
            }).catch(function (e2) {
              unlock();
              if (e2 && e2.status === 422) { D.toast('这个邮箱已经注册过了，密码可能不对'); return; }
              D.toast('登录失败：' + ((e2 && e2.message) || e2));
            });
          } else {
            fail(err);
          }
        });
        return;
      }

      var res = Store.signIn({
        method: method,
        contact: contact,
        secret: secret,
        name: name
      });
      if (!res.ok) { D.toast(res.reason); return; }

      var next = loginNext();
      D.toast(res.isNew ? '账号已创建，欢迎' : '已登录');
      location.hash = next || '#/me';
    });
  }
