    /* 我对某个投票的选择（按当前账号绑定的投票人判定） */
    myVoteIn: function (poll) {
      var me = Store.meId();
      if (!me) return null;
      var votes = roundVotesOf(poll);
      var hit = null;
      votes.forEach(function (v) { if (v.voterId === me) hit = v; });
      return hit;
    },

    /* ============================================================
       跟我换：交换单（swaps）+ 交换申请（swapreqs）
       状态机：
         交换单 open → matched（有人被同意）→ done（双方确认完成）/ closed
         申请   pending → accepted / rejected → done
       信用联动：swap.minTier 复用投票那套 GATES + TIER_RANK，规则一致
       ============================================================ */

    SWAP_CATS: ['数码', '家电', '日用', '户外', '图书', '其他'],

    SWAP_STATUS: {
      open:    { key: 'open',    label: '可申请', cls: 'open' },
      matched: { key: 'matched', label: '已匹配', cls: 'matched' },
      done:    { key: 'done',    label: '已完成', cls: 'done' },
      closed:  { key: 'closed',  label: '已关闭', cls: 'closed' }
    },

    REQ_STATUS: {
      pending:  { key: 'pending',  label: '等待对方确认', cls: 'pending' },
      accepted: { key: 'accepted', label: '对方已同意',   cls: 'accepted' },
      rejected: { key: 'rejected', label: '对方已拒绝',   cls: 'rejected' },
      done:     { key: 'done',     label: '交换已完成',   cls: 'done' }
    },

    /** 新的在前 */
    swaps: function () {
      return read('swaps').slice().sort(function (a, b) {
        return String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
      });
    },

    swap: function (id) {
      var hit = null;
      read('swaps').forEach(function (s) { if (s.id === id) hit = s; });
      return hit;
    },

    swapStatus: function (swap) {
      return Store.SWAP_STATUS[(swap && swap.status) || 'open'] || Store.SWAP_STATUS.open;
    },

    reqStatus: function (req) {
      return Store.REQ_STATUS[(req && req.status) || 'pending'] || Store.REQ_STATUS.pending;
    },

    /** 交换门槛判定：和投票共用分档，只是文案换成"交换" */
    canApplySwap: function (swap, voterId) {
      var gate = Store.GATES[(swap && swap.minTier) || 'all'] || Store.GATES.all;
      var res = { ok: true, gate: gate, tier: 'normal', tierLabel: '尚未分档', reason: '', needLogin: false };
      if (!voterId) {
        res.ok = false; res.needLogin = true; res.reason = '登录后才能申请交换';
        return res;
      }
      if (swap && swap.owner === voterId) {
        res.ok = false; res.reason = '这是你自己发布的交换，不用申请';
        return res;
      }
      var c = Store.creditOf(voterId);
      var tier = c ? (c.blacklisted ? 'bad' : c.tier) : 'normal';
      res.tier = tier;
      res.tierLabel = c && c.blacklisted ? '暂未纳入统计' : (Store.TIERS[tier] || Store.TIERS.normal).label;
      if (gate.needRank <= 0) return res;
      if (!c || c.n < MIN_SAMPLE) {
        res.ok = false;
        res.reason = '这单要求「' + gate.label + '」，你还差 ' +
          Math.max(0, MIN_SAMPLE - (c ? c.n : 0)) + ' 次可计入统计的投票才参与分档。';
        return res;
      }
      if (Store.TIER_RANK[tier] < gate.needRank) {
        res.ok = false;
        res.reason = '这单要求「' + gate.label + '」，你目前是「' + res.tierLabel + '」。';
      }
      return res;
    },

    /** 发布交换单；勾选"附加小投票"时顺带建一个投票（同一个 polls 集合） */
    createSwap: function (input) {
      var me = Store.meId();
      if (!me) return { ok: false, reason: 'login', error: '登录后才能发布交换' };
      var have = (input && input.have) || {};
      var want = (input && input.want) || {};
      var haveName = String(have.name || '').trim();
      var wantName = String(want.name || '').trim();
      if (!haveName) return { ok: false, error: '先写清你手里这件物品' };
      if (!wantName) return { ok: false, error: '再写清你想换什么' };

      var swap = {
        id: uid('s'),
        owner: me,
        ownerName: Store.myName(),
        status: 'open',
        have: {
          name: haveName,
          condition: String(have.condition || '九成新').trim(),
          category: Store.SWAP_CATS.indexOf(have.category) >= 0 ? have.category : '其他',
          value: Number(have.value) || 0,
          desc: String(have.desc || '').trim().slice(0, 300),
          images: (have.images || []).map(function (u) { return String(u || '').trim(); })
            .filter(function (u) { return u; }).slice(0, 3)
        },
        want: {
          name: wantName,
          category: String(want.category || '不限').trim(),
          valueMin: Number(want.valueMin) || 0,
          valueMax: Number(want.valueMax) || 0,
          desc: String(want.desc || '').trim().slice(0, 300)
        },
        minTier: Store.GATES[input.minTier] ? input.minTier : 'all',
        pollId: '',
        contact: String(input.contact || '').trim(),
        createdAt: new Date().toISOString()
      };

      var pollTitle = String(input.pollTitle || '').trim();
      var opts = (input.pollOptions || []).map(function (t) { return String(t || '').trim(); })
        .filter(function (t) { return t; });
      if (input.withPoll && pollTitle && opts.length >= 2) {
        var poll = {
          id: uid('p'),
          title: pollTitle.slice(0, 80),
          note: '由交换「' + haveName + '」附带的小投票',
          type: 'single',
          anonymous: false,
          visibility: 'public',
          gate: 'all',
          scene: null,
          resultMode: 'simple',
          allowAddOption: false,
          reopenRound: 0,
          owner: me,
          deadline: '',
          weights: {},
          options: opts.slice(0, 6).map(function (t, i) {
            return { id: 'o' + (i + 1), name: t.slice(0, 40), params: [], reason: '' };
          }),
          votes: [],
          revisions: [],
          createdAt: new Date().toISOString()
        };
        var polls = read('polls');
        polls.push(poll);
        write('polls', polls);
        swap.pollId = poll.id;
      }

      var list = read('swaps');
      list.push(swap);
      write('swaps', list);
      return { ok: true, id: swap.id, pollId: swap.pollId };
    },

    mySwaps: function () {
      var me = Store.meId();
      if (!me) return [];
      return Store.swaps().filter(function (s) { return s.owner === me; });
    },

    /** 我对这一单的申请（最新的那条） */
    myReqIn: function (swapId) {
      var me = Store.meId();
      if (!me) return null;
      var hit = null;
      read('swapreqs').forEach(function (r) {
        if (r.swapId === swapId && r.from === me) hit = r;
      });
      return hit;
    },

    reqsOf: function (swapId) {
      return read('swapreqs')
        .filter(function (r) { return r.swapId === swapId; })
        .sort(function (a, b) { return String(b.at).localeCompare(String(a.at)); });
    },

    /** 别人申请我的（待处理在前） */
    incomingReqs: function () {
      var me = Store.meId();
      if (!me) return [];
      var order = { pending: 0, accepted: 1, done: 2, rejected: 3 };
      return read('swapreqs')
        .filter(function (r) { return r.to === me; })
        .sort(function (a, b) {
          var d = (order[a.status] || 0) - (order[b.status] || 0);
          return d !== 0 ? d : String(b.at).localeCompare(String(a.at));
        });
    },

    /** 我发出的申请 */
    outgoingReqs: function () {
      var me = Store.meId();
      if (!me) return [];
      return read('swapreqs')
        .filter(function (r) { return r.from === me; })
        .sort(function (a, b) { return String(b.at).localeCompare(String(a.at)); });
    },

    applySwap: function (swapId, note) {
      var me = Store.meId();
      if (!me) return { ok: false, reason: 'login', error: '登录后才能申请交换' };
      var swap = Store.swap(swapId);
      if (!swap) return { ok: false, error: '交换单不存在' };
      if (swap.status !== 'open') return { ok: false, error: '这单现在不接受新申请' };
      var chk = Store.canApplySwap(swap, me);
      if (!chk.ok) return { ok: false, error: chk.reason };
      var dup = Store.myReqIn(swapId);
      if (dup && dup.status !== 'rejected') return { ok: false, error: '你已经申请过这单了，等对方确认' };

      var req = {
        id: uid('r'),
        swapId: swapId,
        from: me,
        fromName: Store.myName(),
        to: swap.owner,
        toName: swap.ownerName,
        note: String(note || '').trim().slice(0, 200),
        status: 'pending',
        at: new Date().toISOString(),
        decidedAt: '',
        doneAt: ''
      };
      var list = read('swapreqs');
      list.push(req);
      write('swapreqs', list);
      Store.deliver(swap.owner, {
        type: 'swap',
        title: '收到新的交换申请',
        body: req.fromName + ' 想换你的「' + swap.have.name + '」',
        href: '#/swap/' + swapId
      });
      return { ok: true, id: req.id };
    },

    /** 发起者同意 / 拒绝；同意后其余待处理申请自动拒绝 */
    decideReq: function (reqId, status) {
      var me = Store.meId();
      if (!me) return { ok: false, reason: 'login', error: '登录后才能处理申请' };
      if (status !== 'accepted' && status !== 'rejected') return { ok: false, error: '未知操作' };
      var list = read('swapreqs');
      var req = null;
      list.forEach(function (r) { if (r.id === reqId) req = r; });
      if (!req) return { ok: false, error: '申请不存在' };
      if (req.to !== me) return { ok: false, error: '只有发布者能处理这单申请' };
      if (req.status !== 'pending') return { ok: false, error: '这条申请已经处理过了' };
      var swap = Store.swap(req.swapId);

      req.status = status;
      req.decidedAt = new Date().toISOString();

      if (status === 'accepted') {
        list.forEach(function (r) {
          if (r.swapId === req.swapId && r.id !== req.id && r.status === 'pending') {
            r.status = 'rejected';
            r.decidedAt = new Date().toISOString();
            Store.deliver(r.from, {
              type: 'swap',
              title: '交换申请没有成功',
              body: '「' + (swap ? swap.have.name : '这单') + '」已经有别的换法了',
              href: '#/swap/' + req.swapId
            });
          }
        });
        var swaps = read('swaps');
        swaps.forEach(function (s) {
          if (s.id === req.swapId && s.status === 'open') s.status = 'matched';
        });
        write('swaps', swaps);
      }

      write('swapreqs', list);
      Store.deliver(req.from, {
        type: 'swap',
        title: status === 'accepted' ? '对方同意了你的交换申请' : '对方拒绝了你的交换申请',
        body: status === 'accepted'
          ? '「' + (swap ? swap.have.name : '这单') + '」等你确认完成'
          : '「' + (swap ? swap.have.name : '这单') + '」这次没换成',
        href: '#/swap/' + req.swapId
      });
      return { ok: true, status: status };
    },

    /** 双方任一方确认完成 */
    completeReq: function (reqId) {
      var me = Store.meId();
      if (!me) return { ok: false, reason: 'login', error: '登录后才能确认完成' };
      var list = read('swapreqs');
      var req = null;
      list.forEach(function (r) { if (r.id === reqId) req = r; });
      if (!req) return { ok: false, error: '申请不存在' };
      if (req.from !== me && req.to !== me) return { ok: false, error: '你不是这单的双方' };
      if (req.status !== 'accepted') return { ok: false, error: '还没到"确认完成"这一步' };
      req.status = 'done';
      req.doneAt = new Date().toISOString();
      write('swapreqs', list);
      var swaps = read('swaps');
      swaps.forEach(function (s) { if (s.id === req.swapId) s.status = 'done'; });
      write('swaps', swaps);
      var swap = Store.swap(req.swapId);
      [req.from, req.to].forEach(function (uidTo) {
        Store.deliver(uidTo, {
          type: 'swap',
          title: '交换已完成',
          body: '「' + (swap ? swap.have.name : '这单') + '」双方确认完成，这次交换已经收尾',
          href: '#/swap/' + req.swapId
        });
      });
      return { ok: true };
    },

    /* ============================================================
       选品攻略：分类、投稿、关联投票
       攻略由用户投稿（登录后），结构沿用 docs 里的四区块：
       预算档位 / 关键参数 / 适用人群 / 避坑点
       ============================================================ */

    GUIDE_CATS: ['数码', '家电', '日用', '户外', '饮食', '其他'],

    guides: function () {
      return read('guides').slice().sort(function (a, b) {
        return String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
      });
    },

    guide: function (id) {
      var hit = null;
      read('guides').forEach(function (g) { if (g.id === id) hit = g; });
      return hit;
    },

    myGuides: function () {
      var me = Store.meId();
      if (!me) return [];
      return Store.guides().filter(function (g) { return g.authorId === me; });
    },

    createGuide: function (input) {
      var me = Store.meId();
      if (!me) return { ok: false, reason: 'login', error: '登录后才能投稿攻略' };
      var title = String((input && input.title) || '').trim();
      if (title.length < 4) return { ok: false, error: '标题至少 4 个字' };
      var cat = Store.GUIDE_CATS.indexOf(input.category) >= 0 ? input.category : '其他';

      function rows(arr, k1, k2) {
        return (arr || []).map(function (r) {
          var o = {};
          o[k1] = String(r[k1] || '').trim();
          o[k2] = String(r[k2] || '').trim();
          return o;
        }).filter(function (o) { return o[k1] || o[k2]; });
      }

      var guide = {
        id: uid('g'),
        title: title.slice(0, 60),
        category: cat,
        summary: String(input.summary || '').trim().slice(0, 120),
        cover: String(input.cover || '').trim(),
        links: (input.links || []).map(function (l) {
          return { label: String(l.label || '').trim().slice(0, 30), url: String(l.url || '').trim() };
        }).filter(function (l) { return /^https?:\/\//i.test(l.url); }).slice(0, 4),
        fromPollId: String(input.fromPollId || '').trim(),
        authorId: me,
        author: Store.myName(),
        budget: rows(input.budget, 'label', 'note'),
        params: rows(input.params, 'name', 'why'),
        audience: rows(input.audience, 'who', 'pick'),
        pitfalls: (input.pitfalls || []).map(function (s) { return String(s || '').trim(); })
          .filter(function (s) { return s; }).slice(0, 6),
        createdAt: new Date().toISOString()
      };
      if (!guide.budget.length && !guide.params.length && !guide.audience.length && !guide.pitfalls.length) {
        return { ok: false, error: '四个区块至少写一条，否则攻略没有内容' };
      }
      var list = read('guides');
      list.push(guide);
      write('guides', list);
      return { ok: true, id: guide.id };
    },

    /** 全站攻略搜索 + 分类过滤（原型期在前端做，迁移后交给平台检索） */
    findGuides: function (q, cat) {
      var kw = String(q || '').trim().toLowerCase();
      return Store.guides().filter(function (g) {
        if (cat && cat !== 'all' && g.category !== cat) return false;
        if (!kw) return true;
        var hay = [g.title, g.summary, g.category, g.author,
          (g.params || []).map(function (p) { return p.a + p.b; }).join(''),
          (g.pitfalls || []).join('')].join(' ').toLowerCase();
        return hay.indexOf(kw) >= 0;
      });
    },

    /* ---------- 权限：可见性 × 信用门槛 ---------- */

    gateMeta: function (poll) {
      var key = poll && poll.gate;
      return Store.GATES[key] || Store.GATES.all;
    },

    resultModeOf: function (poll) {
      var key = poll && poll.resultMode;
      return Store.RESULT_MODES[key] || Store.RESULT_MODES.full;
    },

    sceneOf: function (poll) {
      return (poll && Store.SCENES[poll.scene]) || null;
    },

    /* ---------- 时间与结束状态 ---------- */

    /** 截止时间是否已过。没设截止时间就永远不算过期 */
    isExpired: function (poll, now) {
      if (!poll || !poll.deadline) return false;
      var at = Date.parse(poll.deadline);
      if (isNaN(at)) return false;
      return at <= (now == null ? Date.now() : now);
    },

    /**
     * 能不能再投的总开关：手动结束或到期，都算关。
     * 抽成一个函数，是为了让首页、详情页、canVote 三处永远同一个判断。
     */
    isClosed: function (poll, now) {
      if (!poll) return true;
      if (poll.archived) return true;
      return Store.isExpired(poll, now);
    },

    /**
     * 时间视角的统一描述。页面不自己算差值，避免"还剩 2 小时"和"已结束"打架。
     * @returns {{closed:boolean, byDeadline:boolean, hasDeadline:boolean,
     *            msLeft:number, label:string, short:string}}
     */
    pollTiming: function (poll, now) {
      var t = now == null ? Date.now() : now;
      var out = {
        closed: Store.isClosed(poll, t),
        byDeadline: Store.isExpired(poll, t),
        hasDeadline: !!(poll && poll.deadline),
        msLeft: 0, label: '不限时', short: '不限时'
      };

      /* 手动结束优先：即使 deadline 还在未来，也已经结束了，不能显示"还剩 X 天" */
      if (poll && poll.archived) {
        out.closed = true;
        out.label = '已结束';
        out.short = '已结束';
        return out;
      }

      if (!poll || !poll.deadline) return out;

      var at = Date.parse(poll.deadline);
      if (isNaN(at)) return out;

      out.msLeft = at - t;
      if (out.msLeft <= 0) {
        out.label = '已于 ' + fmtClock(at) + ' 截止';
        out.short = '已截止';
        return out;
      }
      out.label = '还剩 ' + humanLeft(out.msLeft);
      out.short = humanLeft(out.msLeft);
      return out;
    },

    /**
     * 判定某个投票人能不能投这次投票。
     * 门槛只在这里生效；**黑名单不剥夺投票权**（见 docs/11 第 3.2 节），
     * 但他进不了 mid / high 两档，因为档位是 normal。
     *
     * @returns {{ok:boolean, gate:Object, tier:string, needSample:boolean,
     *            reason:string, tierLabel:string}}
     */
    canVote: function (poll, voterId) {
      var gate = Store.gateMeta(poll);
      var c = voterId ? Store.creditOf(voterId) : null;
      var tier = c ? (c.blacklisted ? 'bad' : c.tier) : 'normal';
      var label = (Store.TIERS[tier] || Store.TIERS.normal).label;
      var res = {
        ok: true, gate: gate, tier: tier,
        tierLabel: c && c.blacklisted ? '暂未纳入统计' : label,
        needSample: false, needLogin: false, reason: ''
      };

      /* 已结束的投票优先告知"结束了"，这比"请登录"更有用。
         手动结束和到期结束都走这里，但文案要能分开，所以留 closedBy。 */
      if (poll && Store.isClosed(poll)) {
        var byDeadline = Store.isExpired(poll);
        res.ok = false;
        res.closed = true;
        res.closedBy = byDeadline ? 'deadline' : 'owner';
        res.reason = byDeadline
          ? '这次投票已到最后期限，结果仍然可以看。'
          : '这次投票已经结束了，结果仍然可以看。';
        return res;
      }

      /* 投票必须登录：账号是信用体系与分层权限的唯一锚点 */
      if (!voterId) {
        res.ok = false;
        res.needLogin = true;
        res.reason = '登录后才能投票';
        return res;
      }

      if (gate.key === 'all') return res;
      if (!c) {
        res.ok = false;
        res.needSample = true;
        res.reason = '你还没有可计入统计的投票记录，达不到这个门槛。';
        return res;
      }
      if (c.n < MIN_SAMPLE) {
        res.ok = false;
        res.needSample = true;
        res.reason = '你目前只有 ' + c.n + ' 次可计入统计的投票，还差 ' +
          (MIN_SAMPLE - c.n) + ' 次才参与分档。';
        return res;
      }
      if (Store.TIER_RANK[tier] < gate.needRank) {
        res.ok = false;
        res.reason = '这次要求「' + gate.label + '」，你目前是「' + label + '」。';
        return res;
      }
      return res;
    },

    /**
     * 发起者结束投票：标记 archived，票型与投票人全部保留。
     * 结束后不能再投，但结论、票型、信用记录都还在页面上。
     * 同时给投过票的人各发一条站内消息（这就是"投票结束提醒"的真实来源）。
     *
     * @returns {{ok:boolean, reason:string, notified:number}}
     */
    endPoll: function (id, by) {
      var poll = Store.get('polls', id);
      if (!poll) return { ok: false, reason: '这次投票不存在，可能已经被发起者删除了。', notified: 0 };
      if (poll.archived) return { ok: false, reason: '这次投票已经结束了。', notified: 0 };
      if (!by || poll.owner !== by) {
        return { ok: false, reason: '只有发起者能结束这次投票。', notified: 0 };
      }

      poll.archived = true;
      poll.closedAt = new Date().toISOString();
      poll.closedBy = by;
      Store.save('polls', poll);

      var t = Store.tally(poll);
      var lead = t.total && !t.tie && t.winners[0] ? t.winners[0].option.name : '';
      var treated = {};
      var sent = 0;
      (poll.votes || []).forEach(function (v) {
        if (!v.voterId || v.voterId === by || treated[v.voterId]) return;
        treated[v.voterId] = true;
        Store.deliver(v.voterId, {
          type: 'poll',
          title: '「' + String(poll.title).slice(0, 24) + '」已经结束',
          body: lead ? ('结果是：' + lead + '。点开看完整票型。') : '投票已结束，点开看结果。',
          href: '#/poll/' + poll.id
        });
        sent++;
      });

      return { ok: true, reason: '', notified: sent };
    },

    /** 当前有多少投票人满足这个门槛（用于发起页提示，不是投票结果） */
    gateAudience: function (poll) {
      var gate = Store.gateMeta(poll);
      var credits = Store.credits();
      var total = 0;
      var pass = 0;
      Object.keys(credits).forEach(function (id) {
        var c = credits[id];
        if (c.blacklisted) return;
        total++;
        if (gate.key === 'all') { pass++; return; }
        if (c.n < MIN_SAMPLE) return;
        if (Store.TIER_RANK[c.tier] >= gate.needRank) pass++;
      });
      return { total: total, pass: pass };
    },

    /* ---------- 投票进行中增补候选 ---------- */

    /**
     * 发起者在投票进行中新增一个候选。
     * 每次新增都会把 reopenRound +1，等于开启一轮"所有人可完整重投"。
     *
     * @returns {{ok:boolean, reason:string, option:Object|null, round:number}}
     */
    addOptionDuringPoll: function (poll, input, by) {
      if (!poll) return { ok: false, reason: 'missing', option: null, round: 0 };
      if (!poll.allowAddOption) {
        return { ok: false, reason: 'closed', option: null, round: poll.reopenRound || 0 };
      }
      var opts = poll.options || [];
      if (opts.length >= 12) {
        return { ok: false, reason: 'too-many', option: null, round: poll.reopenRound || 0 };
      }

      var name = String((input && input.name) || '').trim();
      if (!name) return { ok: false, reason: 'empty', option: null, round: poll.reopenRound || 0 };

      var priceVal = input.price;
      var option = {
        id: uid('o'),
        name: name.slice(0, 30),
        price: (priceVal === '' || priceVal == null || isNaN(Number(priceVal)))
          ? null : Number(priceVal),
        params: (input.params || []).filter(function (p) { return p && p.k; }),
        reason: '',
        isNew: true,
        addedAt: new Date().toISOString(),
        addedRound: (poll.reopenRound || 0) + 1
      };

      poll.reopenRound = (poll.reopenRound || 0) + 1;
      poll.options = opts.concat([option]);
      poll.revisions = (poll.revisions || []).concat([{
        at: option.addedAt,
        type: 'add-option',
        name: option.name,
        round: poll.reopenRound
      }]);
      Store.save('polls', poll);

      /* 通知投过票的人：多了候选，可以改投一次（旧票仍然有效） */
      var actor = by || Store.meId();
      var seen = {};
      var sent = 0;
      (poll.votes || []).forEach(function (v) {
        var vid = v && v.voterId;
        if (!vid || vid === actor || seen[vid]) return;
        seen[vid] = 1;
        Store.deliver(vid, {
          type: 'option',
          title: '「' + String(poll.title).slice(0, 20) + '」新增了一个候选',
          body: '新加了「' + option.name + '」。你之前的票仍然有效，也可以改投一次。',
          href: '#/poll/' + poll.id
        });
        sent++;
      });

      return { ok: true, reason: '', option: option, round: poll.reopenRound, notified: sent };
    },

    /** 这一票是不是在上一轮投的（新增候选后需要重投） */
    needsRevote: function (poll, vote) {
      if (!poll || !vote) return false;
      return (vote.round || 0) < (poll.reopenRound || 0);
    },

    /* ---------- 多轮投票（发起者手动开下一轮） ---------- */

    /**
     * 开下一轮。注意这跟「增补候选」不是一件事：
     *   - 增补候选：加一个选项，旧票仍然有效，只是允许重投；
     *   - 开下一轮：把当前轮整轮的票冻结进 roundLog，票清空，轮次 +1，
     *     所有人（包括没投过的）从零开始重新投。
     * 只有在发起页打开了「多轮投票」的投票才允许这么做。
     *
     * @returns {{ok:boolean, reason:string, round:number, notified:number, prevTotal:number}}
     */
    startNextRound: function (id, by) {
      var poll = Store.get('polls', id);
      var fail = function (reason) {
        return { ok: false, reason: reason, round: 0, notified: 0, prevTotal: 0 };
      };

      if (!poll) return fail('这次投票不存在，可能已经被删除了。');
      if (!by || poll.owner !== by) return fail('只有发起者能开启下一轮。');
      if (!poll.allowMultiRound) return fail('这次投票没有开启多轮模式，创建时才能打开。');
      if (Store.isClosed(poll)) return fail('投票已经结束，不能再开新一轮。');

      var cur = poll.round || 1;
      var t = Store.tally(poll);
      var lead = (t.total && !t.tie && t.winners[0]) ? t.winners[0].option.name : '';
      var nowIso = new Date().toISOString();

      poll.roundLog = (poll.roundLog || []).concat([{
        round: cur,
        startedAt: poll.roundStartedAt || poll.createdAt,
        endedAt: nowIso,
        total: t.total,
        lead: lead,
        tie: !!t.tie,
        votes: (poll.votes || []).map(function (v) {
          return { voterId: v.voterId, choice: (v.choice || []).slice() };
        })
      }]);

      var voters = {};
      (poll.votes || []).forEach(function (v) { if (v.voterId) voters[v.voterId] = 1; });

      poll.round = cur + 1;
      poll.roundStartedAt = nowIso;
      poll.votes = [];
      /* 新一轮候选没变，上一轮的"可重投"提示要清零，否则会误报 */
      poll.reopenRound = 0;
      poll.revisions = (poll.revisions || []).concat([{
        at: nowIso, type: 'new-round', round: poll.round, prevLead: lead
      }]);
      Store.save('polls', poll);
      /* 本地票清了，云端也得清：不然刷新/换设备一拉，上一轮的票又回来了，
         新一轮的票数就不是从 0 开始。 */
      try {
        if (window.PFSync && typeof PFSync.clearVotes === 'function') PFSync.clearVotes(poll.id);
      } catch (e) {}

      var sent = 0;
      Object.keys(voters).forEach(function (vid) {
        if (vid === by) return;
        Store.deliver(vid, {
          type: 'poll',
          title: '「' + String(poll.title).slice(0, 20) + '」开始第 ' + poll.round + ' 轮',
          body: lead ? ('第 ' + cur + ' 轮的结果是：' + lead + '。现在可以重新投一次。')
                     : '第 ' + cur + ' 轮没有分出结果，现在开始新一轮。',
          href: '#/poll/' + poll.id
        });
        sent++;
      });

      return { ok: true, reason: '', round: poll.round, notified: sent, prevTotal: t.total };
    },

    /**
     * 我参与过的投票（投过票，且当前轮还有我那票）。
     * 「我的」页用它渲染"我参与的"，不暴露别人的选择。
     * @returns {Array<{poll:Object, mine:Object, isOwner:boolean, closed:boolean,
     *                  total:number, lead:string, tie:boolean, hit:(boolean|null)}>}
     */
    myVotedPolls: function (voterId) {
      if (!voterId) return [];
      var out = [];
      var seen = {};

      /* 分开遍历：history 里的是信用样本，界面上要折叠，不能和正在进行的投票混在一起 */
      [
        { list: Store.list('polls'), fromHistory: false },
        { list: Store.list('history'), fromHistory: true }
      ].forEach(function (group) {
        group.list.forEach(function (p) {
          if (!p || !p.id || seen[p.id]) return;
          seen[p.id] = 1;

          var mine = null;
          (p.votes || []).forEach(function (v) {
            if (v.voterId === voterId) mine = v;
          });
          if (!mine) return;

          /* 剔除自己那一票再算共识，和信用明细用的是同一个口径 */
          var rest = (p.votes || []).filter(function (v) { return v.id !== mine.id; });
          var t = Store.tally({ options: p.options, type: p.type, votes: rest });
          var consensus = t.tie ? null : (t.winners[0] ? t.winners[0].option : null);
          var hit = consensus ? (mine.choice || []).indexOf(consensus.id) >= 0 : null;

          out.push({
            poll: p,
            mine: mine,
            isOwner: p.owner === voterId,
            closed: Store.isClosed(p),
            total: (p.votes || []).length,
            lead: consensus ? consensus.name : '',
            tie: !!t.tie,
            hit: hit,
            fromHistory: group.fromHistory
          });
        });
      });

      return out.sort(function (a, b) {
        return String(b.poll.createdAt).localeCompare(String(a.poll.createdAt));
      });
    },

    /* ---------- 首次访问写入演示数据 ---------- */

    seed: function () {
      if (localStorage.getItem(SEED_FLAG) === SEED_VER) return false;

      /* 演示数据全程不碰云端：seed 会整表重写 polls / history / messages 等集合。
         若照常同步，onWrite 的「本轮消失的就是删掉了」会把真实投票从云端 DELETE 掉。 */
      syncMuted = true;

      var now = Date.now();
      var day = 24 * 3600 * 1000;
      var h6 = 6 * 3600 * 1000;

      // 清掉上一版演示数据，保留用户自己创建的内容
      ['polls', 'guides', 'swaps'].forEach(function (k) {
        write(k, read(k).filter(function (x) {
          return String(x.id).indexOf('demo') < 0;
        }));
      });
      /* 只清演示数据；云端拉下来的真实投票人 / 归档投票要留着 */
      write('voters', keepUser(read('voters')));
      write('history', keepUser(read('history')));

﻿/* ============================================================
   Supabase 同步层
   ------------------------------------------------------------
   把「投票 + 每一票」以及「攻略、交换单、交换申请、收藏、消息、用户档案」
   搬到云端，让不同设备看到同一份数据。

   判定逻辑（计票、门槛、平票、信用、攻略起草、交换匹配）不在这里，
   仍在四个技能里；这里只搬运。

   配置为空、或网络不可达时，整个模块静默降级为纯本地，
   页面行为与没有它时完全一致。
   ============================================================ */
(function (root) {
  'use strict';

  var cfg = root.PF_CONFIG || {};
  var BASE = String(cfg.supabaseUrl || '').replace(/\/+$/, '');
  var KEY = String(cfg.supabaseAnonKey || '');
  var ON = !!(BASE && KEY);

  var state = { status: ON ? 'idle' : 'off', error: '', syncedAt: 0, pushed: 0, pulled: 0 };

  /* 除投票外的云端表；polls 与 votes 走各自的逻辑 */
  var TABLES = ['guides', 'swaps', 'swapreqs', 'favs', 'messages', 'voters'];
  var LIMIT = 500;

  /* ---------- 演示数据识别 ----------
     三重兜底：对象上的 seed 标记、_demo 形式的 id、以及启动时记下的 id 清单。
     演示数据一律不上云，否则每个人第一次打开都会把种子推一遍。 */
  function seedIds() {
    try { return JSON.parse(localStorage.getItem('pf:seedids') || '[]'); } catch (e) { return []; }
  }
  function isDemo(obj) {
    if (!obj || !obj.id) return true;
    if (obj.seed) return true;
    if (/^[a-z]+_demo\d*$/.test(obj.id)) return true;
    return seedIds().indexOf(obj.id) >= 0;
  }
  /* 用户档案只认云端账号派生的 id（u_ + 12 位十六进制），
     这样 u_me / u6 / g_dead1 这些演示投票人不会被推上去 */
  function realVoter(id) { return /^u_[0-9a-f]{12}$/.test(String(id || '')); }

  /* 云端记的 id 用登录账号的 uuid；没登录时退回本地 id */
  function whoami(localId) {
    var u = root.PFAuth && root.PFAuth.user ? root.PFAuth.user() : null;
    return (u && u.id) ? u.id : (localId || '');
  }

  function realPoll(p) {
    return !!(p && p.title && p.options && p.options.length);
  }
  var locked = false;

  function headers(prefer) {
    var h = {
      apikey: KEY,
      Authorization: 'Bearer ' + KEY,
      'Content-Type': 'application/json'
    };
    if (prefer) h.Prefer = prefer;
    return h;
  }

  function api(path, opt) {
    opt = opt || {};
    var init = {
      method: opt.method || 'GET',
      headers: headers(opt.prefer),
      cache: 'no-store'
    };
    if (opt.body) init.body = JSON.stringify(opt.body);
        return fetch(BASE + '/rest/v1/' + path, init).then(function (r) {
          if (!r.ok) {
            return r.text().then(function (t) {
              throw new Error('HTTP ' + r.status + ' ' + String(t).slice(0, 160));
            });
