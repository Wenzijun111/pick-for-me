<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pick For Me — 帮我选</title>
<meta name="description" content="投票、攻略、交换三段闭环，一次决策沉淀成下一次的攻略。">
<meta name="theme-color" content="#1a93bc">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2323a6d5'/%3E%3Ctext x='16' y='23' font-family='system-ui,sans-serif' font-size='19' font-weight='700' fill='%23fff' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">
<style>
/* assets/css/style.css */
/* ============================================================
   Pick For Me — 全局样式
   纯静态，无构建工具。移动端优先。

   皮肤体系（见 docs/11-设计契约与投票信用机制.md）
   ------------------------------------------------------------
   1. 结构 token（尺寸、字体、动效）在 :root，两套皮肤共用
   2. 颜色 / 圆角 / 装饰 token 按 <html data-skin="..."> 切换
   3. :root 里的值是 fresh（清爽标准）的默认值，
      所以 JS 没跑之前页面也是完整可用的
   4. 新增皮肤只需再加一个 [data-skin="x"] 块，不动组件样式
   ============================================================ */

/* ============================================================
   一、Token
   ============================================================ */

:root {
  /* --- 结构（两套共用，不随皮肤变） --- */
  --content: 940px;
  --topbar-h: 58px;

  --radius-sm: 8px;
  --radius: 12px;

  --shadow-1: 0 1px 2px rgba(18, 32, 43, .06), 0 1px 3px rgba(18, 32, 43, .04);
  --shadow-2: 0 4px 16px rgba(18, 32, 43, .09), 0 1px 3px rgba(18, 32, 43, .04);

  --dur: .18s;
  --ease: cubic-bezier(.32, .72, .35, 1);

  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
    "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC",
    sans-serif;
  --font-num: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;

  /* --- 皮肤：清爽标准 fresh（默认） --- */
  --bg: #f7f9fb;
  --bg-deep: #eef4f8;
  --surface: #ffffff;
  --surface-2: #f4f8fb;

  --ink: #12202b;
  --ink-2: #46586a;
  --ink-3: #5d7285;        /* 在 #f7f9fb 上约 5.6:1，达 WCAG AA */

  --line: #e3ebf1;
  --line-strong: #c9d8e2;

  --brand: #1a93bc;         /* 主色压深版，用于按钮底 + 白字 */
  --brand-vivid: #23a6d5;   /* 原始浅青蓝，用于描边、进度条、图标 */
  --brand-ink: #14708f;
  --brand-soft: #e6f6fc;
  --brand-line: #c2e7f5;
  --brand-ring: rgba(35, 166, 213, .16);

  --accent: #ff9f43;
  --accent-ink: #b2620a;
  --accent-soft: #fff4e8;
  --accent-line: #ffdcb8;

  --ok: #2ecc71;
  --ok-ink: #17864a;
  --ok-soft: #e9faf1;
  --ok-line: #c4efd7;

  --warn: #e8933a;
  --warn-ink: #96560a;
  --warn-soft: #fff6ea;
  --warn-line: #ffdfb8;
  --danger: #d92d20;          /* 未读红点 / 危险操作 */

  --hero-from: #0b7ca4;
  --hero-to: #1a93bc;
  --hero-ink: #ffffff;
  --hero-ink-sub: rgba(255, 255, 255, .88);
  --hero-btn-bg: #ffffff;
  --hero-btn-ink: #14708f;
  --hero-ghost-bg: rgba(255, 255, 255, .16);
  --hero-ghost-line: rgba(255, 255, 255, .36);

  --radius-card: 14px;
  --radius-chip: 8px;
  --radius-btn: 10px;

  --deco: dots;             /* 装饰类型，仅 hero 使用 */
}

/* --- 皮肤：潮流轻 Y2K --- */
:root[data-skin="y2k"] {
  --bg: #f5f3fa;
  --bg-deep: #eeeaf8;
  --surface: #ffffff;
  --surface-2: #faf9fd;

  --ink: #242230;
  --ink-2: #514d66;
  --ink-3: #66627e;        /* 在 #f5f3fa 上约 5.9:1 */

  --line: #e9e5f4;
  --line-strong: #d3cce7;

  --brand: #7a68d9;         /* 加深版，保证白字对比度 */
  --brand-vivid: #9d8df1;
  --brand-ink: #6552cc;
  --brand-soft: #f0ecfd;
  --brand-line: #ded6fa;
  --brand-ring: rgba(157, 141, 241, .22);

  --accent: #ffd3e0;
  --accent-ink: #b2506f;
  --accent-soft: #fff2f6;
  --accent-line: #ffdce7;

  --ok: #a8e6cf;
  --ok-ink: #2b8b6a;
  --ok-soft: #eefbf5;
  --ok-line: #cdf3e4;

  --warn: #e8b4c6;
  --warn-ink: #a4536e;
  --warn-soft: #fdf1f5;
  --warn-line: #f6d6e2;

  /* 轻 Y2K 的 hero 用浅底 + 深字，和 fresh 形成明显反差 */
  --hero-from: #f2eefd;
  --hero-to: #e6f6f1;
  --hero-ink: #2c2743;
  --hero-ink-sub: #5b5578;
  --hero-btn-bg: #7a68d9;
  --hero-btn-ink: #ffffff;
  --hero-ghost-bg: rgba(255, 255, 255, .78);
  --hero-ghost-line: #ded6fa;

  --radius-card: 18px;
  --radius-chip: 999px;
  --radius-btn: 14px;

  --deco: rings;
}

/* ============================================================
   二、基础
   ============================================================ */

* { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  background: var(--bg);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  transition: background .24s var(--ease), color .24s var(--ease);
}

a { color: inherit; text-decoration: none; }

button { font: inherit; cursor: pointer; }

/* ============================================================
   三、顶栏
   ============================================================ */

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(180%) blur(12px);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--line);
}

.topbar-inner {
  max-width: var(--content);
  margin: 0 auto;
  height: var(--topbar-h);
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 0 0 auto;
}

.brand-mark {
  width: 28px;
  height: 28px;
  border-radius: 9px;
  background: linear-gradient(135deg, var(--brand-vivid), var(--brand));
  color: #fff;
  font-weight: 700;
  font-size: 15px;
  display: grid;
  place-items: center;
  letter-spacing: -.02em;
  box-shadow: 0 2px 8px var(--brand-ring);
}

:root[data-skin="y2k"] .brand-mark {
  border-radius: 50%;
  background: linear-gradient(135deg, var(--brand-vivid), #c3b8f8);
}

.brand-name {
  font-weight: 650;
  font-size: 15.5px;
  letter-spacing: -.01em;
  white-space: nowrap;
}

/* ---------- 顶部 tab ---------- */

.tabs {
  display: flex;
  gap: 2px;
  flex: 1 1 auto;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
  padding: 4px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 11px;
  max-width: 400px;
}

.tabs::-webkit-scrollbar { display: none; }

.tabs a {
  flex: 0 0 auto;
  padding: 6px 14px;
  border-radius: var(--radius-chip);
  font-size: 14px;
  color: var(--ink-2);
  white-space: nowrap;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}

.tabs a:hover { color: var(--ink); background: var(--bg-deep); }

.tabs a[aria-current="page"] {
  background: var(--surface);
  color: var(--ink);
  font-weight: 600;
  box-shadow: var(--shadow-1);
}

.topbar-meta {
  flex: 0 0 auto;
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* 顶栏「我的」入口：路演时要能当场点开 */
.skin-entry {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: var(--radius-chip);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  font-size: 12.5px;
  font-weight: 600;
  white-space: nowrap;
  transition: border-color var(--dur), color var(--dur), background var(--dur);
}

.skin-entry:hover {
  border-color: var(--brand-line);
  color: var(--brand-ink);
  background: var(--brand-soft);
}

.skin-entry .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--brand-vivid), var(--accent));
  flex: 0 0 auto;
}

.badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: var(--radius-chip);
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--ink-3);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* ============================================================
   四、主区域
   ============================================================ */

.app {
  max-width: var(--content);
  margin: 0 auto;
  padding: 20px 16px 56px;
  min-height: calc(100vh - var(--topbar-h) - 60px);
}

.loading {
  padding: 80px 0;
  text-align: center;
  color: var(--ink-3);
  font-size: 14px;
}

/* ============================================================
   五、Hero
   ============================================================ */

.hero {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius-card);
  padding: 32px 28px;
  background: linear-gradient(135deg, var(--hero-from) 0%, var(--hero-to) 100%);
  color: var(--hero-ink);
  box-shadow: 0 8px 28px var(--brand-ring);
  transition: background .3s var(--ease);
}

/* 装饰层：只在 hero。fresh 是点阵，y2k 是圆环 */
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image: radial-gradient(circle, #fff 1px, transparent 1.2px);
  background-size: 17px 17px;
  opacity: .05;
}

.hero::after {
  content: "";
  position: absolute;
  right: -64px;
  top: -64px;
  width: 210px;
  height: 210px;
  border-radius: 50%;
  background: rgba(255, 255, 255, .1);
  pointer-events: none;
}

/* 轻 Y2K：圆环 + 星星，不用点阵 */
:root[data-skin="y2k"] .hero::before {
  background-image: none;
  opacity: 1;
  border: 1.5px solid rgba(122, 104, 217, .18);
  border-radius: 50%;
  inset: auto;
  right: -70px;
  top: -80px;
  width: 250px;
  height: 250px;
}

:root[data-skin="y2k"] .hero::after {
  inset: auto;
  left: auto;
  right: 82px;
  bottom: 20px;
  top: auto;
  width: 11px;
  height: 11px;
  border-radius: 0;
  background: #b9acf5;
  clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
  opacity: .85;
}

.hero h1 {
  margin: 0 0 12px;
  font-size: 30px;
  line-height: 1.28;
  font-weight: 750;
  letter-spacing: -.025em;
  position: relative;
  z-index: 1;
  text-wrap: balance;
}

.hero p {
  margin: 0;
  font-size: 14.5px;
  line-height: 1.75;
  color: var(--hero-ink-sub);
  max-width: 42em;
  position: relative;
  z-index: 1;
}

.hero-actions {
  margin-top: 20px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  position: relative;
  z-index: 1;
}

/* hero 里的按钮跟随皮肤 */
.hero .btn-primary {
  background: var(--hero-btn-bg);
  color: var(--hero-btn-ink);
  box-shadow: 0 3px 14px rgba(0, 0, 0, .1);
}

.hero .btn-primary:hover { background: var(--hero-btn-bg); filter: brightness(.97); }

.hero .btn-ghost {
  background: var(--hero-ghost-bg);
  color: var(--hero-ink);
  border-color: var(--hero-ghost-line);
}

.hero .btn-ghost:hover { background: var(--hero-ghost-bg); filter: brightness(.96); }

/* ============================================================
   六、区块标题
   ============================================================ */

.section { margin-top: 36px; }

.section-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 14px;
}

.section-head h2 {
  margin: 0;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -.018em;
}

/* 轻 Y2K：标题下加一条虚线，作为皮肤识别特征 */
:root[data-skin="y2k"] .section-head {
  padding-bottom: 9px;
  border-bottom: 1px dashed var(--line-strong);
}

.section-head .hint {
  font-size: 13px;
  color: var(--ink-3);
}

.section-head .spacer { margin-left: auto; }

/* ============================================================
   七、卡片 / 区块
   ============================================================ */

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  padding: 16px;
  box-shadow: var(--shadow-1);
}

.card-grid {
  display: grid;
  gap: 14px;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
}

.zone {
  display: block;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  padding: 20px;
  box-shadow: var(--shadow-1);
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease),
    border-color var(--dur) var(--ease);
  position: relative;
}

.zone:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-2);
  border-color: var(--line-strong);
}

:root[data-skin="y2k"] .zone:hover {
  border-color: var(--brand-line);
  box-shadow: 0 8px 22px var(--brand-ring);
}

.zone-icon {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  font-size: 19px;
  margin-bottom: 12px;
  background: var(--brand-soft);
  /* 显式指定 emoji 字体，避免某些环境下渲染成方块 */
  font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
}

:root[data-skin="y2k"] .zone-icon { border-radius: 50%; }

.zone-icon svg { width: 20px; height: 20px; }
.zone-main-body .zone-icon svg { width: 22px; height: 22px; }
.zone-icon { color: var(--brand-ink); }

.zone-icon.accent { background: var(--accent-soft); color: var(--accent-ink); }

.zone h3 {
  margin: 0 0 6px;
  font-size: 15.5px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.zone p {
  margin: 0;
  font-size: 13.5px;
  color: var(--ink-2);
  line-height: 1.65;
}

.zone .go {
  margin-top: 12px;
  font-size: 13px;
  color: var(--brand-ink);
  font-weight: 700;
}

/* ---------- Bento Grid：首页三个区 ---------- */

.bento {
  display: grid;
  gap: 14px;
  grid-template-columns: 1fr 1fr;
  grid-template-areas:
    "main main"
    "guides swap";
}

.bento .zone--main { grid-area: main; }
.bento .zone--guides { grid-area: guides; }
.bento .zone--swap { grid-area: swap; }

/* 主链路横跨整行，内部左右分栏：左边讲价值，右边放三步流程 */
.zone--main {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(190px, 1fr);
  align-items: center;
  gap: 26px;
  background:
    radial-gradient(120% 150% at 100% 0%, var(--brand-soft) 0%, var(--surface) 58%);
  border-color: var(--brand-line);
}

.zone-main-body {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.zone-main-body > * { margin: 0; }

.zone-main-body h3 { font-size: 17.5px; }

.zone-main-body .zone-icon {
  width: 42px;
  height: 42px;
  font-size: 21px;
  background: var(--surface);
  box-shadow: var(--shadow-1);
}

.zone-meta {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

/* 右侧三步流程 */
.zone-steps {
  display: flex;
  flex-direction: column;
  gap: 9px;
  padding: 16px 18px;
  border-radius: var(--radius);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  border: 1px dashed var(--brand-line);
}

.zone-steps .step {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--brand-ink);
}

.zone-steps .step b {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  background: var(--brand-vivid);
  color: #fff;
  font-size: 12px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
}

:root[data-skin="y2k"] .zone-steps .step b { border-radius: 50%; }

@media (max-width: 860px) {
  .bento {
    grid-template-columns: 1fr;
    grid-template-areas: "main" "guides" "swap";
  }
  .zone--main {
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .zone-steps { display: none; }
}

/* ============================================================
   八、按钮
   ============================================================ */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 16px;
  border-radius: var(--radius-btn);
  border: 1px solid transparent;
  font-size: 14px;
  font-weight: 650;
  line-height: 1.2;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
    transform .1s var(--ease), box-shadow var(--dur) var(--ease);
  white-space: nowrap;
}

.btn:active { transform: translateY(1px); }

.btn-primary {
  background: var(--brand);
  color: #fff;
  box-shadow: 0 2px 8px var(--brand-ring);
}

.btn-primary:hover {
  filter: brightness(1.08);
  box-shadow: 0 5px 16px var(--brand-ring);
}

.hero .btn-primary:hover { filter: brightness(.97); }

.btn-ghost {
  background: rgba(255, 255, 255, .14);
  color: #fff;
  border-color: rgba(255, 255, 255, .3);
}

.btn-line {
  background: var(--surface);
  color: var(--ink);
  border-color: var(--line-strong);
}

.btn-line:hover {
  background: var(--surface-2);
  border-color: var(--brand-line);
  color: var(--brand-ink);
}

.btn-sm { padding: 6px 12px; font-size: 13px; }

/* ============================================================
   九、空状态
   ============================================================ */

.empty {
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius-card);
  padding: 34px 20px;
  text-align: center;
  background: var(--surface-2);
}

.empty .empty-title {
  font-size: 14.5px;
  font-weight: 650;
  margin-bottom: 6px;
}

.empty p {
  margin: 0 auto 14px;
  max-width: 34em;
  font-size: 13.5px;
  color: var(--ink-2);
}

/* ============================================================
   十、标签 / 提示条
   ============================================================ */

.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 9px;
  border-radius: var(--radius-chip);
  font-size: 12px;
  font-weight: 650;
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--ink-2);
  white-space: nowrap;
}

:root[data-skin="y2k"] .tag { border-style: dashed; }

.tag.brand { background: var(--brand-soft); border-color: var(--brand-line); color: var(--brand-ink); }
.tag.accent { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-ink); }
.tag.ok { background: var(--ok-soft); border-color: var(--ok-line); color: var(--ok-ink); }
.tag.warn { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn-ink); }

.notice {
  display: flex;
  gap: 10px;
  padding: 12px 14px;
  border-radius: var(--radius);
  background: var(--brand-soft);
  border: 1px solid var(--brand-line);
  font-size: 13.5px;
  color: var(--brand-ink);
  line-height: 1.65;
}

.notice.warn {
  background: var(--warn-soft);
  border-color: var(--warn-line);
  color: var(--warn-ink);
}

/* ============================================================
   十一、表格
   ============================================================ */

.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  background: var(--surface);
}

table.cmp {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
  min-width: 520px;
}

table.cmp th,
table.cmp td {
  padding: 10px 12px;
  text-align: left;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}

table.cmp thead th {
  background: var(--surface-2);
  font-weight: 650;
  color: var(--ink-2);
  position: sticky;
  top: 0;
}

table.cmp tbody tr:last-child td { border-bottom: 0; }

table.cmp td:first-child,
table.cmp th:first-child {
  position: sticky;
  left: 0;
  background: var(--surface);
  z-index: 1;
  box-shadow: 1px 0 0 var(--line);
}

table.cmp thead th:first-child { background: var(--surface-2); }

/* 表格里「有 / —」的对比：有值的一格给一点底色，空的一格缩到最小存在感 */
table.cmp td.cmp-no {
  color: var(--line-strong);
  text-align: center;
}

table.cmp td.cmp-yes {
  background: rgba(46, 204, 113, 0.10);
  background: color-mix(in srgb, var(--ok) 14%, transparent);
}

table.cmp .cmp-mark {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  line-height: 1.5;
  color: var(--ok-ink);
  background: var(--ok-soft);
}

table.cmp .cmp-val {
  margin-left: 6px;
  font-size: 12.5px;
  color: var(--ink-2);
}

/* 只有一个候选填了的参数：差异信号，做轻一点，别抢「有」的位置 */
table.cmp .cmp-only {
  margin-left: 7px;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--accent-ink);
  opacity: 0.9;
}

.cmp-legend {
  margin: 8px 2px 0;
  font-size: 12px;
  color: var(--ink-3);
}

/* ============================================================
   十二、表单
   ============================================================ */

.field { margin-bottom: 14px; }

.field > label {
  display: block;
  font-size: 13.5px;
  font-weight: 650;
  margin-bottom: 6px;
}

.field .desc {
  font-size: 12.5px;
  color: var(--ink-3);
  margin-bottom: 6px;
}

.input,
.textarea,
.select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  font: inherit;
  font-size: 14px;
  color: var(--ink);
  transition: border-color var(--dur), box-shadow var(--dur);
}

.input:focus,
.textarea:focus,
.select:focus {
  outline: none;
  border-color: var(--brand-vivid);
  box-shadow: 0 0 0 3px var(--brand-ring);
}

.textarea { resize: vertical; min-height: 74px; }

.form-grid {
  display: grid;
  gap: 12px;
  grid-template-columns: 1fr 1fr;
}

@media (max-width: 620px) {
  .form-grid { grid-template-columns: 1fr; }
}

/* ============================================================
   十三、投票卡片（候选）
   ============================================================ */

.vote-card {
  text-align: left;
  width: 100%;
  font: inherit;
  color: inherit;
}

/* 候选序号徽章：替代 emoji，避免无彩色字体环境退化 */
.opt-no {
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 7px;
  background: var(--brand-soft);
  color: var(--brand-ink);
  font-size: 12px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  flex: 0 0 auto;
}

:root[data-skin="y2k"] .opt-no { border-radius: 50%; }

.vote-card.is-picked {
  border-color: var(--brand-vivid);
  box-shadow: 0 0 0 3px var(--brand-ring);
}

/* 投票提交后的弹跳反馈（由 views.js 加 .just-voted） */
.vote-card.just-voted {
  animation: pop .34s var(--ease);
}

@keyframes pop {
  0%   { transform: scale(1); }
  38%  { transform: scale(1.022); }
  100% { transform: scale(1); }
}

:root[data-skin="y2k"] .vote-card.is-picked::after {
  content: "";
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  box-shadow: 0 0 0 6px rgba(157, 141, 241, .13);
  pointer-events: none;
}

/* ---------- 结论卡 / 平票卡 ---------- */

.card--win {
  border-color: var(--ok-line);
  background: var(--ok-soft);
}

.card--tie {
  border-color: var(--accent-line);
  background: var(--accent-soft);
}

.conclusion-label {
  font-size: 12.5px;
  font-weight: 700;
  margin-bottom: 4px;
  letter-spacing: .02em;
}

.card--win .conclusion-label { color: var(--ok-ink); }
.card--tie .conclusion-label { color: var(--accent-ink); }

.conclusion-main {
  font-size: 18px;
  font-weight: 750;
  margin-bottom: 6px;
  letter-spacing: -.015em;
}

.conclusion-sub {
  font-size: 13.5px;
  color: var(--ink-2);
}

.card--tie .conclusion-sub { color: var(--accent-ink); }

/* ---------- 结果条 ---------- */

.bar-row { margin-bottom: 12px; }

.bar-top {
  display: flex;
  justify-content: space-between;
  font-size: 13.5px;
  margin-bottom: 5px;
  gap: 12px;
}

/* 结果条同理：名字长就换行，数字固定在右侧 */
.bar-top { flex-wrap: wrap; align-items: baseline; }

.bar-top > span:first-child {
  flex: 1 1 12ch;
  min-width: 0;
  white-space: normal;
  overflow: visible;
  text-overflow: clip;
  overflow-wrap: anywhere;
}

.bar-num {
  flex: 0 0 auto;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  font-family: var(--font-num);
  font-size: 12.5px;
}

.bar-track {
  height: 8px;
  background: var(--line);
  border-radius: 99px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  border-radius: 99px;
  background: var(--line-strong);
  transition: width .45s var(--ease);
}

.bar-fill.is-lead { background: var(--brand-vivid); }

/* ---------- 建议框（平票兜底） ---------- */

.suggest-box {
  margin-top: 14px;
  padding: 14px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--accent-line);
}

.suggest-box .suggest-label {
  font-size: 13px;
  color: var(--accent-ink);
  font-weight: 700;
  margin-bottom: 4px;
}

.suggest-box .suggest-main {
  font-size: 16px;
  font-weight: 750;
  margin-bottom: 6px;
}

.suggest-box .suggest-why {
  font-size: 13.5px;
  color: var(--ink-2);
}

.suggest-box .suggest-note {
  font-size: 12px;
  color: var(--ink-3);
  margin-top: 8px;
}

/* ---------- 分享面板 ---------- */

.block-gap { margin-top: 28px; }

.share-box {
  margin-top: 14px;
  padding: 16px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--line);
}

.share-head {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.share-title {
  font-size: 14.5px;
  font-weight: 700;
}

.vis-badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 700;
  line-height: 1.7;
  background: var(--ok-soft);
  border: 1px solid var(--ok-line);
  color: var(--ok-ink);
}

.vis-badge.is-link {
  background: var(--brand-soft);
  border-color: var(--brand-line);
  color: var(--brand-ink);
}

.share-sub {
  margin: 8px 0 0;
  font-size: 13.5px;
  color: var(--ink-2);
  line-height: 1.6;
}

.share-field {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.share-field .input {
  flex: 1 1 200px;
  min-width: 0;
  font-size: 13px;
}

.share-field .btn {
  flex: 0 0 auto;
}

.share-note {
  margin: 10px 0 0;
  font-size: 11.5px;
  color: var(--ink-3);
  line-height: 1.55;
}

/* ============================================================
   十四、设置页：皮肤选择器
   ============================================================ */

.skin-grid {
  display: grid;
  gap: 14px;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
}

.skin-card {
  position: relative;
  display: block;
  width: 100%;
  text-align: left;
  padding: 0;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: var(--radius-card);
  overflow: hidden;
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease),
    transform var(--dur) var(--ease);
}

.skin-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-2);
  border-color: var(--line-strong);
}

.skin-card.is-active {
  border-color: var(--brand-vivid);
  box-shadow: 0 0 0 3px var(--brand-ring);
}

/* 缩略图：纯 CSS 画，不用图片，换皮肤时自动跟着变 */
.skin-preview {
  height: 104px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.skin-preview.fresh {
  background: linear-gradient(135deg, #e6f6fc, #f7f9fb);
}

.skin-preview.y2k {
  background: linear-gradient(135deg, #f0ecfd, #eefbf5);
}

.skin-preview .mini-hero {
  height: 26px;
  border-radius: 7px;
  background: linear-gradient(135deg, #0b7ca4, #1a93bc);
  width: 62%;
}

.skin-preview.y2k .mini-hero {
  background: linear-gradient(135deg, #f2eefd, #e6f6f1);
  border: 1px solid #ded6fa;
  border-radius: 10px;
}

.skin-preview .mini-row {
  display: flex;
  gap: 6px;
}

.skin-preview .mini-card {
  flex: 1;
  height: 22px;
  border-radius: 6px;
  background: #fff;
  border: 1px solid #e3ebf1;
}

.skin-preview.y2k .mini-card {
  border-radius: 10px;
  border: 1px dashed #d3cce7;
}

.skin-preview .mini-btn {
  width: 44px;
  height: 12px;
  border-radius: 6px;
  background: #1a93bc;
}

.skin-preview.y2k .mini-btn {
  border-radius: 99px;
  background: #7a68d9;
}

.skin-body {
  padding: 12px 14px 14px;
  border-top: 1px solid var(--line);
}

.skin-name {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14.5px;
  font-weight: 700;
  margin-bottom: 4px;
}

.skin-swatches {
  display: flex;
  gap: 4px;
  margin-left: auto;
}

.skin-swatches i {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  display: block;
}

.skin-desc {
  font-size: 12.5px;
  color: var(--ink-3);
  line-height: 1.6;
}

.skin-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  padding: 2px 9px;
  border-radius: 99px;
  background: var(--brand);
  color: #fff;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .01em;
}

/* ============================================================
   十五、页脚
   ============================================================ */

.footer {
  border-top: 1px solid var(--line);
  background: var(--surface);
  margin-top: 40px;
}

.footer-inner {
  max-width: var(--content);
  margin: 0 auto;
  padding: 16px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: space-between;
  font-size: 12.5px;
  color: var(--ink-3);
}

.footer-note { color: var(--ink-3); }

/* ============================================================
   十六、Toast
   ============================================================ */

.toast-host {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 200;
  pointer-events: none;
}

.toast {
  background: var(--ink);
  color: var(--surface);
  padding: 9px 16px;
  border-radius: var(--radius-chip);
  font-size: 13.5px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .24);
  animation: toast-in .2s var(--ease);
}

@keyframes toast-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============================================================
   十七、投票信用：专家票型 / 徽章 / 标签 / 信用主页
   ============================================================ */

/* ---------- 分档徽章（他人视角唯一可见的东西） ---------- */

.voter-badge {
  display: inline-flex;
  align-items: center;
  padding: 1px 8px;
  border-radius: var(--radius-chip);
  font-size: 11.5px;
  font-weight: 700;
  border: 1px solid transparent;
  white-space: nowrap;
}

.voter-badge.high {
  background: var(--brand-soft);
  color: var(--brand-ink);
  border-color: var(--brand-line);
}

.voter-badge.mid {
  background: var(--surface-2);
  color: var(--ink-2);
  border-color: var(--line-strong);
}

.voter-badge.normal {
  background: var(--surface-2);
  color: var(--ink-3);
  border-color: var(--line);
}

/* ---------- 专家票型面板 ---------- */

.expert {
  margin-top: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  background: var(--surface);
  overflow: hidden;
}

.expert-head {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  background: transparent;
  border: 0;
  text-align: left;
  font: inherit;
  color: inherit;
  transition: background var(--dur) var(--ease);
}

.expert-head:hover { background: var(--surface-2); }

.expert-title {
  font-size: 14px;
  font-weight: 700;
  flex: 0 0 auto;
}

.expert-summary {
  font-size: 12.5px;
  color: var(--ink-3);
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.expert-caret {
  font-size: 12.5px;
  font-weight: 650;
  color: var(--brand-ink);
  flex: 0 0 auto;
}

.expert-body {
  padding: 0 16px 14px;
  border-top: 1px dashed var(--line);
}

.expert-note {
  font-size: 12.5px;
  color: var(--ink-3);
  line-height: 1.6;
  padding: 10px 0 6px;
}

.expert-group { padding: 9px 0 4px; border-top: 1px dashed var(--line); }

.expert-group:first-of-type { border-top: 0; }

.expert-group-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.expert-group-count {
  font-size: 12px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}

.expert-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 92px auto;
  gap: 10px;
  align-items: center;
  font-size: 13px;
  padding: 3px 0;
}

.expert-opt {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.expert-meter {
  height: 6px;
  background: var(--line);
  border-radius: 99px;
  overflow: hidden;
}

.expert-meter i {
  display: block;
  height: 100%;
  background: var(--brand-vivid);
  border-radius: 99px;
}

.expert-num {
  font-size: 12px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.expert-filtered {
  margin-top: 10px;
  padding: 9px 11px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  border: 1px dashed var(--line-strong);
  font-size: 12.5px;
  color: var(--ink-2);
  line-height: 1.6;
}

.expert-tags { margin-top: 12px; }

.expert-tags-label {
  font-size: 12.5px;
  color: var(--ink-3);
  margin-bottom: 6px;
}

.expert-tags-list {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.expert-hint {
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  background: var(--accent-soft);
  border: 1px solid var(--accent-line);
  color: var(--accent-ink);
  font-size: 12.5px;
  line-height: 1.65;
}

.expert-empty {
  padding: 12px 0;
  font-size: 12.5px;
  color: var(--ink-3);
  line-height: 1.65;
}

/* ---------- 投票动机标签 ---------- */

.tag-picker {
  margin-top: 12px;
  padding: 12px 14px;
  border-radius: var(--radius);
  background: var(--surface-2);
  border: 1px solid var(--line);
}

.tag-picker-label {
  font-size: 12.5px;
  color: var(--ink-2);
  font-weight: 650;
  margin-bottom: 8px;
}

.tag-picker-label span {
  font-weight: 400;
  color: var(--ink-3);
}

.tag-picker-list {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.tag-chip {
  padding: 4px 11px;
  border-radius: 99px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  font-size: 12.5px;
  color: var(--ink-2);
  transition: background var(--dur), border-color var(--dur), color var(--dur);
}

.tag-chip:hover { border-color: var(--brand-line); color: var(--brand-ink); }

.tag-chip.is-on {
  background: var(--brand-soft);
  border-color: var(--brand-line);
  color: var(--brand-ink);
  font-weight: 650;
}

/* ---------- 信用主页 ---------- */

.credit-card { padding: 18px; }

.credit-top {
  display: flex;
  gap: 20px;
  align-items: flex-start;
  justify-content: space-between;
  flex-wrap: wrap;
}

.credit-score {
  font-size: 34px;
  font-weight: 780;
  letter-spacing: -.03em;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
  display: flex;
  align-items: baseline;
  gap: 4px;
}

.credit-unit {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-3);
  letter-spacing: 0;
}

.credit-tier { margin-top: 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.credit-stats {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
}

.credit-stats > div {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.credit-stats b {
  font-size: 17px;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.01em;
}

.credit-stats span {
  font-size: 11.5px;
  color: var(--ink-3);
}

.credit-meter {
  margin-top: 16px;
  height: 8px;
  border-radius: 99px;
  background: var(--line);
  overflow: hidden;
}

.credit-meter i {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, var(--brand-vivid), var(--brand));
  transition: width .5s var(--ease);
}

.credit-scale {
  position: relative;
  height: 30px;
  margin-top: 6px;
  font-variant-numeric: tabular-nums;
}

.credit-scale span {
  position: absolute;
  font-size: 10.5px;
  color: var(--ink-3);
  white-space: nowrap;
}

.credit-explain {
  margin: 14px 0 0;
  font-size: 12.5px;
  color: var(--ink-2);
  line-height: 1.7;
}

.credit-list { display: flex; flex-direction: column; gap: 10px; }

.credit-row {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  justify-content: space-between;
}

.credit-row-main { min-width: 0; flex: 1; }

.credit-row-title {
  font-size: 14px;
  font-weight: 650;
  margin-bottom: 4px;
}

.credit-row-detail {
  font-size: 12.5px;
  color: var(--ink-3);
  line-height: 1.65;
}

.credit-row-detail b { color: var(--ink-2); font-weight: 650; }

.credit-row-mark { flex: 0 0 auto; }

@media (max-width: 620px) {
  .expert-row { grid-template-columns: minmax(0, 1fr) auto; }
  .expert-row .expert-meter { display: none; }
  .credit-top { gap: 12px; }
  .credit-score { font-size: 28px; }
  .credit-row { flex-direction: column; gap: 8px; }
}

/* ============================================================
   十八、可访问性
   ============================================================ */

:where(a, button, input, select, textarea):focus-visible {
  outline: 2px solid var(--brand-vivid);
  outline-offset: 2px;
  border-radius: 6px;
}

.hero :focus-visible { outline-color: var(--hero-ink); }

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition-duration: .01ms !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
  .btn:hover,
  .zone:hover,
  .zone--main:hover,
  .skin-card:hover {
    transform: none;
  }
}

/* ============================================================
   十八、移动端
   ============================================================ */

@media (max-width: 720px) {
  .topbar-inner {
    flex-wrap: wrap;
    height: auto;
    padding: 10px 14px;
    gap: 10px;
  }

  /* 窄屏下标题按内容占位：长标题自然占满一行，短标题和提示同一行 */
  .section-head {
    flex-wrap: wrap;
    row-gap: 4px;
  }

  .section-head h2 { flex: 0 0 auto; max-width: 100%; }

  .tabs {
    order: 3;
    flex-basis: 100%;
    max-width: none;
  }

  .topbar-meta { margin-left: auto; }

  .app { padding: 16px 14px 48px; }

  .hero { padding: 24px 20px; }
  .hero h1 { font-size: 23px; line-height: 1.32; }
  .hero p { font-size: 14px; }

  /* 标题断点固定在逗号后，避免拆开词语 */
  .hero-h1-2 { display: block; }

  .card-grid { grid-template-columns: 1fr; }

  .skin-grid { grid-template-columns: 1fr; }

  /* 手机上隐藏版本号，把位置留给「我的」入口 */
  .badge#appVersion { display: none; }
}

/* ============================================================
   我的页（v0.0.8）
   信用卡片是这一页的主角：只给摘要，明细在 #/credit
   ============================================================ */

.me-card {
  display: flex;
  align-items: center;
  gap: 18px 24px;
  flex-wrap: wrap;
  padding: 20px 22px;
}

.me-card-main {
  flex: 1 1 260px;
  min-width: 0;
}

.me-label {
  font-size: 12.5px;
  color: var(--ink-3);
  letter-spacing: .02em;
}

.me-card .credit-score {
  font-size: 30px;
  margin-top: 4px;
}

.me-meta {
  font-size: 12.5px;
  color: var(--ink-2);
  margin-top: 8px;
}

.me-card-side {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}

.me-card-side .hint {
  font-size: 11.5px;
  text-align: right;

}

.me-poll-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.me-poll-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface);
  color: var(--ink);
  font-size: 13.5px;
  text-decoration: none;
  transition: border-color var(--dur), background var(--dur);

.me-poll-row:hover {

}

.me-poll-name {
  flex: 1 1 auto;
  min-width: 0;

.me-note {

@media (max-width: 599px) {

  .me-card-side { flex: 1 1 100%; align-items: stretch; }

  .me-card-side .btn { width: 100%; }
