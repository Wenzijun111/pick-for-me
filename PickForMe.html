  /* ============================================================
     知识库（#/kb）
     ------------------------------------------------------------
     定位：不是数据库，是「本机已沉淀攻略」的索引。
     把每篇攻略的参数字段拆出来做倒排，方便看
     「同一个参数字段被不同投票用过几次」。
     ============================================================ */

  function subTabs(active) {
    var rows = [
      { key: 'guides', href: '#/guides', label: '攻略列表' },
      { key: 'kb', href: '#/kb', label: '知识库' }
    ];
    return '<div class="subtabs">' + rows.map(function (r) {
      return '<a class="subtab' + (r.key === active ? ' is-on' : '') + '" href="' + r.href + '">' +
        esc(r.label) + '</a>';
    }).join('') + '</div>';
  }

  /* 参数字段倒排：字段名 → 出现次数 + 关联攻略 + 品类分布 */
  function kbParams(list) {
    var map = {};
    var seq = 0;
    (list || []).forEach(function (g) {
      (g.params || []).forEach(function (p) {
        var name = String((p && p.name) || '').trim();
        if (!name) return;
        var hit = map[name] || (map[name] = { name: name, count: 0, guides: [], cats: {}, seq: seq++ });
        hit.count += 1;
        if (hit.guides.indexOf(g.id) < 0) hit.guides.push(g.id);
        var c = g.category || '其他';
        hit.cats[c] = (hit.cats[c] || 0) + 1;
      });
    });
    return Object.keys(map).map(function (k) { return map[k]; })
      .sort(function (a, b) { return b.count - a.count || a.seq - b.seq; });
  }

  function kbCatCount(list) {
    var out = {};
    (list || []).forEach(function (g) {
      var c = g.category || '其他';
      out[c] = (out[c] || 0) + 1;
    });
    return out;
  }

  function kbHasParam(g, name) {
    return (g.params || []).some(function (p) { return String((p && p.name) || '') === name; });
  }

  function kbMatch(g, kw, cat, param) {
    if (cat && cat !== 'all' && (g.category || '其他') !== cat) return false;
    if (param && !kbHasParam(g, param)) return false;
    var k = String(kw || '').trim().toLowerCase();
    if (!k) return true;
    var hay = [g.title, g.summary, g.category].concat(
      (g.params || []).map(function (p) { return (p.name || '') + ' ' + (p.why || ''); }),
      (g.audience || []).map(function (a) { return (a.who || '') + ' ' + (a.pick || ''); }),
      (g.pitfalls || []).map(function (p) {
        return typeof p === 'string' ? p : (p.text || p.what || p.name || '');
      })
    ).join(' ').toLowerCase();
    return hay.indexOf(k) >= 0;
  }

  function kbRowHtml(g) {
    var points = (g.budget || []).length + (g.params || []).length +
      (g.audience || []).length + (g.pitfalls || []).length;
    var names = (g.params || []).map(function (p) { return p.name; }).filter(Boolean).slice(0, 3);
    return '<a class="kb-row" href="#/guide/' + esc(g.id) + '">' +
      '<span class="kb-row-cat">' + esc(g.category || '其他') + '</span>' +
      '<b>' + esc(g.title) + '</b>' +
      '<span class="kb-row-meta">' + points + ' 条要点' +
        (names.length ? ' · ' + esc(names.join(' / ')) : '') +
        (g.fromPollId ? ' · 来自一次投票' : '') +
      '</span>' +
    '</a>';
  }

  function renderKb() {
    var q = hashQuery();
    var cat = q.cat || 'all';
    var kw = q.q || '';
    var param = q.param || '';

    var all = Store.guides();
    var list = all.filter(function (g) { return kbMatch(g, kw, cat, param); });
    var params = kbParams(all);
    var cats = kbCatCount(all);

    var paramRow = params.length
      ? params.slice(0, 14).map(function (p) {
          var cs = Object.keys(p.cats).map(function (c) { return c + '×' + p.cats[c]; }).join(' · ');
          return '<button type="button" class="kb-param' + (param === p.name ? ' is-on' : '') + '"' +
            ' data-kb-param="' + esc(p.name) + '" title="' + esc(cs) + '">' +
            esc(p.name) + '<span>' + p.count + '</span></button>';
        }).join('')
      : '';

    var catRow = [{ key: 'all', label: '全部 ' + all.length }].concat(
      Object.keys(cats).sort(function (a, b) { return cats[b] - cats[a]; }).map(function (c) {
        return { key: c, label: c + ' ' + cats[c] };
      })
    ).map(function (c) {
      return '<button type="button" class="chip' + (cat === c.key ? ' is-on' : '') + '"' +
        ' data-kb-cat="' + esc(c.key) + '">' + esc(c.label) + '</button>';
    }).join('');

    var body;
    if (!all.length) {
      body = emptyBox('知识库还是空的',
        '发起一次投票，投完把结论存成攻略，条目会自己进来。', '<a class="btn btn-primary" href="#/new">发起投票</a>');
    } else {
      var noneReused = params.length && params.every(function (p) { return p.count <= 1; });
      body = (paramRow
        ? '<div class="kb-params-title">参数字段（点击筛选）' +
          (noneReused ? '<span class="kb-hint">还没有字段在不同攻略里复用——多沉淀几篇会开始重叠</span>' : '') +
          '</div><div class="kb-param-row">' +
          (param ? '<button type="button" class="kb-param is-on" data-kb-param="">全部字段 ×</button>' : '') +
          paramRow + '</div>'
        : '') +
        '<div class="chip-row">' + catRow + '</div>' +
        '<div class="kb-list">' +
          (list.length ? list.map(kbRowHtml).join('')
            : emptyBox('没有匹配的条目', '换个关键词，或清掉筛选条件。', '')
          ) +
        '</div>';
    }

    return '' +
      pageHead('知识库', all.length + ' 篇攻略 · ' + params.length + ' 个参数字段',
        '<button type="button" class="btn btn-line btn-sm" data-kb-export>导出 JSON</button>') +
      subTabs('kb') +
      '<div class="notice" style="margin-bottom:14px">' +
        '<div>这里索引的是<b>已有攻略</b>：每篇的四区块被拆成可检索的条目，' +
        '参数字段带出现次数——同一个字段被不同投票用过几次，一眼能看出来。' +
        '数据存放在' + dataWhere() + '，' + crossDevice() + '。</div>' +
      '</div>' +
      '<div class="filter-bar">' +
        '<input type="search" class="input filter-search" id="kbSearch" data-kb-search' +
          ' placeholder="搜标题、参数、适用人群、避坑点" value="' + esc(kw) + '">' +
        '<span class="result-count" id="kbCount">' + list.length + ' 条</span>' +
      '</div>' +
      body;
  }

  function bindKb(root, rerender) {
    /* 搜索：就地重绘，不整页渲染 */
    var input = D.$('#kbSearch', root);
    var box = D.$('#kbList, .kb-list', root);
    var count = D.$('#kbCount', root);
    if (!box) box = D.$('.kb-list', root);

    if (input && box) {
      var onCat = D.$('.chip.is-on', root);
      var activeCat = onCat ? onCat.getAttribute('data-kb-cat') || 'all' : 'all';
      var onParam = D.$('.kb-param.is-on', root);
      var activeParam = onParam ? onParam.getAttribute('data-kb-param') || '' : '';
      var timer = null;
      input.addEventListener('input', function () {
        clearTimeout(timer);
        timer = setTimeout(function () {
          var list = Store.guides().filter(function (g) {
            return kbMatch(g, input.value, activeCat, activeParam);
          });
          box.innerHTML = list.length ? list.map(kbRowHtml).join('')
            : emptyBox('没有匹配的条目', '换个关键词，或清掉筛选条件。', '');
          if (count) count.textContent = list.length + ' 条';
        }, 160);
      });
    }

    D.on(root, 'click', '[data-kb-cat]', function (e, el) {
      var c = el.getAttribute('data-kb-cat');
      var q = hashQuery();
      var parts = [];
      if (q.q) parts.push('q=' + encodeURIComponent(q.q));
      if (q.param) parts.push('param=' + encodeURIComponent(q.param));
      if (c && c !== 'all') parts.push('cat=' + encodeURIComponent(c));
      location.hash = '#/kb' + (parts.length ? '?' + parts.join('&') : '');
    });

    D.on(root, 'click', '[data-kb-param]', function (e, el) {
      var p = el.getAttribute('data-kb-param');
      var q = hashQuery();
      var parts = [];
      if (q.q) parts.push('q=' + encodeURIComponent(q.q));
      if (q.cat && q.cat !== 'all') parts.push('cat=' + encodeURIComponent(q.cat));
      if (p) parts.push('param=' + encodeURIComponent(p));
      location.hash = '#/kb' + (parts.length ? '?' + parts.join('&') : '');
    });

    D.on(root, 'click', '[data-kb-export]', function () {
      var list = Store.guides();
      var payload = {
        format: 'pick-for-me/kb',
        version: (Store.VERSION || ''),
        exportedAt: new Date().toISOString(),
        count: list.length,
        params: kbParams(list),
        guides: list
      };
      if (!(window.Blob && window.URL && window.URL.createObjectURL)) {
        D.toast('这个浏览器不支持直接下载，共 ' + list.length + ' 篇');
        return;
      }
      var stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
      var url = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }));
      var a = document.createElement('a');
      a.href = url;
      a.download = 'pick-for-me-kb-' + stamp + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      D.toast('已导出 ' + list.length + ' 篇攻略');
    });
  }

  /* ============================================================
     链路演示（#/flow）
     ------------------------------------------------------------
     把四个技能串起来跑一遍，每步展开看输入输出。
     数据全在内存里，不写 localStorage——演示不污染用户数据。
     ============================================================ */

  var FLOW_STEPS = [
    { n: '01', name: '起草候选', skill: 'poll-designer', note: '一句话 → 品类 / 预算 / 参数 / 三个候选' },
    { n: '02', name: '发起投票', skill: '—', note: '候选进表单，人开始投' },
    { n: '03', name: '计票出结论', skill: 'poll-result', note: '票数 / 平票建议 / 门槛 / 信用' },
    { n: '04', name: '沉淀攻略', skill: 'guide-writer', note: '结论 → 四区块，存进知识库' },
    { n: '05', name: '交换匹配', skill: 'swap-matcher', note: '品类 / 价值 / 成色 / 新鲜度打分排序' }
  ];

  function flowJson(x) {
    try { return JSON.stringify(x, null, 2); } catch (e) { return String(x); }
  }

  function flowRun() {
    var now = new Date();
    var nowIso = now.toISOString();
    var back = function (h) { return new Date(now.getTime() - h * 3600000).toISOString(); };
    var steps = [];

    /* 01 起草候选 */
    var text = '1500 左右的降噪耳机，通勤用';
    var design = (window.Designer && typeof window.Designer.build === 'function')
      ? window.Designer.build({ text: text })
      : { ok: false, error: 'poll-designer 镜像没加载' };

    steps.push({
      input: { text: text },
      output: design,
      brief: (design && design.ok)
        ? '认出「' + (design.parsed.category || '未识别') + '」，预算 ' + (design.parsed.budgetLabel || '未给') +
          '，起草 ' + (design.candidates || []).length + ' 个候选'
        : '没跑通：' + ((design && design.error) || '未知原因')
    });
    if (!design || !design.ok) return steps;

    /* 02 发起投票 */
    var opts = (design.candidates || []).map(function (c, i) {
      return {
        id: 'o' + (i + 1),
        name: c.name,
        price: c.price,
        desc: (c.params || []).map(function (p) { return p.k + ' ' + p.v; }).join(' / '),
        addedBy: 'u_flow',
        addedAt: nowIso
      };
    });
    var winId = opts[Math.min(1, opts.length - 1)].id;
    var loseId = opts[0].id;
    var votes = [
      { id: 'fv1', voterId: 'u_a', by: '演示 A', at: back(6), choice: [winId] },
      { id: 'fv2', voterId: 'u_b', by: '演示 B', at: back(5), choice: [winId] },
      { id: 'fv3', voterId: 'u_c', by: '演示 C', at: back(4), choice: [winId] },
      { id: 'fv4', voterId: 'u_d', by: '演示 D', at: back(3), choice: [loseId] }
    ];
    var poll = {
      id: 'flow_poll',
      title: '通勤用降噪耳机，预算 1500',
      category: design.parsed.category || '其他',
      type: 'single',
      anonymous: false,
      visibility: 'public',
      archived: false,
      deadline: '',
      createdAt: nowIso,
      authorId: 'u_flow',
      authorName: '演示',
      options: opts,
      votes: votes
    };
    steps.push({
      input: { title: poll.title, options: opts.length, votes: votes.length },
      output: poll,
      brief: opts.length + ' 个候选进了表单，收到 ' + votes.length + ' 票'
    });

    /* 03 计票 */
    var ev = (window.Decision && typeof window.Decision.evaluate === 'function')
      ? window.Decision.evaluate({ poll: poll, now: nowIso })
      : { ok: false, error: 'poll-result 镜像没加载' };
    var result = (ev && ev.ok) ? ev.result : null;
    var winRow = null;
    if (result && result.winners && result.winners.length) {
      (result.rows || []).forEach(function (r) {
        if (r.optionId === result.winners[0]) winRow = r;
      });
    }
    var winName = winRow ? winRow.name : '—';
    steps.push({
      input: { pollId: poll.id, votes: votes.length, now: nowIso },
      output: ev,
      brief: result
        ? (result.tie
            ? '打平了：' + ((result.verdict && result.verdict.statement) || '')
            : '「' + winName + '」以 ' +
              (result.max || 0) + '/' + (result.total || 0) + ' 票胜出')
        : '没跑通：' + ((ev && ev.error) || '未知原因')
    });

    /* 04 沉淀攻略 */
    if (result) {
      var gd = (window.Guide && typeof window.Guide.build === 'function')
        ? window.Guide.build({ poll: poll, result: result })
        : { ok: false, error: 'guide-writer 镜像没加载' };
      var d = (gd && gd.draft) || {};
      steps.push({
        input: { pollId: poll.id, winnerId: result.winners[0] || null },
        output: gd,
        brief: (gd && gd.ok)
          ? '四区块成形：' + (d.budget || []).length + ' 档预算、' + (d.params || []).length +
            ' 个参数、' + (d.audience || []).length + ' 类人群、' + (d.pitfalls || []).length + ' 条避坑'
          : '没跑通：' + ((gd && gd.error) || '未知原因')
      });
    }

    /* 05 交换匹配 */
    var mine = [{
      id: 'm1',
      have: { name: '旧款蓝牙耳机', category: '数码', condition: 'good', value: 620 },
      want: { name: '降噪耳机', category: '数码', valueMin: 900, valueMax: 1600 }
    }];
    var list = [
      { id: 's1', owner: 'u_x', ownerName: '演示 X', status: 'open',
        have: { name: '降噪耳机 A', category: '数码', condition: 'new', value: 1450 },
        want: { name: '耳机', category: '数码' }, createdAt: back(2) },
      { id: 's2', owner: 'u_y', ownerName: '演示 Y', status: 'open',
        have: { name: '磨豆机', category: '家电', condition: 'new', value: 560 },
        want: { name: '厨具', category: '家电' }, createdAt: back(20) },
      { id: 's3', owner: 'u_z', ownerName: '演示 Z', status: 'open',
        have: { name: '降噪耳机 B', category: '数码', condition: 'good', value: 1180 },
        want: { name: '键盘', category: '数码' }, createdAt: back(30) }
    ];
    var sw = (window.SwapMatch && typeof window.SwapMatch.build === 'function')
      ? window.SwapMatch.build({ now: nowIso, me: { id: 'u_flow' }, mine: mine, list: list, limit: 5 })
      : { ok: false, error: 'swap-matcher 镜像没加载' };
    steps.push({
      input: { mine: mine.length, list: list.length, now: nowIso },
      output: sw,
      brief: (sw && sw.ok)
        ? '比了 ' + ((sw.meta && sw.meta.scanned) || 0) + ' 条，返回 ' +
          ((sw.meta && sw.meta.returned) || 0) + ' 条'
        : '没跑通：' + ((sw && sw.error) || '未知原因')
    });

    return steps;
  }

  function flowStepHtml(s, i) {
    var meta = FLOW_STEPS[i] || { n: String(i + 1), name: s.key || '', skill: '', note: '' };
    var ok = !(s.output && s.output.ok === false);
    return '<div class="flow-step' + (ok ? ' is-ok' : ' is-err') + '">' +
      '<div class="flow-head">' +
        '<span class="flow-n">' + esc(meta.n) + '</span>' +
        '<b class="flow-name">' + esc(meta.name) + '</b>' +
        (meta.skill !== '—' ? '<span class="chip-sm">' + esc(meta.skill) + '</span>' : '') +
        '<span class="flow-flag">' + (ok ? '✓ 跑通' : '✕ 没跑通') + '</span>' +
      '</div>' +
      '<p class="flow-note">' + esc(meta.note) + '</p>' +
      '<p class="flow-brief">' + esc(s.brief || '') + '</p>' +
      '<details class="flow-detail"' + (i === 0 ? ' open' : '') + '>' +
        '<summary>看输入 / 输出 JSON</summary>' +
        '<div class="flow-io">' +
          '<div class="flow-io-col"><span>输入</span><pre>' + esc(flowJson(s.input)) + '</pre></div>' +
          '<div class="flow-io-col"><span>输出</span><pre>' + esc(flowJson(s.output)) + '</pre></div>' +
        '</div>' +
      '</details>' +
    '</div>';
  }

  function renderFlow() {
    var steps = flowRun();
    var okCount = steps.filter(function (s) { return !(s.output && s.output.ok === false); }).length;
    return '' +
      pageHead('链路演示', okCount + '/' + steps.length + ' 步跑通 · 不写你的数据',
        '<a class="btn btn-line btn-sm" href="#/">回到帮我选</a>') +
      '<div class="notice" style="margin-bottom:14px">' +
        '<div>这条链路跑在浏览器里：<b>起草候选 → 发起投票 → 计票 → 沉淀攻略 → 交换匹配</b>。' +
        '每一步都调对应技能的内核，输入输出都能展开看。演示用内存数据，' +
        '<b>不会写进你的本机存储</b>。同一份输入重跑一次，结果应该一模一样。</div>' +
      '</div>' +
      '<div class="flow-list">' + steps.map(flowStepHtml).join('') + '</div>' +
      '<div class="flow-foot">' +
        '<a class="btn btn-primary" href="#/new">按这条链路自己发一票</a>' +
        '<a class="btn btn-line" href="#/kb">看看沉淀下来的知识库</a>' +
      '</div>';
  }

  function renderAbout() {
    return '' +
      pageHead('平台说明与免责', '这个站做什么、不做什么') +

      '<section class="doc-section">' +
        '<h3 class="doc-h">一、Pick For Me 是什么</h3>' +
        '<p class="doc-p">一个帮人在几个候选里做决定的工具，由三个区组成，三段是连着的：</p>' +
        '<ul class="doc-ul">' +
          '<li><b>帮我选</b>：把 2–8 个候选放进去，让认识的人投票，最后给一个能解释的结论；</li>' +
          '<li><b>选品攻略</b>：把一次选购的经验写成结构化攻略（预算档位 / 关键参数 / 适用人群 / 避坑点），' +
            '下次别人可以直接用；</li>' +
          '<li><b>跟我换</b>：把闲置物品挂出来，等别人拿东西来换。不涉及钱。</li>' +
        '</ul>' +
        '<p class="doc-p">一句话：<b>投票、攻略、交换三段闭环，一次决策沉淀成下一次的攻略。</b></p>' +
      '</section>' +

      '<section class="doc-section">' +
        '<h3 class="doc-h">二、它不是什么（免责）</h3>' +
        '<ul class="doc-ul">' +
          '<li><b>不是购物平台</b>：站内不售货、不收款、不提供比价服务；' +
            '候选里的价格是发起者自己填的参考价，可能过期、可能不准。</li>' +
          '<li><b>攻略只是用户经验</b>：参数、预算档位、避坑点都由作者填写，' +
            '只代表个人判断，<b>不构成购买建议</b>。下单前请自己核对官方参数与售后政策。</li>' +
          '<li><b>交换不含支付与担保</b>：平台不介入交易、不保管物品、不承担赔付。' +
            '见面验货、当面确认、不提前转账，是双方自己的责任。</li>' +
          '<li><b>投票结论不是事实判断</b>：它只表示参与投票的人怎么想，' +
            '样本小、圈子有限，请当作参考而不是结论。</li>' +
        '</ul>' +
      '</section>' +

      '<section class="doc-section">' +
        '<h3 class="doc-h">三、内容由用户提供</h3>' +
        '<p class="doc-p">投票、攻略、交换信息均由用户自行发布，平台不预先审核。' +
          '如果看到明显虚假、侵权或涉及违禁物品的内容，请通过发起者留下的联系方式反馈；' +
          '本原型还没有举报入口，这是已知缺失。</p>' +
      '</section>' +

      '<section class="doc-section">' +
        '<h3 class="doc-h">四、隐私与数据</h3>' +
        '<ul class="doc-ul">' +
          '<li>账号、投票、消息、收藏存放在<b>' + dataWhere() + '</b>；' + crossDevice() + '；</li>' +
          '<li>页面里的"妈 / 爸 / 二姨 / 同事小林"等是<b>演示数据</b>，不是真实用户；</li>' +
          '<li>想清空这台设备上的数据：在浏览器里清除本站数据，或打开控制台执行 ' +
            '<code>Store.reset()</code> 后刷新' +
            (cloudOn() ? '（云端数据不受影响，重新登录会拉回来）' : '') + '；</li>' +
          '<li>匿名投票不会展示投票人；实名投票只展示昵称与档位，不展示手机号。</li>' +
          '<li>「仅链接可见」的投票不会出现在首页列表，' +
            '<b>拿到链接就等于拿到访问权</b>——转发出去就等于把门打开了，发之前想清楚。</li>' +
        '</ul>' +
      '</section>' +

      '<section class="doc-section">' +
        '<h3 class="doc-h">五、这一版怎么做的</h3>' +
        '<p class="doc-p">首届「滴普杯」DeepWorks 校园黑客松 · 赛道 C 自由开放参赛作品。' +
          '前端是纯静态页面（无构建工具）。' + (cloudOn()
            ? '判定规则写在页面 JS 与 DeepWorks 技能里；数据存放在第三方托管数据库（Supabase），只存数据、不参与判定；'
            : '数据与规则都写在页面里的 JS 中；') +
          '方便评审直接打开源码核对每一条规则。</p>' +
        '<p class="doc-p">版本 <b>' + esc(Store.VERSION) + '</b>。' +
          '已知局限：' + (cloudOn()
            ? '判定规则写在网页与 DeepWorks 技能里，数据存放在第三方托管数据库（Supabase），' +
              '消息没有实时推送、刷新才拉取，信用分只由投票行为算出、交换完成情况暂未计入。'
            : '单文件离线版没有上传通道，消息仅在本机投递，信用分不支持跨设备。') + '</p>' +
      '</section>' +

      '<div class="doc-actions">' +
        '<a class="btn btn-primary" href="#/">开始用</a>' +
        '<a class="btn btn-line" href="#/rules">信用规则说明</a>' +
      '</div>';
  }

  global.Views = {
    renderHome: renderHome,
    renderNew: renderNew,
    bindNew: bindNew,
    renderPoll: renderPoll,
    bindPoll: bindPoll,
    renderGuides: renderGuides,
    bindGuides: bindGuides,
    renderKb: renderKb,
    bindKb: bindKb,
    renderFlow: renderFlow,
    renderGuide: renderGuide,
    bindGuide: bindGuide,
    renderGuideNew: renderGuideNew,
    bindGuideNew: bindGuideNew,
    renderSwap: renderSwap,
    bindSwap: bindSwap,
    renderSwapDetail: renderSwapDetail,
    bindSwapDetail: bindSwapDetail,
    renderSwapNew: renderSwapNew,
    bindSwapNew: bindSwapNew,
    renderLogin: renderLogin,
    bindLogin: bindLogin,
    renderNotFound: renderNotFound,
    renderRules: renderRules,
    renderAbout: renderAbout,
    renderMe: renderMe,
    bindMe: bindMe,
    applySkin: applySkin
  };

})(window);

</script>
<script>
/* assets/js/app.js */
/* ============================================================
   app.js — 路由与启动
   手写 hash 路由：无构建、file:// 下可直接跑。

   注意两个坑（已处理）：
   1. #app 节点本身不能复用 —— 直接 innerHTML 会保留旧的事件监听器，
      每次重渲染都往同一个节点上再绑一遍，点一次会触发 N 次。
      所以每次渲染都换一个新节点。
   2. 初始化顺序：先确认依赖脚本都在，再调用 Store。
   ============================================================ */

(function () {
  'use strict';

  var app = null;

  /* ---------- 路由解析 ---------- */

  function parse(hash) {
    var h = (hash || '').replace(/^#\/?/, '');
    /* hash 可以带查询串（#/guides?cat=数码），路由只看 # 之后、? 之前 */
    var qi = h.indexOf('?');
    if (qi >= 0) h = h.slice(0, qi);
    var parts = h.split('/').filter(Boolean);
    return { name: parts[0] || 'home', id: parts[1] || '' };
  }

  var TAB_OF = {
    home: 'vote',
    new: 'vote',
    poll: 'vote',
    guides: 'guides',
    guide: 'guides',
    kb: 'guides',
    swap: 'swap',
    me: 'me',
    credit: 'me'
  };
  /* ---------- 渲染 ---------- */

  function mount(html, after) {
    var old = app;
    var fresh = document.createElement('main');
    fresh.id = 'app';
    fresh.className = old.className;
    fresh.setAttribute('role', 'main');
    old.replaceWith(fresh);
    app = fresh;

    app.innerHTML = html;
    if (after) after();
  }

  function render() {
    var route = parse(location.hash);
    var html;
    var after = null;

    switch (route.name) {
      case 'home':
        html = Views.renderHome();
        break;

      case 'new':
        html = Views.renderNew();
        after = function () { Views.bindNew(app, render); };
        break;

      case 'poll':
        if (!route.id) { location.replace('#/'); return; }
        html = Views.renderPoll(route.id);
        after = function () { Views.bindPoll(app, route.id, render); };
        break;

      case 'guides':
        html = Views.renderGuides();
        after = function () { Views.bindGuides(app, render); };
        break;

      case 'kb':
        html = Views.renderKb();
        after = function () { Views.bindKb(app, render); };
        break;

      case 'flow':
        html = Views.renderFlow();
        break;

      case 'guide':
        if (route.id === 'new') {
          html = Views.renderGuideNew();
          after = function () { Views.bindGuideNew(app); };
        } else if (!route.id) {
          location.replace('#/guides');
          return;
        } else {
          html = Views.renderGuide(route.id);
          after = function () { Views.bindGuide(app, route.id, render); };
        }
        break;

      case 'swap':
        if (route.id === 'new') {
          html = Views.renderSwapNew();
          after = function () { Views.bindSwapNew(app); };
        } else if (route.id) {
          html = Views.renderSwapDetail(route.id);
          after = function () { Views.bindSwapDetail(app, route.id, render); };
        } else {
          html = Views.renderSwap();
          after = function () { Views.bindSwap(app, render); };
        }
        break;

      case 'login':
        html = Views.renderLogin();
        after = function () { Views.bindLogin(app, render); };
        break;

      case 'me':
        html = Views.renderMe();
        after = function () { Views.bindMe(app, render); };
        break;

      // 旧入口，保留兼容
      case 'settings':
        location.replace('#/me');
        return;

      case 'credit':
        html = Credit.pageHtml();
        after = function () { Credit.bind(app, render); };
        break;

      case 'rules':
        html = Views.renderRules();
        break;

      case 'about':
        html = Views.renderAbout();
        break;

      default:
        html = Views.renderNotFound(location.hash);
    }

    mount(html, after);

    paintTabs(TAB_OF[route.name]);
    paintChrome();
    document.title = titleOf(route);
    window.scrollTo(0, 0);
  }

  function titleOf(route) {
    var base = 'Pick For Me';
    if (route.name === 'guides') return '选品攻略 · ' + base;
    if (route.name === 'kb') return '知识库 · ' + base;
    if (route.name === 'flow') return '链路演示 · ' + base;
    if (route.name === 'guide') return (route.id === 'new' ? '投稿攻略' : '攻略详情') + ' · ' + base;
    if (route.name === 'swap') {
      if (route.id === 'new') return '发布交换 · ' + base;
      return (route.id ? '交换详情' : '跟我换') + ' · ' + base;
    }
    if (route.name === 'new') return '发起投票 · ' + base;
    if (route.name === 'me' || route.name === 'settings') return '我的 · ' + base;
    if (route.name === 'login') return '登录 · ' + base;
    if (route.name === 'credit') return '我的投票信用 · ' + base;
    if (route.name === 'rules') return '信用规则说明 · ' + base;
    if (route.name === 'about') return '平台说明与免责 · ' + base;
    return base;
  }

  function paintTabs(active) {
    D.$$('#tabs a').forEach(function (a) {
      if (a.getAttribute('data-tab') === active) {
        a.setAttribute('aria-current', 'page');
      } else {
        a.removeAttribute('aria-current');
      }
    });
  }

  /* ---------- 顶栏：登录态 + 消息红点 ---------- */

  function paintChrome() {
    var acc = (typeof Store.account === 'function') ? Store.account() : null;
    var entry = document.getElementById('authEntry');
    var av = document.getElementById('authAvatar');
    var nm = document.getElementById('authName');

    if (acc) {
      var voter = Store.me() || {};
      if (nm) nm.textContent = acc.name || voter.name || '我';
      if (av) av.textContent = voter.avatar || (Store.AVATARS && Store.AVATARS[0]) || '?';
      if (entry) {
        entry.setAttribute('href', '#/me');
        entry.classList.add('is-on');
      }
    } else {
      if (nm) nm.textContent = '登录';
      if (av) av.textContent = '?';
      if (entry) {
        entry.setAttribute('href', '#/login');
        entry.classList.remove('is-on');
      }
    }

    var n = (typeof Store.unreadCount === 'function') ? Store.unreadCount() : 0;
    var dot = document.getElementById('msgDot');
    if (dot) dot.hidden = n === 0;
    var btn = document.getElementById('msgBtn');
    if (btn) {
      btn.setAttribute('aria-label', n ? ('站内消息，' + n + ' 条未读') : '站内消息');
    }

    paintMessages();
  }

  function paintMessages() {
    var list = document.getElementById('msgList');
    if (!list) return;
    var msgs = (typeof Store.messages === 'function') ? Store.messages() : [];

    if (!msgs.length) {
      list.innerHTML = '<div class="msg-empty">' +
        (Store.isLoggedIn()
          ? '暂时没有消息。'
          : '登录后才会收到投票结束、新增候选和交换申请提醒。') +
        '</div>';
      return;
    }

    list.innerHTML = msgs.map(function (m) {
      var t = Store.MESSAGE_TYPES[m.type] || Store.MESSAGE_TYPES.system;
      return '<a class="msg-item' + (m.read ? '' : ' is-unread') + '"' +
          ' href="' + D.esc(m.href || '#/') + '" data-msg="' + D.esc(m.id) + '">' +
        '<span class="msg-tag ' + t.cls + '">' + D.esc(t.label) + '</span>' +
        '<span class="msg-body">' +
          '<span class="msg-title">' + D.esc(m.title) + '</span>' +
          '<span class="msg-text">' + D.esc(m.body) + '</span>' +
        '</span>' +
        '<span class="msg-time">' + D.ago(m.at) + '</span>' +
      '</a>';
    }).join('');
  }

  function bindChrome() {
    var btn = document.getElementById('msgBtn');
    var panel = document.getElementById('msgPanel');
    if (!btn || !panel) return;

    function close() {
      panel.hidden = true;
      btn.setAttribute('aria-expanded', 'false');
    }

    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = panel.hidden;
      panel.hidden = !open;
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });

    document.addEventListener('click', function (e) {
      if (panel.hidden) return;
      if (panel.contains(e.target) || btn.contains(e.target)) return;
      close();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') close();
    });

    panel.addEventListener('click', function (e) {
      var item = e.target.closest('[data-msg]');
      if (!item) return;
      /* 一定要拦住默认跳转：紧接着的 paintChrome() 会重写列表，
         被点的那条 <a> 会从 DOM 里消失，浏览器就把这次跳转取消了。 */
      e.preventDefault();
      var href = item.getAttribute('href') || '#/';
      Store.markRead(item.getAttribute('data-msg'));
      close();
      paintChrome();
      if (location.hash !== href) location.hash = href;
      /* 已经停在这条消息指向的页面时 hash 不会变，不手动重绘就看不到新状态 */
      else render();
    });

    var all = document.getElementById('msgReadAll');
    if (all) {
      all.addEventListener('click', function (e) {
        e.stopPropagation();
        Store.markAllRead();
        paintChrome();
        D.toast('消息已全部标为已读');
      });
    }
  }

  /* ---------- 启动 ---------- */

  function fail(msg) {
    var host = document.getElementById('app') || document.body;
    host.innerHTML =
      '<div class="empty"><div class="empty-title">页面没能启动</div>' +
      '<p>' + msg + '</p></div>';
  }

  function boot() {
    if (typeof Store === 'undefined' || typeof Views === 'undefined' || typeof D === 'undefined') {
      fail('脚本加载失败。请确认 assets/js/ 下 store.js、dom.js、views.js、app.js 都在，' +
           '且 index.html 底部的加载顺序是 store → dom → views → app。');
      return;
    }

    app = document.getElementById('app');
    if (!app) { fail('找不到 #app 容器。'); return; }

    /* 皮肤必须在首屏渲染前应用，避免先闪一下默认配色 */
    var savedSkin = 'fresh';
    try { savedSkin = localStorage.getItem('pf:skin') || 'fresh'; } catch (e) { /* 隐私模式 */ }
    Views.applySkin(savedSkin);

    var ver = document.getElementById('appVersion');
    if (ver) ver.textContent = Store.VERSION;

    /* 页脚两处文案：接了云端就说云端，单文件离线版说本机。
       同一份代码两种部署，不能写死一种说法。 */
    var cloud = !!(window.PFSync && window.PFSync.enabled && window.PFSync.enabled());
    var note = document.getElementById('storeNote');
    if (note) note.textContent = cloud ? '数据存于云端 · 换设备登录可同步' : '数据仅存于本机浏览器';
    var pn = document.getElementById('privacyNote');
    if (pn) pn.textContent = cloud
      ? '当前为参赛原型：数据存放在第三方托管数据库（Supabase），同一账号换设备能同步；页面中的投票人与票数为演示数据，不是真实用户。'
      : '当前为参赛原型：数据仅存本机浏览器；页面中的投票人与票数为演示数据，不是真实用户。';

    var seeded = false;
    try {
      seeded = Store.seed();
    } catch (e) {
      console.warn('[app] 演示数据写入失败，可能是浏览器禁用了本地存储', e);
    }

    window.addEventListener('hashchange', render);
    window.addEventListener('pf:messages', paintChrome);
    bindChrome();
    render();

    /* 页面从后台回到前台时补拉一次：别人刚结束的投票要立刻反映到列表与详情 */
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) return;
      if (!window.PFSync || !window.PFSync.refreshPolls) return;
      window.PFSync.refreshPolls(function (n) {
        if (!n) return;
        var route = parse(location.hash);
        /* 详情页只在「刚发现已经结束」时重绘，别因为一次后台刷新把阅读位置弹回顶部 */
        if (route.name === 'poll' && route.id) {
          var p = Store.getAnyPoll(route.id);
          if (p && p.archived) render();
          return;
        }
        render();
      });
    });

    if (seeded) D.toast('已载入演示数据，可以直接点开看看');

    /* 填了 Supabase 配置才同步；拉完重绘一次，让云端投票出现在列表里 */
    if (window.PFSync && window.PFSync.enabled()) {
      window.PFSync.boot(function (st) {
        if (st.status === 'on') {
          render();
          D.toast('已连上云端，拉到 ' + st.pulled + ' 场投票');
        }
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

})();

</script>
</body>
</html>
