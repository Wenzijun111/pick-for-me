          return r.text().then(function (t) {
            if (!t || !t.trim()) return null;
            try { return JSON.parse(t); } catch (e) { return null; }
          });
        });
  }

  function fail(e) {
    state.error = e && e.message ? e.message : String(e);
    state.status = 'error';
  }

  /* ---------- 投票 ---------- */

  /* 正在往云端写的投票：分享面板要据此提示"等一两秒再发" */
  var pendingPush = {};

  function pushPoll(poll) {
    if (!ON || locked) return;
    if (isDemo(poll) || !realPoll(poll)) return;
    pendingPush[poll.id] = true;
    var job = api('polls', {
      method: 'POST',
      prefer: 'resolution=merge-duplicates',
      body: {
        id: poll.id,
        /* payload 里的票也要一人一条，否则脏数据会被一次次推回云端 */
        payload: Object.assign({}, poll, { votes: dedupeVotes(poll.votes) }),
        author_id: whoami(poll.authorId),
        updated_at: new Date().toISOString()
      }
    }).then(function () {
      state.pushed += 1;
      delete pendingPush[poll.id];
    }).catch(function (e) {
      delete pendingPush[poll.id];
      fail(e);
    });
    return job;
  }

  /* 云端一行 = 一场投票里的一个人。
     以前拿 vote.id 当行 id，而每次改投都会生成新的 vote.id，
     于是同一个人在云端累积出两行，拉回来票数就翻倍。 */
  function voteRowId(pollId, voterId) {
    return 'v_' + String(pollId) + '_' + String(voterId);
  }

  function pushVote(pollId, vote) {
    if (!ON || locked || !pollId || !vote || !vote.voterId) return;
    /* 种子里的假投票人（u_me / u6 / u_bad / g_dead*）的票不上云，
       否则会出现「3 票」但点开看不到是谁投的假数据 */
    if (/^(u_me|u6|u_bad|g_dead\d+)$/.test(String(vote.voterId))) return;
    var rid = voteRowId(pollId, vote.voterId);
    var row = { id: rid, poll_id: pollId, voter_id: whoami(vote.voterId), payload: vote };
    /* votes 表对匿名只开了 SELECT / INSERT / DELETE，没有 UPDATE，
       所以 upsert 会 401。先删这一行再插，效果等于「改投覆盖」，
       而且行 id 按人固定，同一个人永远只占一行。 */
    return api('votes?id=eq.' + encodeURIComponent(rid), { method: 'DELETE', prefer: 'return=minimal' })
      .catch(function () { return null; })
      .then(function () {
        return api('votes', { method: 'POST', prefer: 'resolution=ignore-duplicates', body: row });
      })
      .then(function () {
        state.pushed += 1;
      })
      .catch(fail);
  }

  /* ---------- 通用表 ---------- */

  function pushRow(table, item) {
    if (!ON || locked || !item || !item.id || isDemo(item)) return;
    if (table === 'voters' && !realVoter(item.id)) return;
    api(table, {
      method: 'POST',
      prefer: 'resolution=merge-duplicates',
      body: {
        id: item.id, payload: item,
        author_id: whoami(item.authorId || item.ownerId || item.by || item.id),
        updated_at: new Date().toISOString()
      }
    }).then(function () {
      state.pushed += 1;
    }).catch(fail);
  }

  /* ---------- 结束态：把本地那份搬进归档 ---------- */

  /* 本地「进行中 → 已归档」只是一次集合搬家，不是删除。
     可 Store.remove 会触发 onWrite 的「消失了就是删掉了」，把云端那行真删掉；
     所以搬家这一段必须整体静音。 */
  function withLock(fn) {
    var was = locked;
    locked = true;
    try { return fn(); } finally { locked = was; }
  }

  /**
   * 云端说这场已经结束了：把本地那份从 polls 搬进 history。
   * 只改结束相关字段，票一律保留本地版本（可能还有一票没推上去）。
   * @returns {boolean} 本地状态是否真的发生了变化
   */
  function archiveLocal(remote) {
    var id = remote && remote.id;
    if (!id) return false;
    var local = Store.getAnyPoll(id);
    if (!local) return false;

    if (local.archived) {
      /* 已经归档了；顺手清掉 polls 里可能残留的旧副本，并补齐关闭时间 */
      var dirty = false;
      if (!local.closedAt && remote.closedAt) { local.closedAt = remote.closedAt; dirty = true; }
      if (!local.closedBy && remote.closedBy) { local.closedBy = remote.closedBy; dirty = true; }
      if (Store.get('polls', id)) dirty = true;
      if (dirty) {
        withLock(function () {
          if (Store.get('polls', id)) Store.remove('polls', id);
          Store.save('history', local);
        });
      }
      return false;
    }

    local.archived = true;
    local.closedAt = remote.closedAt || local.closedAt || new Date().toISOString();
    local.closedBy = remote.closedBy || local.closedBy;
    withLock(function () {
      Store.remove('polls', id);
      Store.save('history', local);
    });
    return true;
  }

  /** 一场投票的所有票都删掉：开新一轮时用，否则上一轮的票会被拉回来 */
  function clearVotes(pollId) {
    if (!ON || locked || !pollId) return Promise.resolve(0);
    return api('votes?poll_id=eq.' + encodeURIComponent(pollId), { method: 'DELETE', prefer: 'return=minimal' })
      .then(function () { return 1; })
      .catch(function () { return 0; });
  }

  function deleteRow(table, id) {
    if (!ON || locked || !id) return;
    api(table + '?id=eq.' + encodeURIComponent(id), { method: 'DELETE', prefer: 'return=minimal' })
      .catch(fail);
  }

  /* ---------- 写入钩子：一次覆盖所有 Store.save / write 路径 ---------- */

  function onWrite(collection, next, prev) {
    if (!ON || locked) return;
    var table = (collection === 'polls' || collection === 'history') ? 'polls' : collection;
    if (table === 'votes') return;                        /* votes 跟着 poll 走 */
    if (table !== 'polls' && TABLES.indexOf(table) < 0) return;

    var before = {};
    (prev || []).forEach(function (x) { if (x && x.id) before[x.id] = JSON.stringify(x); });

    var after = {};
    (next || []).forEach(function (item) {
      if (!item || !item.id) return;
      after[item.id] = true;
      if (before[item.id] === JSON.stringify(item)) return;   /* 没变就不推 */
      if (table === 'polls') {
        pushPoll(item);
        (item.votes || []).forEach(function (v) { pushVote(item.id, v); });
      } else {
        pushRow(table, item);
      }
    });

    /* 本轮消失的就是删掉了 */
    (prev || []).forEach(function (item) {
      if (item && item.id && !after[item.id]) deleteRow(table, item.id);
    });
  }

  /* ---------- 合并 ---------- */

  /** 同一投票人只留最新一票（按 at 比较）。
      既兜住历史脏数据（云端一人两行），也兜住本地被合并过的重复票。 */
  function dedupeVotes(list) {
    var out = [];
    var pos = {};
    (list || []).forEach(function (v) {
      if (!v) return;
      /* 一个人 + 一轮 = 一条；多轮投票的历史轮次各自保留 */
      var key = (v.voterId || v.id) + '#' + (v.round || 0);
      if (!key) { out.push(v); return; }
      if (pos[key] === undefined) { pos[key] = out.length; out.push(v); return; }
      var old = out[pos[key]];
      var a = Date.parse(old.at || '') || 0;
      var b = Date.parse(v.at || '') || 0;
      if (b >= a) out[pos[key]] = v;
    });
    return out;
  }

  /** 云端投票并进本地；本地独有的（离线时投的）补传上去 */
  function merge(rows, voteRows) {
    var byPoll = {};
    (voteRows || []).forEach(function (v) {
      if (!v || !v.poll_id || !v.payload) return;
      (byPoll[v.poll_id] || (byPoll[v.poll_id] = [])).push(v.payload);
    });

    var seen = {};
    var incoming = [];
    (rows || []).forEach(function (r) {
      var poll = r && r.payload;
      if (!poll || !poll.id) return;
      if (isDemo(poll) || !realPoll(poll)) return;
      var merged = (byPoll[poll.id] || []).slice();
      var local = Store.getAnyPoll(poll.id);
      if (local && local.votes) {
        local.votes.forEach(function (v) {
          for (var i = 0; i < merged.length; i++) { if (merged[i].id === v.id) return; }
          merged.push(v);
        });
      }
      poll.votes = dedupeVotes(merged);
      poll.remote = true;
      seen[poll.id] = true;
      incoming.push(poll);
    });

    locked = true;
    incoming.forEach(function (poll) {
      var existing = Store.getAnyPoll(poll.id);
      /* 结束是不可逆的：本地已经结束过，就不能被云端一条旧的「未结束」快照复活 */
      if (existing && existing.archived && !poll.archived) {
        poll.archived = true;
        poll.closedAt = existing.closedAt || poll.closedAt || new Date().toISOString();
      }
      /* 换集合时要把旧的那份删掉。只 save 不 remove 会留下两份，
         而 getAnyPoll 先读 polls，于是页面一直拿旧的「未结束」版本。 */
      if (poll.archived) {
        Store.remove('polls', poll.id);
        Store.save('history', poll);
      } else {
        Store.remove('history', poll.id);
        Store.save('polls', poll);
      }
    });
    locked = false;

    var all = Store.list('polls').concat(Store.list('history') || []);
    all.forEach(function (p) {
      if (!p || isDemo(p) || seen[p.id] || !realPoll(p)) return;
      pushPoll(p);
      (p.votes || []).forEach(function (v) { pushVote(p.id, v); });
    });

    return incoming.length;
  }

  function mergeTable(table, rows) {
    if (!rows || !rows.length) return 0;
    var got = 0;
    locked = true;
    rows.forEach(function (r) {
      var item = r && r.payload;
      if (!item || !item.id || isDemo(item)) return;
      if (table === 'voters' && !realVoter(item.id)) return;
      item.remote = true;
      Store.save(table, item);
      got += 1;
    });
    locked = false;
    return got;
  }

  /* 拉完之后，把本地有、云端没有的补传 */
  function pushLocalMissing(table) {
    var remote = {};
    return api(table + '?select=id&limit=' + LIMIT).then(function (rows) {
      (rows || []).forEach(function (r) { if (r && r.id) remote[r.id] = true; });
      Store.list(table).forEach(function (item) {
        if (!item || !item.id || isDemo(item)) return;
        if (table === 'voters' && !realVoter(item.id)) return;
        if (remote[item.id]) return;
        pushRow(table, item);
      });
    });
  }

  /* ---------- 启动 ---------- */

  function boot(done) {
    done = done || function () {};
    if (!ON) { state.status = 'off'; done(state); return; }
    state.status = 'syncing';
    state.pulled = 0;
    state.missing = [];

    /* 投票与票并行拉。原来 8 张表串成一条链，第一次打开要等十几秒，
       别人发来的链接在这期间会先看到 404。 */
    var main = Promise.all([
      api('polls?select=id,payload&limit=' + LIMIT).catch(function () { return []; }),
      api('votes?select=id,poll_id,payload&limit=2000').catch(function () { return []; })
    ]).then(function (pair) {
      state.pulled += merge(pair[0], pair[1]);
    });

    var tables = Promise.all(TABLES.map(function (t) {
      return api(t + '?select=id,payload&limit=' + LIMIT)
        .then(function (r) { state.pulled += mergeTable(t, r); })
        .catch(function (e) {
          /* 某张表没建或没权限只记下来，不影响别的表 */
          state.missing.push(t);
          if (!state.lastTableError) state.lastTableError = e && e.message ? e.message : String(e);
        });
    }));

    Promise.all([main, tables])
      .then(function () {
        /* 补传本地有、云端没有的；并行，单表失败无所谓 */
        return Promise.all(TABLES.map(function (t) {
          return pushLocalMissing(t).catch(function () {});
        }));
      })
      .catch(function () {})
      .then(function () {
        state.status = 'on';
        state.syncedAt = Date.now();
        state.error = state.missing.length ? ('部分表未就绪: ' + state.missing.join(', ')) : '';
        done(state);
      });
  }

  /* 兼容旧调用点 */
  function onSave(coll, item) {
    if (!ON || locked) return;
    if (coll === 'polls' || coll === 'history') {
      pushPoll(item);
      (item.votes || []).forEach(function (v) { pushVote(item.id, v); });
      return;
    }
    if (TABLES.indexOf(coll) >= 0) pushRow(coll, item);
  }

  root.PFSync = {
    enabled: function () { return ON; },
    status: function () { return state; },
    boot: boot,
    pending: function (id) { return !!pendingPush[id]; },
    onSave: onSave,
    onWrite: onWrite,
    clearVotes: clearVotes,
    tables: TABLES.slice(),

    /* 把云端取回的投票放进本地该待的集合。
       本地没有、需要新建一份时也走它，避免 Store.remove 把云端那行当成「删除」。
       已结束的直接进 history，未结束的进 polls。 */
    adopt: function (poll) {
      if (!poll || !poll.id) return false;
      var local = Store.getAnyPoll(poll.id);
      if (local) return archiveLocal(poll);
      withLock(function () {
        Store.remove('polls', poll.id);
        Store.remove('history', poll.id);
        Store.save(poll.archived ? 'history' : 'polls', poll);
      });
      return true;
    },

    /* 本地没有这条投票时，去云端取一次；取不到就回 null */
    fetchPoll: function (pollId, done) {
      done = done || function () {};
      if (!ON || !pollId) { done(null); return; }
      var q = 'polls?select=id,payload&id=eq.' + encodeURIComponent(pollId);
      api(q).then(function (rows) {
        var poll = rows && rows[0] && rows[0].payload;
        if (!poll) { done(null); return; }
        var vq = 'votes?select=id,poll_id,payload&poll_id=eq.' + encodeURIComponent(pollId);
        return api(vq).then(function (vs) {
          var list = [];
          (vs || []).forEach(function (v) { if (v && v.payload) list.push(v.payload); });
          poll.votes = dedupeVotes(list);
          poll.remote = true;
          done(poll);
        });
      }).catch(function () { done(null); });
    },

    /* 详情页轮询：只关心「这场投票是不是被发起者结束了」。
       进入时先查一次，之后每 5 秒一次；标签页重新可见时也补查一次。
       只同步结束态，不覆盖本地票，避免把还没推上去的一票冲掉。 */
    watchPoll: function (pollId, onChange, ms) {
      if (!ON || !pollId) return function () {};
      var every = Math.max(3000, ms || 5000);
      var stopped = false;

      function tick() {
        if (stopped || document.hidden) return;
        /* 注意：这里不因 pendingPush 跳过。
           pendingPush 只说明本方还有一次投票在写，而 archiveLocal 只碰
           archived / closedAt，不会覆盖票；卡住不查反而会让页面永远停在「进行中」。 */
        api('polls?select=id,payload&id=eq.' + encodeURIComponent(pollId))
          .then(function (rows) {
            var remote = rows && rows[0] && rows[0].payload;
            if (!remote || !remote.archived) return;
            if (archiveLocal(remote) && onChange) onChange('ended');
          })
          .catch(function () {});
      }

      function onVisible() { if (!document.hidden) tick(); }

      document.addEventListener('visibilitychange', onVisible);
      window.addEventListener('focus', onVisible);
      tick();                                  /* 进页面先查，不等第一个间隔 */
      var timer = setInterval(tick, every);

      return function () {
        stopped = true;
        clearInterval(timer);
        document.removeEventListener('visibilitychange', onVisible);
        window.removeEventListener('focus', onVisible);
      };
    },

    /* 手动刷新单场（详情页用） */
    refresh: function (pollId, done) {
      if (!ON) { done && done(null); return; }
      api('votes?select=id,poll_id,payload&poll_id=eq.' + encodeURIComponent(pollId))
        .then(function (rows) { done && done(rows || []); })
        .catch(function () { done && done(null); });
    },

    /* 重新拉一次投票与票（页面从后台回来时用）。
       首页列表和详情页都会因为「别人已经结束了」而变化，
       不能只在首次打开时 boot 一次。 */
    refreshPolls: function (done) {
      done = done || function () {};
      if (!ON) { done(0); return; }
      Promise.all([
        api('polls?select=id,payload&limit=' + LIMIT).catch(function () { return []; }),
        api('votes?select=id,poll_id,payload&limit=2000').catch(function () { return []; })
      ]).then(function (pair) {
        done(merge(pair[0], pair[1]));
      }).catch(function () { done(0); });
    },

    /* 按集合名手动刷新一次（列表页用） */
    pullTable: function (table, done) {
      done = done || function () {};
      if (!ON || TABLES.indexOf(table) < 0) { done(0); return; }
      api(table + '?select=id,payload&limit=' + LIMIT)
        .then(function (r) { done(mergeTable(table, r)); })
        .catch(function () { done(0); });
    }
  };
})(window);

</script>
<script>
/* assets/js/auth.js */
/* ============================================================
   账号层（Supabase Auth）
   ------------------------------------------------------------
   邮箱 + 密码，注册和登录都由 Supabase 处理，这里只负责调用与保存会话。
   配置为空时整个模块不启用，页面继续用原有的本机演示登录。

   会话存在 localStorage 的 pf:session 里，刷新后仍然有效。
   ============================================================ */
(function (root) {
  'use strict';

  var cfg = root.PF_CONFIG || {};
  var BASE = String(cfg.supabaseUrl || '').replace(/\/+$/, '');
  var KEY = String(cfg.supabaseAnonKey || '');
  var ON = !!(BASE && KEY);
  var SKEY = 'pf:session';

  function session() {
    try { return JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch (e) { return null; }
  }
  function put(s) {
    try {
      if (s) localStorage.setItem(SKEY, JSON.stringify(s));
      else localStorage.removeItem(SKEY);
    } catch (e) { /* 隐私模式 */ }
  }

  function call(path, opt) {
    opt = opt || {};
    var h = { apikey: KEY, 'Content-Type': 'application/json' };
    if (opt.token) h.Authorization = 'Bearer ' + opt.token;
    var init = { method: opt.method || 'POST', headers: h, cache: 'no-store' };
    if (opt.body) init.body = JSON.stringify(opt.body);
    return fetch(BASE + '/auth/v1/' + path, init).then(function (r) {
      return r.text().then(function (t) {
        var d = null;
        try { d = t ? JSON.parse(t) : null; } catch (e) { d = null; }
        if (!r.ok) {
          var msg = (d && (d.msg || d.error_description || d.error || d.message)) || ('HTTP ' + r.status);
          var err = new Error(msg);
          err.status = r.status;
          throw err;
        }
        return d;
      });
    });
  }

  /* Supabase 的 signup / token 返回结构有两种形状，统一取出来 */
  function pick(d) {
    if (!d) return null;
    if (d.access_token && d.user) return d;
    if (d.session && d.session.access_token && d.session.user) return d.session;
    return null;
  }

  function adopt(d) {
    var s = pick(d);
    if (!s) return null;
    put({ token: s.access_token, refresh: s.refresh_token || '', user: s.user, at: Date.now() });
    return s.user;
  }

  root.PFAuth = {
    enabled: function () { return ON; },
    user: function () { var s = session(); return s ? s.user : null; },
    token: function () { var s = session(); return s ? s.token : null; },

    /* 注册。没开邮箱确认时直接返回会话；开了则返回 null（要先去收邮件） */
    signUp: function (email, password) {
      if (!ON) return Promise.reject(new Error('未配置云端账号'));
      return call('signup', { body: { email: email, password: password } }).then(function (d) {
        var u = adopt(d);
        return u || null;
      });
    },

    signIn: function (email, password) {
      if (!ON) return Promise.reject(new Error('未配置云端账号'));
      return call('token?grant_type=password', { body: { email: email, password: password } })
        .then(function (d) {
          var u = adopt(d);
          if (!u) throw new Error('登录没有返回会话');
          return u;
        });
    },

    signOut: function () {
      var s = session();
      put(null);
      if (ON && s && s.token) {
        call('logout', { token: s.token }).catch(function () { /* 本地已清，忽略 */ });
      }
    }
  };
})(window);

</script>
<script>
/* assets/js/dom.js */
/* ============================================================
   dom.js — 极简 DOM 工具
   无依赖、无构建。只做三件事：取元素、拼 HTML、弹提示。
   ============================================================ */

(function (global) {
  'use strict';

  function $(sel, root) {
    return (root || document).querySelector(sel);
  }

  function $$(sel, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(sel));
  }

  /** HTML 转义，所有用户输入进模板前必须过一遍 */
  function esc(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /** 数字价格 → ¥1,499；空值显示 — */
  function price(n) {
    if (n == null || n === '' || isNaN(Number(n))) return '—';
    return '¥' + Number(n).toLocaleString('zh-CN');
  }

  /** ISO 时间 → 11-09 14:20 */
  function time(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    var p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return (d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
      p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /** 相对时间：3 天前 */
  function ago(iso) {
    if (!iso) return '';
    var diff = Date.now() - new Date(iso).getTime();
    if (isNaN(diff)) return '';
    var m = Math.floor(diff / 60000);
    if (m < 1) return '刚刚';
    if (m < 60) return m + ' 分钟前';
    var h = Math.floor(m / 60);
    if (h < 24) return h + ' 小时前';
    var d = Math.floor(h / 24);
    if (d < 30) return d + ' 天前';
    return time(iso);
  }

  /** 全局提示 */
  function toast(msg) {
    var host = $('.toast-host');
    if (!host) {
      host = document.createElement('div');
      host.className = 'toast-host';
      document.body.appendChild(host);
    }
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    host.appendChild(t);
    setTimeout(function () {
      t.style.transition = 'opacity .25s';
      t.style.opacity = '0';
      setTimeout(function () { t.remove(); }, 260);
    }, 2200);
  }

  /** 事件委托：在 root 上代理，匹配 selector 才触发 */
  function on(root, type, selector, handler) {
    root.addEventListener(type, function (e) {
      var node = e.target.closest(selector);
      if (node && root.contains(node)) handler.call(node, e, node);
    });
  }

  global.D = {
    $: $,
    $$: $$,
    esc: esc,
    price: price,
    time: time,
    ago: ago,
    toast: toast,
    on: on
  };

})(window);

</script>
<script>
/* assets/js/credit.js */
/* ============================================================
   credit.js — 投票信用：统计、专家票型面板、信用主页
   ============================================================
   设计依据：docs/11-设计契约与投票信用机制.md

   三条硬规则（改动前先读）：
     1. 权重只影响「专家票型」里的占比展示，**不影响总票数**
        —— 一人一票不变，任何人都不会被减权
     2. 他人视角只看到分档徽章，看不到明细流水
        —— 明细只有本人能看（信用主页）
     3. 黑名单不对外贴标签，只在发起者的分组统计里体现为「已过滤」
   ============================================================ */

(function (global) {
  'use strict';

  var esc = D.esc;
  var Store = global.Store;

  var TIER_ORDER = ['high', 'mid', 'normal'];

  function tierLabel(k) {
    var t = Store.TIERS[k];
    return t ? t.label : '普通';
  }

  function fmtPct(part, whole) {
    if (!whole) return '0%';
    return Math.round(part / whole * 100) + '%';
  }

  /* ---------- 我的身份 ---------- */

  function meId() {
    return Store.meId ? Store.meId() : '';
  }

  /* ---------- 分组统计 ---------- */

  /**
   * @returns {{
   *   groups: Array, filtered: {count:number},
   *   tags: Array, totalVotes:number, hasCredit:boolean
   * }}
   */
  function analyze(poll) {
    var credits = Store.credits();
    var votes = (poll.votes || []).filter(function (v) { return v.voterId; });

    var buckets = {};
    TIER_ORDER.forEach(function (k) {
      buckets[k] = { key: k, count: 0, weight: 0, byOpt: {} };
    });

    var tagCount = {};
    var filtered = 0;
    var unknown = 0;

    votes.forEach(function (v) {
      var c = credits[v.voterId];

      /* 找不到档案时按「普通、权重 1.0」处理，绝不给用户凭空扣分 */
      if (!c) {
        unknown++;
        c = { tier: 'normal', weight: 1, blacklisted: false };
      }

      if (c.blacklisted) { filtered++; return; }

      var b = buckets[c.tier] || buckets.normal;
      b.count++;
      b.weight += c.weight;

      (v.choice || []).forEach(function (oid) {
        if (!b.byOpt[oid]) b.byOpt[oid] = { n: 0, w: 0 };
        b.byOpt[oid].n++;
        b.byOpt[oid].w += c.weight;
      });

      (v.tags || []).forEach(function (t) {
        tagCount[t] = (tagCount[t] || 0) + 1;
      });
    });

    var groups = TIER_ORDER.map(function (k) {
      var b = buckets[k];
      var rows = (poll.options || []).map(function (o) {
        var cell = b.byOpt[o.id] || { n: 0, w: 0 };
        return {
          option: o,
          n: cell.n,
          weight: Math.round(cell.w * 10) / 10,
          pct: fmtPct(cell.w, b.weight)
        };
      }).filter(function (r) { return r.n > 0; })
        .sort(function (x, y) { return y.weight - x.weight; });

      return { key: k, label: tierLabel(k), count: b.count, weight: Math.round(b.weight * 10) / 10, rows: rows };
    }).filter(function (g) { return g.count > 0; });

    var tags = Object.keys(tagCount).map(function (k) {
      return { key: k, label: Store.TAGS[k] || k, n: tagCount[k] };
    }).sort(function (a, b) { return b.n - a.n; });

    return {
      groups: groups,
      filtered: filtered,
      tags: tags,
      totalVotes: votes.length,
      unknown: unknown
    };
  }

  /* ---------- 分歧提示 ---------- */

  function divergence(poll, data) {
    if (!data.groups.length) return '';

    // 高可信组的首选
    var high = null;
    for (var i = 0; i < data.groups.length; i++) {
      if (data.groups[i].key === 'high' && data.groups[i].rows.length) {
        high = data.groups[i]; break;
      }
    }
    if (!high) return '';

    // 全体（含所有分组）的票数首选
    var all = {};
    data.groups.forEach(function (g) {
      g.rows.forEach(function (r) {
        all[r.option.id] = (all[r.option.id] || 0) + r.n;
      });
    });
    var best = null, bestN = -1;
    Object.keys(all).forEach(function (k) {
      if (all[k] > bestN) { bestN = all[k]; best = k; }
    });

    var highTop = high.rows[0];
    if (!highTop || !best) return '';
    if (highTop.option.id === best) {
      return '高可信组与整体判断一致，都更倾向「' + highTop.option.name + '」。';
    }
    return '注意分歧：高可信组更倾向「' + highTop.option.name + '」，' +
      '而全体票数最高的是另一个选项。值得回头看看两边的理由。';
  }

  /* ---------- 分歧洞察（独立面板，答辩主亮点） ----------
     不只回答"谁第一"，还回答"大众和高可信群体是不是看到两个方向"。
     三件事必须守住：
       1. 只给分组分布，不给身份（沿用 D11）
       2. 争议指数只描述票型结构，不判断谁对
       3. 高可信样本少于 3 人时，明确标注"仅供参考" */

  function rowsByCount(group) {
    if (!group) return [];
    return group.rows.slice().sort(function (a, b) {
      return (b.n - a.n) || (b.weight - a.weight);
    });
  }

  function insightData(poll) {
    if (!poll || !poll.votes || !poll.votes.length) return null;

    var t = Store.tally(poll);
    if (!t.total) return null;

    var data = analyze(poll);
    var byKey = {};
    data.groups.forEach(function (g) { byKey[g.key] = g; });

    var allRows = t.rows.map(function (r) {
      return {
        option: r.option,
        n: r.score,
        pct: t.total ? Math.round(r.score / t.total * 100) : 0
      };
    });

    var highRows = rowsByCount(byKey.high);
    var midRows = rowsByCount(byKey.mid);
    var normalRows = rowsByCount(byKey.normal);
    var highCount = byKey.high ? byKey.high.count : 0;

    var out = {
      total: t.total,
      allRows: allRows,
      overallTop: (t.tie ? null : (allRows[0] || null)),
      highRows: highRows,
      highCount: highCount,
      midRows: midRows,
      midCount: byKey.mid ? byKey.mid.count : 0,
      normalRows: normalRows,
      normalCount: byKey.normal ? byKey.normal.count : 0,
      filtered: data.filtered,
      thin: highCount > 0 && highCount < 3,
      score: 0,
      verdict: 'pending'
    };

    if (t.tie) { out.verdict = 'tie'; return out; }
    if (!highRows.length) { out.verdict = 'no-high'; return out; }

    /* 高可信首选与全体首选一致 → 没有分歧 */
    if (highRows[0].option.id === out.overallTop.option.id) {
      out.verdict = 'aligned';
      return out;
    }

    /* 争议指数：Base 45（两边首选不同）
       + 高可信组首选在本组的集中度（0—25）
       + 全体首选在全体票中的占比（0—20）
       + 全体领先第二名的票差（每票 2 分，最多 10） */
    var highVotes = highRows.reduce(function (s, r) { return s + r.n; }, 0);
    var highShare = highVotes ? highRows[0].n / highVotes : 0;
    var second = allRows[1] ? allRows[1].n : 0;
    var margin = Math.max(0, out.overallTop.n - second);
    var idx = 45 +
      Math.round(highShare * 25) +
      Math.round((out.overallTop.pct / 100) * 20) +
      Math.min(10, margin * 2);

    out.score = Math.max(45, Math.min(100, idx));
    out.verdict = out.score >= 75 ? 'split' : 'divided';
    return out;
  }

  var VERDICT = {
    split:    { cls: 'split',    label: '分歧明显' },
    divided:  { cls: 'divided',  label: '存在分歧' },
    aligned:  { cls: 'aligned',  label: '判断一致' },
    'no-high': { cls: 'pending', label: '暂无高可信样本' },
    tie:      { cls: 'pending',  label: '平票待定' },
    pending:  { cls: 'pending',  label: '统计中' }
  };

  function insightLead(d) {
    var over = d.overallTop ? d.overallTop.option.name : '';
    var high = d.highRows.length ? d.highRows[0].option.name : '';

    if (d.verdict === 'tie') {
      return '全体票数打平，暂时没有可对比的首选。等有人补票后，这里会重新判断。';
    }
    if (d.verdict === 'no-high') {
      return '还没有高可信投票人参与，暂时无法对比「大众 vs 高可信」。' +
        '等有信用记录的人投票后，这里会自动出现两边票型。';
    }
    if (d.verdict === 'aligned') {
      return '大众与高可信群体判断一致，都更倾向「' + over + '」。这个选择争议不大。';
    }
    if (d.verdict === 'split') {
      return '大众更倾向「' + over + '」，高可信群体更倾向「' + high + '」，' +
        '而且两边都相当集中 —— 这个选择争议很大。';
    }
    return '大众更倾向「' + over + '」，高可信群体更倾向「' + high + '」。' +
      '两边判断不同，值得回头看看各自的理由。';
  }

  /** 一组票型的迷你条形图。max 用组内最高，pct 用给定分母 */
  function miniBars(rows, totalVotes) {
    if (!rows.length) return '';
    var max = rows[0].n || 0;

    return rows.map(function (r, i) {
      var w = max ? Math.round(r.n / max * 100) : 0;
      var pct = totalVotes ? Math.round(r.n / totalVotes * 100) : r.pct;
      return '' +
        '<div class="insight-row' + (i === 0 ? ' is-top' : '') + '">' +
          '<span class="insight-opt">' + esc(r.option.name) + '</span>' +
          '<span class="insight-meter"><i style="width:' + w + '%"></i></span>' +
          '<span class="insight-num">' + esc(r.n) + ' 票 · ' + pct + '%</span>' +
        '</div>';
    }).join('');
  }

  function insightHtml(poll) {
    var d = insightData(poll);
    if (!d) return '';

    var v = VERDICT[d.verdict] || VERDICT.pending;
    var badgeText = v.label + (d.score ? ' · ' + d.score : '');

    var allCol = '' +
      '<div class="insight-col">' +
        '<div class="insight-col-head">' +
          '<span>全体票型</span>' +
          '<span class="insight-count">' + esc(d.total) + ' 票</span>' +
        '</div>' +
        (miniBars(d.allRows, d.total) ||
          '<div class="insight-empty">还没有票</div>') +
      '</div>';

    var highCol = '' +
      '<div class="insight-col">' +
        '<div class="insight-col-head">' +
          '<span>高可信群体</span>' +
          '<span class="insight-count">' +
            (d.highCount ? esc(d.highCount) + ' 人' : '暂无') +
          '</span>' +
        '</div>' +
        (d.highRows.length
          ? miniBars(d.highRows, d.highRows.reduce(function (s, r) { return s + r.n; }, 0))
          : '<div class="insight-empty">还没有高可信投票人</div>') +
      '</div>';

    var extraRows = '';
    if (d.midRows.length) {
      extraRows += '' +
        '<div class="insight-extra-group">' +
          '<div class="insight-extra-head">中等可信 ' + esc(d.midCount) + ' 人</div>' +
          miniBars(d.midRows, d.midRows.reduce(function (s, r) { return s + r.n; }, 0)) +
        '</div>';
    }
    if (d.normalRows.length) {
      extraRows += '' +
        '<div class="insight-extra-group">' +
          '<div class="insight-extra-head">普通 ' + esc(d.normalCount) + ' 人</div>' +
          miniBars(d.normalRows, d.normalRows.reduce(function (s, r) { return s + r.n; }, 0)) +
        '</div>';
    }
    if (d.filtered > 0) {
      extraRows += '<div class="insight-filtered">另有 ' + esc(d.filtered) +
        ' 票未纳入分组（该账号票型暂未纳入信用统计），仍计入总票。</div>';
    }

    return '' +
      '<div class="insight" data-insight-box>' +
        '<div class="insight-head">' +
          '<span class="insight-title">分歧洞察</span>' +
          '<span class="insight-badge ' + v.cls + '">' + esc(badgeText) + '</span>' +
        '</div>' +
        '<p class="insight-lead">' + esc(insightLead(d)) + '</p>' +

        '<div class="insight-cols">' + allCol + highCol + '</div>' +

        (d.thin
          ? '<p class="insight-thin">高可信只有 ' + esc(d.highCount) +
            ' 人，样本太少，这里只作参考，不当作结论。</p>'
          : '') +

        (extraRows
          ? '<div class="insight-extra">' +
              '<button type="button" class="insight-toggle" data-insight-toggle aria-expanded="false">' +
                '看中等可信与普通组的票型' +
              '</button>' +
              '<div class="insight-extra-body" hidden>' + extraRows + '</div>' +
            '</div>'
          : '') +

        '<p class="insight-note">' +
          '分组只按投票信用切分，不显示谁投了什么。争议指数只看票型结构，不判断谁对。' +
        '</p>' +
      '</div>';
  }



  function badgeHtml(voterId, withName) {
    var c = Store.creditOf(voterId);
    if (!c) return '';

    var self = voterId === Store.meId();
    /* 隐私开关真正生效：本人关掉之后，别人侧不展示徽章，只留名字 */
    if (c.hideBadge && !self) {
      return withName
        ? '<span class="voter-name">' + esc(c.name) + '<span class="voter-hidden">信用未公开</span></span>'
        : '<span class="voter-hidden">信用未公开</span>';
    }
    if (c.tier === 'normal') {
      return withName ? '<span class="voter-name">' + esc(c.name) + '</span>' : '';
    }
    if (c.blacklisted) return '';   // 黑名单不对外显示

    return '<span class="voter-badge ' + c.tier + '">' +
      (withName ? esc(c.name) + ' · ' : '') +
      tierLabel(c.tier) + '</span>';
  }

  /* ---------- 专家票型面板 ---------- */

  function panelHtml(poll) {
    if (!poll || !poll.votes || poll.votes.length === 0) return '';

    var data = analyze(poll);
    if (!data.totalVotes) return '';

    var summary = data.groups.map(function (g) {
      return g.label + ' ' + g.count;
    }).join(' · ');

    var body = '';

    if (!data.groups.length) {
      body = '<div class="expert-empty">' +
        '暂时还没有带信用记录的投票人。参与的人多起来之后，这里会按「高可信 / 中等可信 / 普通」分组显示。' +
        '</div>';
    } else {
      body += '<div class="expert-note">' +
        '按信用分组统计，<b>只影响这里的显示，不改变上面的票数和结果</b>。' +
        '每组内按权重折算占比，所以不等于原始票数。' +
        '</div>';

      body += data.groups.map(function (g) {
        var rows = g.rows.map(function (r) {
          return '' +
            '<div class="expert-row">' +
              '<span class="expert-opt">' + esc(r.option.name) + '</span>' +
              '<span class="expert-meter"><i style="width:' + r.pct + '"></i></span>' +
              '<span class="expert-num">' + esc(r.n) + ' 票 · ' + r.pct + '</span>' +
            '</div>';
        }).join('');

        return '' +
          '<div class="expert-group">' +
            '<div class="expert-group-head">' +
              '<span class="voter-badge ' + g.key + '">' + g.label + '</span>' +
              '<span class="expert-group-count">' + g.count + ' 人</span>' +
            '</div>' +
            rows +
          '</div>';
      }).join('');
    }

    if (data.filtered > 0) {
      body += '<div class="expert-filtered">' +
        '另有 <b>' + data.filtered + '</b> 票未计入上面的分组' +
        '（该账号票型暂未纳入信用统计）。这些票<b>仍然计入总票数</b>。' +
        '</div>';
    }

    if (data.tags.length) {
      body += '<div class="expert-tags">' +
        '<div class="expert-tags-label">投票动机（只统计标签，不关联到人）</div>' +
        '<div class="expert-tags-list">' +
          data.tags.map(function (t) {
            return '<span class="tag">' + esc(t.label) + ' ' + t.n + '</span>';
          }).join('') +
        '</div>' +
      '</div>';
    }

    var hint = divergence(poll, data);
    if (hint) {
      body += '<div class="expert-hint">' + esc(hint) + '</div>';
    }

    return '' +
      '<div class="expert" data-expert-box>' +
        '<button type="button" class="expert-head" data-expert-toggle aria-expanded="false">' +
          '<span class="expert-title">专家票型</span>' +
          '<span class="expert-summary">' + esc(summary || '暂无分组') + '</span>' +
          '<span class="expert-caret">展开</span>' +
        '</button>' +
        '<div class="expert-body" hidden>' + body + '</div>' +
      '</div>';
  }

  /* ---------- 投票动机标签（投票后可选） ---------- */

  function tagPickerHtml(poll) {
    var mine = Store.myVoteIn(poll);
    if (!mine) return '';

    var picked = mine.tags || [];
    var chips = Object.keys(Store.TAGS).map(function (k) {
      var on = picked.indexOf(k) >= 0;
      return '<button type="button" class="tag-chip' + (on ? ' is-on' : '') + '" ' +
        'data-tag="' + k + '" data-tag-poll="' + esc(poll.id) + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
        esc(Store.TAGS[k]) + '</button>';
    }).join('');

    return '' +
      '<div class="tag-picker">' +
        '<div class="tag-picker-label">你为什么这么投？<span>（可选，只用于统计倾向，不会显示是谁）</span></div>' +
        '<div class="tag-picker-list">' + chips + '</div>' +
      '</div>';
  }

  /* ---------- 信用主页（本人视角） ---------- */

  function myHistory() {
    var me = meId();
    var polls = Store.list('polls').concat(Store.list('history'));
    var credits = Store.credits();
    var rows = [];

    polls.forEach(function (p) {
      var mine = null;
      (p.votes || []).forEach(function (v) {
        if (v.voterId === me) mine = v;
      });
      if (!mine) return;

      // 剔除自己后算共识
      var rest = (p.votes || []).filter(function (v) { return v.id !== mine.id; });
      var t = Store.tally({
        options: p.options,
        type: p.type,
        votes: rest
      });

      var consensus = t.tie ? null : (t.winners[0] ? t.winners[0].option : null);
      var myChoiceIds = mine.choice || [];
      var hit = consensus ? myChoiceIds.indexOf(consensus.id) >= 0 : null;

      var myNames = myChoiceIds.map(function (oid) {
        var o = (p.options || []).filter(function (x) { return x.id === oid; })[0];
        return o ? o.name : oid;
      }).join('、');

      rows.push({
        poll: p,
        myNames: myNames,
        consensus: consensus ? consensus.name : '平票（不计入）',
        hit: hit,
        tie: t.tie,
        tags: mine.tags || []
      });
    });

    return rows.sort(function (a, b) {
      return String(b.poll.createdAt).localeCompare(String(a.poll.createdAt));
    });
  }

  function pageHtml() {
    var me = meId();

    if (!me) {
      return '' +
        '<div class="section-head">' +
          '<h2>我的投票信用</h2>' +
          '<span class="hint">只有你能看到这一页</span>' +
          '<span class="spacer"></span>' +
          '<a class="btn btn-line btn-sm" href="#/me">返回我的</a>' +
        '</div>' +
        '<div class="card empty">' +
          '<div class="empty-title">先登录，才有信用可看</div>' +
          '<p>信用分绑在账号上：没有账号，就没有可统计的投票记录，也进不了分层门槛。</p>' +
          '<a class="btn btn-primary" href="#/login">去登录</a>' +
        '</div>';
    }

    var c = Store.creditOf(me);
    var credit = c || { name: '我', n: 0, hit: 0, skipped: 0, score: 0.5, tier: 'normal', weight: 1, blacklisted: false };
    var voter = Store.voter(me) || {};

    var scorePct = Math.round(credit.score * 100);
    var tier = credit.tier;
    var hasSample = credit.n >= Store.THRESHOLD.MIN_SAMPLE;

    var head = '' +
      '<div class="section-head">' +
        '<h2>我的投票信用</h2>' +
        '<span class="hint">只有你能看到这一页</span>' +
        '<span class="spacer"></span>' +
        '<a class="btn btn-line btn-sm" href="#/me">返回我的</a>' +
      '</div>';

    var card = '' +
      '<div class="card credit-card">' +
        '<div class="credit-top">' +
          '<div>' +
            '<div class="credit-score">' +
              (hasSample ? esc(credit.score.toFixed(2)) : '—') +
              '<span class="credit-unit">分</span>' +
            '</div>' +
            '<div class="credit-tier">' +
              (credit.blacklisted
                ? '<span class="voter-badge normal">暂未纳入统计</span>'
                : '<span class="voter-badge ' + tier + '">' + tierLabel(tier) + '</span>') +
              (hasSample ? '' : ' <span class="hint">样本不足 5 次，暂不评档</span>') +
            '</div>' +
          '</div>' +
          '<div class="credit-stats">' +
            '<div><b>' + credit.n + '</b><span>计入统计</span></div>' +
            '<div><b>' + credit.hit + '</b><span>与共识一致</span></div>' +
            '<div><b>' + credit.skipped + '</b><span>平票跳过</span></div>' +
          '</div>' +
        '</div>' +

        '<div class="credit-meter"><i style="width:' + scorePct + '%"></i></div>' +
        '<div class="credit-scale">' +
          '<span style="left:50%;top:0;transform:translateX(-50%)">0.50 中位</span>' +
          '<span style="left:65%;top:13px">0.65 高可信线</span>' +
        '</div>' +

        '<p class="credit-explain">' +
          '分数 = (命中次数 + 5×0.5) / (参与次数 + 5)。' +
          '算的是「你和除你之外其他人的共识有多接近」，所以不是从众度——' +
          '你自己的票先从结果里剔除了，不会自己给自己加分。' +
          '新人默认 0.50，参与 20 次后基本等于真实命中率。' +
        '</p>' +
      '</div>';

    var rows = myHistory();

    var list = rows.length ? rows.map(function (r) {
      var mark;
      if (r.tie) mark = '<span class="tag">平票 · 不计入</span>';
      else if (r.hit) mark = '<span class="tag ok">与共识一致</span>';
      else mark = '<span class="tag warn">偏离共识</span>';

      var tagTxt = r.tags.length
        ? r.tags.map(function (t) { return Store.TAGS[t] || t; }).join(' · ')
        : '';

      return '' +
        '<div class="card credit-row">' +
          '<div class="credit-row-main">' +
            '<div class="credit-row-title">' +
              (r.poll.archived ? '<span class="tag">已结束</span> ' : '') +
              esc(r.poll.title) +
            '</div>' +
            '<div class="credit-row-detail">' +
              '你的选择：<b>' + esc(r.myNames) + '</b>　·　其余人的共识：<b>' + esc(r.consensus) + '</b>' +
              (tagTxt ? '　·　动机：' + esc(tagTxt) : '') +
            '</div>' +
          '</div>' +
          '<div class="credit-row-mark">' + mark + '</div>' +
        '</div>';
    }).join('') : '' +
      '<div class="empty">' +
        '<div class="empty-title">还没有可复盘的记录</div>' +
        '<p>去首页投一次票，或者把链接发给别人。等有投票结束后，这里会列出你的每次判断。</p>' +
      '</div>';

    var disturb = voter.behavior
      ? '<div class="card">' +
          '<div class="notice warn"><div>' + esc(voter.behavior.note || '检测到异常行为，票型暂未纳入统计。') + '</div></div>' +
        '</div>'
      : '<div class="card">' +
          '<p style="margin:0;font-size:13.5px;color:var(--ink-2)">' +
            '没有异常行为记录。' +
            '这一栏只在出现「短时间内大量投票」「连续投同一序号」这类机器化行为时才会有内容，' +
            '不会因为你和别人意见不同就扣分。' +
          '</p>' +
        '</div>';

    return '' +
      head +
      card +
      '<div class="notice" style="margin-top:14px"><div>' +
        '别人看到的只是「高可信 / 中等可信 / 普通」徽章，看不到这一页的任何明细。' +
        '反之亦然——你看不到别人的流水。' +
      '</div></div>' +

      '<section class="section">' +
        '<div class="section-head"><h2>我的判断记录</h2>' +
          '<span class="hint">' + rows.length + ' 条</span></div>' +
        '<div class="credit-list">' + list + '</div>' +
      '</section>' +

      '<section class="section">' +
        '<div class="section-head"><h2>扰动记录</h2>' +
          '<span class="hint">只罚行为，不罚观点</span></div>' +
        disturb +
      '</section>' +

      '<div class="doc-actions">' +
        '<a class="btn btn-line" href="#/rules">信用规则说明</a>' +
        '<a class="btn btn-line" href="#/about">平台说明与免责</a>' +
        '<a class="btn btn-line" href="#/">回去投票</a>' +
      '</div>';
  }

  /* ---------- 事件绑定 ---------- */

  function bind(root, rerender) {
    /* 展开 / 收起专家票型 */
    D.on(root, 'click', '[data-expert-toggle]', function (e, btn) {
      var body = btn.parentNode.querySelector('.expert-body');
      var caret = btn.querySelector('.expert-caret');
      if (!body) return;
      var open = !body.hidden;
      body.hidden = open;
      btn.setAttribute('aria-expanded', open ? 'false' : 'true');
      if (caret) caret.textContent = open ? '展开' : '收起';
    });

    /* 展开 / 收起分歧洞察里的其余分组 */
    D.on(root, 'click', '[data-insight-toggle]', function (e, btn) {
      var body = btn.parentNode.querySelector('.insight-extra-body');
      if (!body) return;
      var open = !body.hidden;
      body.hidden = open;
      btn.setAttribute('aria-expanded', open ? 'false' : 'true');
      btn.textContent = open ? '看中等可信与普通组的票型' : '收起分组票型';
    });

    /* 投票动机标签 */
    D.on(root, 'click', '[data-tag]', function (e, el) {
      var pollId = el.getAttribute('data-tag-poll');
      var tag = el.getAttribute('data-tag');
      if (!pollId) return;

      var poll = Store.get('polls', pollId);
      if (!poll) return;

      var mine = Store.myVoteIn(poll);
      if (!mine) return;

      mine.tags = mine.tags || [];
      var i = mine.tags.indexOf(tag);
      if (i >= 0) mine.tags.splice(i, 1);
      else mine.tags.push(tag);

      Store.save('polls', poll);
      if (rerender) rerender();
    });
  }

  function creditOf(voterId) {
    return Store.creditOf(voterId);
  }

  global.Credit = {
    analyze: analyze,
    insightData: insightData,
    insightHtml: insightHtml,
    creditOf: creditOf,
    panelHtml: panelHtml,
    tagPickerHtml: tagPickerHtml,
    badgeHtml: badgeHtml,
    pageHtml: pageHtml,
    myHistory: myHistory,
    meId: meId,
    tierLabel: tierLabel,
    bind: bind
  };

})(window);

</script>
<script>
/* assets/js/views.js */
/* ============================================================
   views.js — 页面渲染
   每个 render* 返回 HTML 字符串，由 app.js 塞进 <main>。
   事件统一用 D.on() 委托绑定，避免节点重建后失效。

   ⚠️ 这里只做「展示 + 表单收集」。计票、平票裁决、匹配打分
      最终都要交给 DeepWorks 的工作流，前端不长期保留这些逻辑。
   ============================================================ */

(function (global) {
  'use strict';

  var esc = D.esc, price = D.price, time = D.time, ago = D.ago;

  /* 数据到底放在哪儿：接了云端就说云端，单文件离线版说本机。
     全站涉及"数据在哪"的文案都走这里，避免一份代码两种说法打架。 */
  function cloudOn() {
    return !!(global.PFSync && global.PFSync.enabled && global.PFSync.enabled());
  }
  function dataWhere() { return cloudOn() ? '云端' : '本机浏览器'; }
  /* 换设备还能不能看到 */
  function crossDevice() {
    return cloudOn()
      ? '同一账号换设备登录，数据自动带过去'
      : '换一台设备打开是空的';
  }

  /* 最近一次投票的候选 id：只为了在重渲染后播一次弹跳动画 */
  var lastVotedId = null;

  /* 重投暂存：{pollId, choice:[]}。只在内存里，确认前不写库 */
  var pendingRevote = null;

  /** 短时间：11月15日 21:14 */
  function fmtShort(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' +
      ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  /** 毫秒时间戳 → <input type="datetime-local"> 能吃的本地时间串 */
  function dtLocal(ms) {
    var d = new Date(ms);
    var p = function (n) { return ('0' + n).slice(-2); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
      'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /* 内联 SVG 图标：不用 emoji，避免无彩色 emoji 字体的环境里退化成黑白块 */
  var SVG_HEAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';

  var ICON_VOTE = SVG_HEAD +
    '<path d="M9 11.5l2.2 2.2L21 4"/><path d="M20.5 12.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9.5"/></svg>';

  var ICON_GUIDE = SVG_HEAD +
    '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>' +
    '<path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>';

  var ICON_SWAP = SVG_HEAD +
    '<path d="M17 4l3 3-3 3"/><path d="M20 7H8"/><path d="M7 20l-3-3 3-3"/>' +
    '<path d="M4 17h12"/></svg>';


  /* ============================================================
     公共小片段
     ============================================================ */

  function pageHead(title, desc, actions) {
    return '' +
      '<div class="section-head">' +
        '<h2>' + esc(title) + '</h2>' +
        (desc ? '<span class="hint">' + esc(desc) + '</span>' : '') +
        (actions ? '<span class="spacer"></span>' + actions : '') +
      '</div>';
  }

  function emptyBox(title, text, btnHtml) {
    return '' +
      '<div class="empty">' +
        '<div class="empty-title">' + esc(title) + '</div>' +
        '<p>' + esc(text) + '</p>' +
        (btnHtml || '') +
      '</div>';
  }

  /**
   * 整页状态骨架：404 / 无权限 / 已结束 共用。
   * 三段式：出了什么事 → 具体信息（地址、还差几次）→ 下一步能做什么。
   * 目的是让任何一种"打不开"都有解释和出口，而不是一片空白。
   */
  function statePage(o) {
    var actions = (o.actions || []).map(function (a) {
      return '<a class="btn ' + (a.primary ? 'btn-primary' : 'btn-line') + '" href="' +
        esc(a.href) + '">' + esc(a.label) + '</a>';
    }).join('');

    var links = (o.links || []).map(function (l, i) {
      return (i ? '<span class="state-sep" aria-hidden="true">·</span>' : '') +
        '<a href="' + esc(l.href) + '">' + esc(l.label) + '</a>';
    }).join('');

    return '' +
      '<div class="state-page' + (o.tone ? ' is-' + o.tone : '') + '" role="status">' +
        '<div class="state-icon" aria-hidden="true">' + (o.icon || '!') + '</div>' +
        (o.code ? '<div class="state-code">' + esc(o.code) + '</div>' : '') +
        '<h2 class="state-title">' + esc(o.title) + '</h2>' +
        '<p class="state-text">' + esc(o.text) + '</p>' +
        (o.detail ? '<div class="state-detail">' + o.detail + '</div>' : '') +
        (actions ? '<div class="state-actions">' + actions + '</div>' : '') +
        (links ? '<div class="state-links">' + links + '</div>' : '') +
      '</div>';
  }

  function typeLabel(t) {
    if (t === 'multi') return '多选';
    if (t === 'rank') return '排序';
    return '单选';
  }

  /* ---------- 分享 ---------- */

  /** 当前这次投票的对外链接（hash 路由，file:// 下同样成立） */
  function pollUrl(id) {
    /* 线上只留 origin + 路径，别把调试参数（?v=…）带进分享链接；
       file:// 打开时 origin 是 null，只能退回用当前路径 */
    var base = location.protocol === 'file:'
      ? location.href.split('#')[0]
      : location.origin + location.pathname;
    return base + '#/poll/' + encodeURIComponent(id);
  }

  /**
   * 复制文本。https 下先试 Clipboard API，失败再回退到 execCommand；
   * file:// 或旧浏览器直接走 execCommand。传了输入框就顺手选中，
   * 万一两条路都被浏览器拦，用户抬手 Ctrl+C 也能拿到。
   */
  function copyText(text, srcInput) {
    if (srcInput) {
      try {
        srcInput.focus({ preventScroll: true });
        srcInput.select();
        srcInput.setSelectionRange(0, text.length);
      } catch (e) { /* 选中失败不影响后面 */ }
    }

    function viaTextarea() {
      return new Promise(function (resolve, reject) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-2000px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        ta.remove();
        if (ok) resolve(); else reject(new Error('copy-failed'));
      });
    }

    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(function () {
        return viaTextarea();
      });
    }
    return viaTextarea();
  }

  /** 单选/多选时 score 就是票数，只有排序制才是"分" */
  function unitOf(poll) {
    return poll.type === 'rank' ? '分' : '票';
  }

  /* ---------- 登录引导 ---------- */

  /** 登录页链接，带上登录后要回到的地址 */
  function loginLink(next) {
    return '#/login' + (next ? '?next=' + encodeURIComponent(next) : '');
  }

  /** 拦截：记下要回来的地址，直接送去登录页 */
  function askLogin(next) {
    D.toast('这一步要登录');
    location.hash = loginLink(next || location.hash || '#/');
  }

  /** 未登录时的整页引导块 */
  function authGate(title, text, next) {
    return '' +
      '<div class="card auth-gate">' +
        '<div class="empty-title">' + esc(title) + '</div>' +
        '<p>' + esc(text) + '</p>' +
        '<div class="auth-actions">' +
          '<a class="btn btn-primary" href="' + esc(loginLink(next)) + '">登录 / 注册</a>' +
          '<a class="btn btn-line" href="#/">先去逛逛</a>' +
        '</div>' +
        (cloudOn()
          ? '<p class="auth-gate-note">用邮箱和密码登录，第一次用会自动注册，密码至少 6 位。' +
            '换一台设备用同一个邮箱登录，看到的是同一份数据。</p>'
          : '<p class="auth-gate-note">演示环境不发短信：手机号填 ' + esc(Store.DEMO_CONTACT) +
            '，验证码填 123456，就能用带历史记录的演示账号。</p>') +
      '</div>';
  }

  /* ============================================================
     首页
     ============================================================ */

  /**
   * 进行中 + 已归档的全量投票，按 id 去重，history 优先。
   * 投票一结束就会被 watcher 从 polls 搬进 history，
   * 只读 polls 会让「已经结束的投票」「我发起的投票」直接消失。
   */
  function allPolls() {
    var map = {};
    Store.list('polls').forEach(function (p) { if (p && p.id) map[p.id] = p; });
    Store.list('history').forEach(function (p) { if (p && p.id) map[p.id] = p; });
    return Object.keys(map).map(function (k) { return map[k]; });
  }

  function renderHome() {
    var all = allPolls();
    var meId = Store.meId();
    // 「仅链接可见」的投票不进公共列表，只能凭链接进入
    var open = all.filter(function (p) { return !Store.isClosed(p); });
    var polls = open.filter(function (p) {
      return p.visibility !== 'link' && p.owner !== meId;
    });
    // 自己发起的不受这条限制，否则关掉页面就再也找不回来
    var mine = open.filter(function (p) {
      return !!meId && p.owner === meId;
    });
    // 已结束的单独列出来：链接还能打开，但不能再投
    var ended = all.filter(function (p) {
      return Store.isClosed(p) && p.visibility !== 'link';
    });
    var guides = Store.list('guides');
    var swaps = Store.list('swaps');

    var pollCards = polls.length
      ? polls.map(pollCardHtml).join('')
      : emptyBox(
          '没有进行中的投票',
          '发起第一个，把"哪个好"变成一个有结论的决定。',
          '<a class="btn btn-primary" href="#/new">发起投票</a>'
        );

    var endedBlock = ended.length
      ? '<section class="section">' +
          pageHead('已经结束的投票', ended.length + ' 个 · 结论还能看', '') +
          '<div class="card-grid">' + ended.map(pollCardHtml).join('') + '</div>' +
        '</section>'
      : '';

    return '' +
      '<section class="hero">' +
        '<h1>拿不准的选择，<span class="hero-h1-2">交给可信的大家。</span></h1>' +
        '<p>几个人、几个选项、一个决定。投票、攻略、交换三段闭环，' +
        '一次决策沉淀成下一次的攻略。</p>' +
        '<div class="hero-actions">' +
          '<a class="btn btn-primary" href="#/new">发起一个投票</a>' +
          '<a class="btn btn-ghost" href="#/guides">看看选品攻略</a>' +
        '</div>' +
      '</section>' +

      '<section class="section">' +
        pageHead('三个区，其实是一条链') +
        '<div class="bento">' +
          '<a class="zone zone--main" href="#/new">' +
            '<div class="zone-main-body">' +
              '<div class="zone-icon">' + ICON_VOTE + '</div>' +
              '<h3>帮我选</h3>' +
              '<p>2—8 个候选，带图、带价、带参数。投完直接出结论，平票也有说法。</p>' +
              '<div class="zone-meta">' +
                '<span class="tag brand">主链路</span>' +
                '<span class="tag">分层权限</span>' +
                '<span class="tag">场景模板</span>' +
                '<span class="tag">分歧洞察</span>' +
              '</div>' +
              '<div class="go">发起投票 →</div>' +
            '</div>' +
            '<div class="zone-steps" aria-hidden="true">' +
              '<div class="step"><b>1</b><span>列出候选，写清价格参数</span></div>' +
              '<div class="step"><b>2</b><span>发给人投，或自己打分</span></div>' +
              '<div class="step"><b>3</b><span>拿到一句能执行的结论</span></div>' +
            '</div>' +
          '</a>' +
          '<a class="zone zone--guides" href="#/guides">' +
            '<div class="zone-icon accent">' + ICON_GUIDE + '</div>' +
            '<h3>选品攻略 <span class="tag">' + guides.length + ' 篇</span></h3>' +
            '<p>预算档位、关键参数、适用人群、避坑点。不是散文，是能被检索的模板。</p>' +
            '<div class="go">看攻略 →</div>' +
          '</a>' +
          '<a class="zone zone--swap" href="#/swap">' +
            '<div class="zone-icon">' + ICON_SWAP + '</div>' +
            '<h3>跟我换 <span class="tag">' + swaps.length + ' 条</span></h3>' +
            '<p>用不上的，发个意向换掉。当面交易，不涉及支付与担保。</p>' +
            '<div class="go">看看在换什么 →</div>' +
          '</a>' +
        '</div>' +
      '</section>' +

      (mine.length
        ? '<section class="section">' +
            pageHead('我发起的', mine.length + ' 个 · 仅链接的投票只在这里可见') +
            '<div class="card-grid">' + mine.map(pollCardHtml).join('') + '</div>' +
          '</section>'
        : '') +

      '<section class="section">' +
        pageHead('进行中的投票', polls.length + ' 个', '<a class="btn btn-line btn-sm" href="#/new">+ 新建</a>') +
        '<div class="card-grid">' + pollCards + '</div>' +
      '</section>' +

      endedBlock;
  }

  /** 一张投票卡。公开与「仅链接」共用，后者带一枚标签 */
  function pollCardHtml(p) {
    var t = Store.tally(p);
    var timing = Store.pollTiming(p);
    /* 进行中不叫「已有结论」——1 票也能叫结论会误导。
       进行中只说「暂时领先」，真正的结论留给结束态。
       不把候选名塞进标签：名字一长就把「场景」标签挤到下一行，卡片变高变乱。 */
    var tag = Store.isClosed(p)
      ? '<span class="tag">' + (p.archived ? '已结束' : '已截止') + '</span>'
      : (t.total === 0
          ? '<span class="tag">还没人投</span>'
          : (t.tie
              ? '<span class="tag warn">平票</span>'
              : '<span class="tag ok">暂时领先</span>'));
    var deadlineTag = (!Store.isClosed(p) && timing.hasDeadline)
      ? '<span class="tag">' + esc(timing.short) + '后截止</span>'
      : '';
    var vis = p.visibility === 'link' ? '<span class="tag brand">仅链接</span>' : '';
    var scene = Store.sceneOf(p);
    var sceneTag = scene ? '<span class="tag">' + esc(scene.label) + '</span>' : '';
    var gateTag = (p.gate && p.gate !== 'all')
      ? '<span class="tag">门槛：' + esc(Store.gateMeta(p).label) + '</span>'
      : '';
    var modeTag = Store.resultModeOf(p).key === 'simple'
      ? '<span class="tag">精简结论</span>'
      : '';

    return '' +
      '<a class="card zone" href="#/poll/' + esc(p.id) + '">' +
        '<h3>' + esc(p.title) + ' ' + tag + vis + sceneTag + gateTag + modeTag + deadlineTag + '</h3>' +
        '<p>' + esc(p.note || '没有备注') + '</p>' +
        '<div class="go">' +
          esc(p.options.length) + ' 个候选 · ' +
          esc(t.total) + ' 票 · ' +
          esc(typeLabel(p.type)) + ' · ' +
          esc(ago(p.createdAt)) +
        '</div>' +
      '</a>';
  }

          '<div class="field">' +

          '<div id="optList"></div>' +

        '<div class="notice" style="margin-top:4px">' +

          '忘了开也没关系：增补候选可以在详情页的「发起者工具」里临时打开；' +
