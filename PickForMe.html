/* ============================================================
   v0.0.9 新增：场景模板 / 分层权限 / 分歧洞察 / 投票中增补候选
   全部复用上面的 token，两套皮肤下都不需要单独覆盖
   ============================================================ */

.form-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 20px;
}

/* 候选卡里的参数标签在窄列里可能顶破 grid 轨道，允许内容收缩 */
.card-grid > * { min-width: 0; }
.vote-card .tag { max-width: 100%; }

/* ---------- 场景模板库 ---------- */
.scene-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-top: 10px;
}

.scene-card {
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: left;
  padding: 12px 13px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  color: inherit;
  font: inherit;
  cursor: pointer;
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease),
              box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease);
}

.scene-card:hover {
  border-color: var(--brand-line);
  transform: translateY(-1px);
}

.scene-card.is-on {
  border-color: var(--brand);
  background: var(--brand-soft);
  box-shadow: 0 0 0 3px var(--brand-ring);
}

.scene-tag {
  align-self: flex-start;
  font-size: 11px;
  line-height: 1.5;
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--ink-2);
}

.scene-card.is-on .scene-tag {
  background: var(--surface);
  color: var(--brand-ink);
}

.scene-name { font-size: 14.5px; font-weight: 700; color: var(--ink); }
.scene-desc { font-size: 12.5px; color: var(--ink-2); line-height: 1.55; }

.scene-defaults {
  margin-top: 2px;
  font-size: 11.5px;
  color: var(--brand-ink);
  font-family: var(--font-num);
  letter-spacing: -.01em;
}

.scene-hint {
  margin-top: 8px;
  font-size: 12.5px;
  color: var(--ink-2);
}

/* ---------- 权限组合预览 ---------- */
.perm-preview {
  margin: 2px 0 18px;
  padding: 12px 14px;
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius);
  background: var(--surface-2);
  display: grid;
  gap: 6px;
}

.perm-row {
  display: flex;
  gap: 10px;
  align-items: baseline;
  font-size: 13px;
  color: var(--ink-2);
}

.perm-k {
  flex: 0 0 64px;
  font-size: 12px;
  color: var(--ink-2);
}

.perm-row b { color: var(--ink); font-weight: 600; }

.perm-combo {
  margin-top: 2px;
  padding-top: 8px;
  border-top: 1px dashed var(--line);
  font-size: 12.5px;
  color: var(--brand-ink);
}

.perm-warn {
  margin-top: 4px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  background: var(--warn-soft);
  color: var(--warn-ink);
  font-size: 12.5px;
  line-height: 1.6;
}

/* ---------- 门槛提示 / 拦截 ---------- */
.gate-note {
  margin-bottom: 16px;
  padding: 10px 13px;
  border-radius: var(--radius);
  border: 1px solid var(--ok-line);
  background: var(--ok-soft);
  color: var(--ok-ink);
  font-size: 13px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: baseline;
}

.gate-note b { color: var(--ok-ink); }

.gate-block {
  margin-bottom: 16px;
  padding: 14px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--warn-line);
  background: var(--warn-soft);
  color: var(--warn-ink);
}

.gate-block-head {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 6px;
}

.gate-block-head b { font-size: 14px; }
.gate-block p { margin: 0 0 6px; font-size: 13px; line-height: 1.65; }
.gate-block-sub { opacity: .85; }
.gate-block .btn { margin-top: 6px; }

.vote-card.is-locked {
  opacity: .58;
  border-style: dashed;
}

.vote-card.is-revote {
  border-color: var(--brand-line);
  box-shadow: inset 0 0 0 1px var(--brand-line);
}

/* ---------- 【新增选项】标记 ---------- */
.tag-new {
  background: var(--accent-soft);
  border-color: var(--accent-line);
  color: var(--accent-ink);
  font-weight: 650;
}

/* ---------- 重投横幅 ---------- */
.revote-banner {
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  margin-bottom: 16px;
  padding: 12px 15px;
  border-radius: var(--radius);
  border: 1px solid var(--brand-line);
  background: var(--brand-soft);
}

.revote-banner.is-active {
  border-color: var(--accent-line);
  background: var(--accent-soft);
}

.revote-text { display: flex; flex-direction: column; gap: 3px; }
.revote-text b { font-size: 13.5px; color: var(--brand-ink); }
.revote-banner.is-active .revote-text b { color: var(--accent-ink); }
.revote-text span { font-size: 12.5px; color: var(--ink-2); line-height: 1.55; }
.revote-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- 分歧洞察 ---------- */
.insight {
  margin-top: 14px;
  padding: 16px 18px;
  border: 1px solid var(--line);
  border-left: 4px solid var(--brand);
  border-radius: var(--radius-card);
  background: var(--surface);
}

.insight-head {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}

.insight-title {
  font-size: 14.5px;
  font-weight: 750;
  color: var(--ink);
  letter-spacing: .01em;
}

.insight-badge {
  font-size: 11.5px;
  padding: 2px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink-2);
  font-family: var(--font-num);
}

.insight-badge.split {
  background: var(--accent-soft);
  border-color: var(--accent-line);
  color: var(--accent-ink);
}

.insight-badge.divided {
  background: var(--warn-soft);
  border-color: var(--warn-line);
  color: var(--warn-ink);
}

.insight-badge.aligned {
  background: var(--ok-soft);
  border-color: var(--ok-line);
  color: var(--ok-ink);
}

.insight-lead {
  margin: 0 0 14px;
  font-size: 14px;
  line-height: 1.7;
  color: var(--ink);
}

.insight-cols {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 14px;
}

.insight-col {
  padding: 11px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface-2);
}

.insight-col-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 8px;
  font-size: 12.5px;
  font-weight: 650;
  color: var(--ink-2);
}

.insight-count {
  font-family: var(--font-num);
  font-size: 11.5px;
  color: var(--ink-2);
}

.insight-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 84px auto;
  gap: 8px;
  align-items: center;
  padding: 3px 0;
  font-size: 12.5px;
}

.insight-opt {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--ink-2);
}

.insight-row.is-top .insight-opt { color: var(--ink); font-weight: 650; }

.insight-meter {
  height: 6px;
  border-radius: 999px;
  background: var(--line);
  overflow: hidden;
}

.insight-meter i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--line-strong);
}

.insight-row.is-top .insight-meter i { background: var(--brand); }

.insight-num {
  font-family: var(--font-num);
  font-size: 11.5px;
  color: var(--ink-2);
  white-space: nowrap;
}

.insight-empty { font-size: 12.5px; color: var(--ink-2); padding: 6px 0; }

.insight-thin {
  margin: 10px 0 0;
  font-size: 12px;
  color: var(--warn-ink);
  background: var(--warn-soft);
  border-radius: var(--radius-sm);
  padding: 7px 10px;
}

.insight-extra { margin-top: 12px; }

.insight-toggle {
  border: 0;
  background: none;
  padding: 0;
  font: inherit;
  font-size: 12.5px;
  color: var(--brand-ink);
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.insight-extra-body {
  margin-top: 10px;
  display: grid;
  gap: 12px;
}

/* 作者样式的 display 会盖掉 [hidden] 的 UA 规则，这里补回来 */
.insight-extra-body[hidden] { display: none; }

.insight-extra-head {
  font-size: 12px;
  font-weight: 650;
  color: var(--ink-2);
  margin-bottom: 4px;
}

.insight-filtered { font-size: 12px; color: var(--ink-2); line-height: 1.6; }

.insight-note {
  margin: 12px 0 0;
  font-size: 11.5px;
  color: var(--ink-2);
  line-height: 1.6;
}

.mode-note { margin-top: 12px; }

/* ---------- 发起者工具 ---------- */
.owner-tools { padding: 16px 18px; }

.owner-row {
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
}

.owner-row b { font-size: 14px; display: block; }
.owner-sub { display: block; font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }

.risk-box {
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  background: var(--warn-soft);
  border: 1px solid var(--warn-line);
  color: var(--warn-ink);
  font-size: 12.5px;
  line-height: 1.65;
}

.risk-box b { color: var(--warn-ink); }
.owner-closed { margin-top: 12px; font-size: 12.5px; color: var(--ink-2); }
.owner-open { margin-top: 4px; }

.add-opt-form {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px dashed var(--line);
}

.risk-check {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  margin: 4px 0 14px;
  font-size: 12.5px;
  color: var(--ink-2);
  line-height: 1.55;
  cursor: pointer;
}

.risk-check input { margin-top: 2px; }

.rev-list {
  list-style: none;
  margin: 14px 0 0;
  padding: 12px 0 0;
  border-top: 1px dashed var(--line);
  display: grid;
  gap: 5px;
}

.rev-list li {
  font-size: 12px;
  color: var(--ink-2);
  font-family: var(--font-num);
}

@media (max-width: 599px) {
  .insight { padding: 14px; }
  .insight-row { grid-template-columns: minmax(0, 1fr) auto; }
  .insight-row .insight-meter { display: none; }
  .revote-banner { align-items: stretch; }
  .revote-actions .btn { flex: 1 1 auto; }
}

/* ============================================================
   v0.1.0 · 全局基础层：账号、消息、设置、页脚
   ============================================================ */

/* ---------- 顶栏：消息铃铛 + 登录态 ---------- */

.icon-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border-radius: var(--radius-chip);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  cursor: pointer;
  transition: border-color var(--dur), color var(--dur), background var(--dur);
}

.icon-btn:hover {
  border-color: var(--brand-line);
  color: var(--brand-ink);
  background: var(--brand-soft);
}

.icon-btn .dot {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--danger, #d92d20);
  box-shadow: 0 0 0 2px var(--surface);
}

.auth-entry {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  max-width: 150px;
  padding: 4px 10px 4px 4px;
  border-radius: var(--radius-chip);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  font-size: 12.5px;
  font-weight: 600;
  white-space: nowrap;
  transition: border-color var(--dur), color var(--dur), background var(--dur);
}

.auth-entry:hover {
  border-color: var(--brand-line);
  color: var(--brand-ink);
  background: var(--brand-soft);
}

.auth-entry-avatar {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--brand-soft);
  border: 1px solid var(--brand-line);
  color: var(--brand-ink);
  font-size: 13px;
  flex: 0 0 auto;
}

.auth-entry-name {
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 92px;
}

/* ---------- 消息面板 ---------- */

.msg-panel {
  position: fixed;
  top: calc(var(--topbar-h) + 8px);
  right: max(16px, calc((100vw - var(--content)) / 2 + 16px));
  z-index: 60;
  width: min(360px, calc(100vw - 24px));
  max-height: min(70vh, 520px);
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-2);
  overflow: hidden;
}

.msg-panel[hidden] { display: none; }

.msg-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  font-size: 13.5px;
}

.msg-list {
  overflow-y: auto;
  padding: 6px;
}

.msg-item {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 8px;
  align-items: start;
  padding: 10px;
  border-radius: var(--radius-md);
  color: inherit;
  transition: background var(--dur);
}

.msg-item:hover { background: var(--surface-2); }

.msg-item.is-unread { background: var(--brand-soft); }
.msg-item.is-unread:hover { background: var(--brand-soft); }

.msg-tag {
  display: inline-block;
  padding: 2px 6px;
  border-radius: var(--radius-chip);
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink-2);
  font-size: 11px;
  white-space: nowrap;
}

.msg-tag.brand { background: var(--brand-soft); border-color: var(--brand-line); color: var(--brand-ink); }
.msg-tag.ok    { background: var(--ok-soft);    border-color: var(--ok-line);    color: var(--ok-ink); }
.msg-tag.warn  { background: var(--warn-soft);  border-color: var(--warn-line);  color: var(--warn-ink); }

.msg-body {
  display: grid;
  gap: 2px;
  min-width: 0;
}

.msg-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  overflow-wrap: anywhere;
}

.msg-text {
  font-size: 12px;
  color: var(--ink-2);
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.msg-time {
  font-size: 11px;
  color: var(--ink-3);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.msg-empty {
  padding: 26px 16px;
  text-align: center;
  font-size: 13px;
  color: var(--ink-3);
  line-height: 1.7;
}

/* ---------- 未登录引导 ---------- */

.auth-gate {
  display: grid;
  gap: 10px;
  max-width: 640px;
}

.auth-gate p {
  margin: 0;
  font-size: 13.5px;
  color: var(--ink-2);
  line-height: 1.75;
}

.auth-gate .empty-title { margin-bottom: 0; }

.auth-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 4px;
}

.auth-gate-note {
  margin: 0;
  padding-top: 10px;
  border-top: 1px dashed var(--line);
  font-size: 12px;
  color: var(--ink-3);
  line-height: 1.7;
}

/* ---------- 登录页 ---------- */

.auth-wrap {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
  gap: 18px;
  align-items: start;
}

.auth-card {
  display: grid;
  gap: 14px;
  padding: 18px;
}

.auth-tabs {
  display: flex;
  gap: 6px;
  padding: 4px;
  border-radius: var(--radius-chip);
  background: var(--surface-2);
  border: 1px solid var(--line);
}

.auth-tab {
  flex: 1 1 auto;
  padding: 7px 8px;
  border: 0;
  border-radius: calc(var(--radius-chip) - 3px);
  background: transparent;
  color: var(--ink-2);
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: background var(--dur), color var(--dur);
}

.auth-tab.is-on {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-1);
}

.auth-demo {
  margin: 0;
  padding: 10px 12px;
  border-radius: var(--radius-md);
  border: 1px dashed var(--brand-line);
  background: var(--brand-soft);
  color: var(--brand-ink);
  font-size: 12px;
  line-height: 1.75;
}

.auth-side {
  padding: 18px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--line);
  background: var(--surface-2);
}

.auth-side h3 {
  margin: 0 0 10px;
  font-size: 14px;
}

.auth-side ul {
  margin: 0 0 12px;
  padding-left: 18px;
  display: grid;
  gap: 6px;
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.6;
}

.auth-side p {
  margin: 0;
  font-size: 12.5px;
  color: var(--ink-3);
  line-height: 1.7;
}

/* ---------- 我的：账号卡 / 设置 ---------- */

.account-card {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.account-avatar {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: var(--brand-soft);
  border: 1px solid var(--brand-line);
  font-size: 22px;
  flex: 0 0 auto;
}

.account-main { flex: 1 1 200px; min-width: 0; }

.account-name {
  font-size: 16px;
  font-weight: 700;
  color: var(--ink);
}

.account-sub {
  margin-top: 3px;
  font-size: 12.5px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}

.account-stats {
  margin-top: 5px;
  font-size: 12.5px;
  color: var(--ink-2);
}

.settings-card { display: grid; gap: 16px; }

.setting-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.setting-row .input { flex: 1 1 auto; min-width: 0; }

.avatar-pick {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.avatar-opt {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  transition: border-color var(--dur), background var(--dur), transform var(--dur);
}

.avatar-opt:hover { border-color: var(--brand-line); transform: translateY(-1px); }

.avatar-opt.is-on {
  border-color: var(--brand-line);
  background: var(--brand-soft);
  box-shadow: 0 0 0 2px var(--brand-soft);
}

.switch-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px 12px;
  border-radius: var(--radius-md);
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-size: 13.5px;
  color: var(--ink);
  cursor: pointer;
}

.switch-row input {
  width: 16px;
  height: 16px;
  accent-color: var(--brand);
  flex: 0 0 auto;
}

/* ---------- 攻略收藏 / 交换按钮 ---------- */

.guide-card {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.guide-card-main {
  display: block;
  color: inherit;
}

.guide-card-main h3 { margin-bottom: 6px; }
.guide-card-main p { margin: 0 0 8px; }

.fav-btn {
  align-self: flex-start;
  padding: 5px 10px;
  border-radius: var(--radius-chip);
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink-2);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: border-color var(--dur), color var(--dur), background var(--dur);
}

.fav-btn:hover { border-color: var(--brand-line); color: var(--brand-ink); }

.fav-btn.is-on {
  background: var(--brand-soft);
  border-color: var(--brand-line);
  color: var(--brand-ink);
}

.btn.is-fav {
  border-color: var(--brand-line);
  color: var(--brand-ink);
  background: var(--brand-soft);
}

.swap-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed var(--line);
}

.voter-hidden {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 6px;
  border-radius: var(--radius-chip);
  border: 1px dashed var(--line);
  color: var(--ink-3);
  font-size: 11px;
}

/* ---------- 页脚三段 ---------- */

.footer-inner {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
  align-items: start;
}

.footer-col p {
  margin: 4px 0 0;
  font-size: 12px;
  line-height: 1.7;
  color: var(--ink-3);
}

.footer-title {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ink-2);
}

.footer-bottom {
  max-width: var(--content);
  margin: 0 auto;
  padding: 0 16px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--ink-3);
}

@media (max-width: 768px) {
  .auth-wrap { grid-template-columns: minmax(0, 1fr); }
  .msg-panel {
    left: 12px;
    right: 12px;
    width: auto;
    top: calc(var(--topbar-h) + 6px);
  }
}

@media (max-width: 599px) {
  .auth-entry-name { max-width: 60px; }
  .footer-inner { gap: 12px; }
  .account-card { gap: 10px; }
  .setting-row { flex-wrap: wrap; }
  .setting-row .btn { flex: 1 1 auto; }
}

/* ---------- 实名投票的投票人列表（徽章与隐私开关的对外落点） ---------- */

.voter-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 2px;
}

.voter-item {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 9px 0;
  border-bottom: 1px dashed var(--line);
  font-size: 13px;
}

.voter-item:last-child { border-bottom: 0; }

.voter-item-name {
  font-weight: 600;
  color: var(--ink);
}

.voter-item-pick {
  margin-left: auto;
  color: var(--ink-2);
  font-size: 12.5px;
  overflow-wrap: anywhere;
}

/* ============================================================
   v0.1.1 — 攻略筛选 / 投稿，交换广场 / 详情 / 发布
   ============================================================ */

.is-hidden { display: none !important; }

/* ---------- 筛选条 / 分类胶囊 / 状态标签 ---------- */

.filter-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.filter-search { flex: 1 1 220px; min-width: 0; }

.result-count {
  font-size: 12.5px;
  color: var(--ink-3);
  white-space: nowrap;
}

.chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}

.chip {
  padding: 6px 13px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: border-color var(--dur), color var(--dur), background var(--dur);
}

.chip:hover { border-color: var(--brand-line); color: var(--brand-ink); }

.chip.is-on {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
}

.chip-sm {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--ink-2);
  font-size: 11.5px;
  font-weight: 600;
  white-space: nowrap;
}

.chip-sm.is-poll {
  background: var(--accent-soft);
  border-color: var(--accent-line);
  color: var(--accent-ink);
}

.status-tag {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 700;
  white-space: nowrap;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink-2);
}

.status-tag.is-open,
.status-tag.is-accepted {
  background: var(--ok-soft);
  border-color: var(--ok-line);
  color: var(--ok-ink);
}

.status-tag.is-matched,
.status-tag.is-done {
  background: var(--brand-soft);
  border-color: var(--brand-line);
  color: var(--brand-ink);
}

.status-tag.is-pending {
  background: var(--accent-soft);
  border-color: var(--accent-line);
  color: var(--accent-ink);
}

.status-tag.is-rejected,
.status-tag.is-closed { color: var(--ink-3); }

.section-tight { margin-top: 22px; }

/* ---------- 攻略：卡片 / 封面 / 详情区块 / 参考链接 ---------- */

.guide-card { display: block; position: relative; }

.guide-card-main {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  color: inherit;
}

.guide-thumb {
  width: 76px;
  height: 76px;
  flex: 0 0 76px;
  border-radius: var(--radius-sm);
  object-fit: cover;
  background: var(--surface-2);
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
}

.guide-card-body { min-width: 0; flex: 1; }

.guide-card-body h3 {
  font-size: 16px;
  line-height: 1.35;
  margin: 6px 0;
}

.guide-sum {
  font-size: 13px;
  color: var(--ink-2);
  margin: 0 0 6px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.guide-meta {
  font-size: 12px;
  color: var(--ink-3);
  margin: 0;
}

.guide-card .fav-btn { margin-top: 10px; }

.guide-hero {
  display: flex;
  gap: 18px;
  align-items: center;
  margin: 4px 0 6px;
}

.guide-cover {
  width: 132px;
  height: 132px;
  flex: 0 0 132px;
  border-radius: var(--radius);
  object-fit: cover;
  background: var(--surface-2);
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 52px;
}

.guide-hero-info { min-width: 0; }

.guide-hero-info h1 {
  font-size: 22px;
  line-height: 1.32;
  margin: 8px 0;
}

.spec-row {
  display: flex;
  gap: 14px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
  font-size: 13.5px;
}

.spec-row:last-child { border-bottom: none; }

.spec-row b {
  min-width: 118px;
  flex: 0 0 118px;
  color: var(--ink);
}

.spec-row span { color: var(--ink-2); }

.spec-empty {
  color: var(--ink-3);
  font-size: 13.5px;
  list-style: none;
}

.pitfall-list {
  margin: 0;
  padding-left: 20px;
  font-size: 13.5px;
}

.pitfall-list li { margin-bottom: 7px; }

.link-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.link-list a {
  font-size: 13.5px;
  color: var(--brand-ink);
  text-decoration: none;
}

.link-list a:hover { text-decoration: underline; }

.poll-link-card {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
}

.poll-link-info h3 {
  font-size: 15px;
  margin: 0 0 4px;
}

.poll-link-info p {
  margin: 0;
  font-size: 13px;
  color: var(--ink-3);
}

/* ---------- 交换：广场卡片 / 详情 / 申请 ---------- */

.swap-card { display: block; }

.swap-main {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  color: inherit;
}

.swap-thumb {
  width: 84px;
  height: 84px;
  flex: 0 0 84px;
  border-radius: var(--radius-sm);
  object-fit: cover;
  border: 1px solid var(--line);
  background: var(--surface-2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  color: var(--brand-ink);
}

.swap-body { min-width: 0; flex: 1; }

.swap-top {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}

.swap-body h3 {
  font-size: 15.5px;
  line-height: 1.35;
  margin: 0 0 4px;
}

.swap-want {
  font-size: 13px;
  color: var(--ink-2);
  margin: 0 0 4px;
}

.swap-meta {
  font-size: 12.5px;
  color: var(--ink-3);
  margin: 0 0 6px;
}

.swap-owner {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  color: var(--ink-2);
  flex-wrap: wrap;
}

.swap-detail {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 16px;
  align-items: start;
}

.swap-hero {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.swap-cover {
  width: 100%;
  height: 220px;
  border-radius: var(--radius-sm);
  object-fit: cover;
  background: var(--surface-2);
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 56px;
  color: var(--brand-ink);
}

.swap-hero-body h1 {
  font-size: 21px;
  line-height: 1.3;
  margin: 8px 0 6px;
}

.swap-value {
  font-size: 14px;
  font-weight: 700;
  color: var(--brand-ink);
  margin: 0 0 8px;
}

.swap-desc {
  font-size: 13.5px;
  color: var(--ink-2);
  line-height: 1.65;
  margin: 0;
}

.swap-side {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.swap-h {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ink-3);
  margin: 0 0 8px;
}

.swap-want-big {
  font-size: 15.5px;
  font-weight: 650;
  margin: 0 0 4px;
}

.gate-line {
  font-size: 14px;
  font-weight: 700;
  color: var(--brand-ink);
  margin: 0 0 4px;
}

.owner-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}

.apply-box {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.apply-hint {
  margin: 0;
  font-size: 13.5px;
  color: var(--ink-2);
}

.apply-hint.is-blocked {
  color: var(--warn-ink);
  font-weight: 600;
}

.req-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 12px;
}

.req-row {
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 12px;
  background: var(--surface);
}

.req-head {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}

.req-note {
  margin: 0 0 4px;
  font-size: 13px;
  color: var(--ink-2);
}

.req-meta {
  margin: 0;
  font-size: 12px;
  color: var(--ink-3);
}

.req-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  flex-wrap: wrap;
}

/* ---------- 表单：投稿攻略 / 发布交换 ---------- */

.form-card { display: flex; flex-direction: column; }

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
}

.form-sub {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ink-3);
  margin: 20px 0 10px;
}

.rows-box {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 8px;
}

.row-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.range-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.range-row .input { flex: 1; min-width: 0; }

.radio-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
}

.radio-card {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 11px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
  font-size: 12.5px;
  color: var(--ink-2);
  transition: border-color var(--dur), background var(--dur);
}

.radio-card input {
  align-self: flex-start;
  margin: 0 0 4px;
  accent-color: var(--brand);
}

.radio-card b {
  color: var(--ink);
  font-size: 13.5px;
}

.radio-card.is-on {
  border-color: var(--brand-line);
  background: var(--brand-soft);
}

.poll-extra {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.form-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 16px;
}

.input-area {
  min-height: 82px;
  resize: vertical;
  line-height: 1.6;
}

/* 表单里 <label class="field"><span>标题</span> 的写法：跟 .field > label 一致 */
.field > span {
  display: block;
  font-size: 13.5px;
  font-weight: 650;
  margin-bottom: 6px;
}

@media (max-width: 860px) {
  .swap-detail { grid-template-columns: 1fr; }
  .guide-cover { width: 96px; height: 96px; flex-basis: 96px; font-size: 38px; }
  .guide-hero-info h1 { font-size: 19px; }
}

@media (max-width: 599px) {
  .row-pair { grid-template-columns: 1fr; }
  .filter-search { flex: 1 1 100%; }
  .guide-card-main,
  .swap-main { gap: 10px; }
  .guide-thumb,
  .swap-thumb { width: 64px; height: 64px; flex-basis: 64px; font-size: 24px; }
  .guide-hero { gap: 12px; align-items: flex-start; }
  .spec-row { flex-direction: column; gap: 3px; }
  .spec-row b { min-width: 0; flex: none; }
  .swap-cover { height: 170px; }
}

/* ============================================================
   二十四、兜底与说明页（v0.1.2）
   404 / 无权限 / 已结束 共用 .state-page；说明页用 .doc-*
   ============================================================ */

/* --- 整页状态 --- */
.state-page {
  max-width: 560px;
  margin: 24px auto 0;
  padding: 34px 26px 30px;
  text-align: center;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
}

.state-icon {
  width: 46px; height: 46px;
  margin: 0 auto 12px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  font-size: 21px; font-weight: 800;
  color: var(--brand-ink);
  background: var(--brand-soft);
}

.state-page.is-muted .state-icon {
  color: var(--ink-3);
  background: var(--soft);
}

.state-code {
  font-size: 44px;
  font-weight: 800;
  letter-spacing: 2px;
  line-height: 1;
  color: var(--ink-3);
  opacity: .55;
  margin-bottom: 6px;
}

.state-title {
  margin: 0 0 8px;
  font-size: 19px;
  letter-spacing: -.01em;
}

.state-text {
  margin: 0 auto;
  max-width: 430px;
  font-size: 13.5px;
  line-height: 1.75;
  color: var(--ink-2);
}

.state-detail { margin: 14px 0 0; }

.state-kv {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  border-radius: 10px;
  background: var(--soft);
  border: 1px dashed var(--line);
  font-size: 12.5px;
  color: var(--ink-2);
  max-width: 100%;
}

.state-kv code {
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 12px;
  color: var(--ink-1);
  word-break: break-all;
}

.state-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 20px;
}

.state-links {
  margin-top: 16px;
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  font-size: 12.5px;
  color: var(--ink-3);
}

.state-links a { color: var(--ink-2); }
.state-links a:hover { color: var(--brand-ink); }

/* --- 投票已结束 --- */
.ended-banner {
  margin-bottom: 16px;
  padding: 14px 16px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--soft);
}

.ended-main {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}

.ended-main b { font-size: 14.5px; }

.ended-main span {
  font-size: 12.5px;
  color: var(--ink-3);
}

.ended-sub {
  margin-top: 6px;
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--ink-2);
}

/* --- 仅链接可见 --- */
.link-notice {
  margin-bottom: 14px;
  border-left: 3px solid var(--brand);
}

/* --- 门槛挡住时的步骤清单 --- */
.gate-steps {
  margin: 4px 0 0;
  padding-left: 18px;
  font-size: 12.5px;
  line-height: 1.85;
  color: var(--ink-2);
}

.gate-steps b { color: var(--ink-1); }

.gate-block-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
}

/* --- 发起者工具：结束投票 --- */
.owner-row-end {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed var(--line);
}

/* --- 说明页排版 --- */
.doc-section {
  margin-top: 22px;
  padding: 20px 22px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
}

.doc-h {
  margin: 0 0 10px;
  font-size: 15.5px;
  letter-spacing: -.01em;
}

.doc-p {
  margin: 0 0 10px;
  font-size: 13.5px;
  line-height: 1.85;
  color: var(--ink-2);
}

.doc-p:last-child { margin-bottom: 0; }

.doc-p b, .doc-ul b, .doc-ol b { color: var(--ink-1); }

.doc-ul, .doc-ol {
  margin: 0 0 10px;
  padding-left: 20px;
  font-size: 13.5px;
  line-height: 1.85;
  color: var(--ink-2);
}

.doc-ul li, .doc-ol li { margin-bottom: 5px; }

.doc-formula {
  margin: 12px 0;
  padding: 12px 14px;
  border-radius: var(--r-md);
  background: var(--soft);
  border: 1px dashed var(--line);
  text-align: center;
  overflow-x: auto;
}

.doc-formula code {
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 13.5px;
  color: var(--ink-1);
  white-space: nowrap;
}

.doc-table {
  width: 100%;
  border-collapse: collapse;
  margin: 10px 0 4px;
  font-size: 13px;
}

.doc-table th,
.doc-table td {
  padding: 9px 10px;
  text-align: left;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}

.doc-table th {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-3);
  background: var(--soft);
}

.doc-table td { color: var(--ink-2); }
.doc-table td:first-child { color: var(--ink-1); font-weight: 600; white-space: nowrap; }
.doc-table tr:last-child td { border-bottom: 0; }

.doc-note-inline {
  margin: 8px 0 0;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--warn-soft, var(--soft));
  font-size: 12.5px !important;
  line-height: 1.75;
  color: var(--ink-2);
}

.doc-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 22px;
}

/* --- 页脚链接 --- */
.footer-links {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 12.5px;
}

.footer-links a { color: var(--ink-3); }
.footer-links a:hover { color: var(--brand-ink); }

@media (max-width: 599px) {
  .state-page { margin-top: 12px; padding: 26px 18px 24px; }
  .state-code { font-size: 36px; }
  .state-actions .btn { flex: 1 1 100%; }
  .doc-section { padding: 16px 15px; border-radius: var(--r-md); }
  .doc-table { font-size: 12.5px; }
  .doc-table th, .doc-table td { padding: 8px 6px; }
  .doc-formula code { font-size: 12.5px; }
  .footer-links { width: 100%; }
}

/* --- 我的：规则入口 --- */
.me-links { padding: 6px 4px; }

.me-links a {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 11px 12px;
  border-radius: 10px;
  color: inherit;
}

.me-links a + a { border-top: 1px solid var(--line); }
.me-links a:hover { background: var(--soft); }
.me-links b { font-size: 13.5px; }
.me-links span { font-size: 12.5px; color: var(--ink-3); line-height: 1.6; }
/* ============================================================
   二十五、v0.1.3：截止时间 / 规则开关 / 规则卡 / 记录摘要 / 环形图 / 我的行内操作
   ============================================================ */

/* --- 发起页：截止时间 --- */
.deadline-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

.deadline-row .input {
  flex: 1 1 220px;
  min-width: 0;
}

.deadline-quick {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.deadline-quick .chip {
  padding: 6px 11px;
  font-size: 12.5px;
}

.deadline-hint {
  margin-top: 7px;
  font-size: 12.5px;
  color: var(--ink-3);
  line-height: 1.6;
}

.deadline-hint.is-bad { color: var(--warn, #b4541a); }

/* --- 发起页：规则开关（自绘开关，兼容无 accent-color 的环境） --- */
.switch-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.switch-list .switch-row {
  align-items: flex-start;
  padding: 12px 13px;
  position: relative;
}

/* 这两行用的是自绘开关，原生 checkbox 只保留可访问性 */
.switch-list .switch-row input[type="checkbox"] {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
  pointer-events: none;
}

.switch-ui {
  position: relative;
  flex: 0 0 auto;
  width: 34px;
  height: 20px;
  margin-top: 1px;
  border-radius: 999px;
  background: var(--line);
  transition: background var(--dur);
}

.switch-ui::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .2);
  transition: transform var(--dur);
}

.switch-row input[type="checkbox"]:checked + .switch-ui {
  background: var(--brand);
}

.switch-row input[type="checkbox"]:checked + .switch-ui::after {
  transform: translateX(14px);
}

.switch-row input[type="checkbox"]:focus-visible + .switch-ui {
  outline: 2px solid var(--brand-line);
  outline-offset: 2px;
}

.switch-text {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.switch-text b { font-size: 13.5px; font-weight: 600; }
.switch-text span { font-size: 12.5px; color: var(--ink-3); line-height: 1.65; }

/* --- 详情页：规则卡（置顶四格） --- */
.rule-card {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}

.rule-item {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 11px 13px;
  border-radius: var(--radius-md);
  border: 1px solid var(--line);
  background: var(--surface);
  min-width: 0;
}

.rule-k {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-3);
  letter-spacing: .02em;
}

.rule-v {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--ink-1);
  line-height: 1.4;
  word-break: break-word;
}

.rule-s {
  font-size: 11.5px;
  color: var(--ink-3);
  line-height: 1.55;
}

/* --- 结果页：柱状 + 环形并排 --- */
.result-chart.has-donut {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
  gap: 20px;
  align-items: center;
}

.result-chart .chart-bars { min-width: 0; }
.chart-donut { min-width: 0; }

.donut-wrap {
  display: flex;
  gap: 18px;
  align-items: center;
  flex-wrap: wrap;
}

.donut {
  position: relative;
  width: 128px;
  height: 128px;
  border-radius: 50%;
  flex: 0 0 auto;
}

.donut::before {
  content: "";
  position: absolute;
  inset: 30%;
  border-radius: 50%;
  background: var(--surface);
}

.donut-hole {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  z-index: 1;
  line-height: 1.1;
}

.donut-hole b { font-size: 19px; color: var(--ink-1); }
.donut-hole i {
  font-style: normal;
  font-size: 11px;
  color: var(--ink-3);
}

.donut-legend {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
  flex: 1 1 140px;
}

.donut-legend li {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  font-size: 12.5px;
  color: var(--ink-2);
  min-width: 0;
}

.donut-legend i {
  width: 9px;
  height: 9px;
  border-radius: 3px;
  flex: 0 0 auto;
}

/* 候选名宁可换行也不截断：窄屏上「C · 市区剧本杀 + 聚餐，人均 480」会被切成「C · 市区剧本杀 + 聚…」 */
.donut-legend span {
  flex: 1 1 auto;
  min-width: 0;
  white-space: normal;
  overflow: visible;
  text-overflow: clip;
  overflow-wrap: anywhere;
  line-height: 1.45;
}

.donut-legend b { font-weight: 700; color: var(--ink-1); flex: 0 0 auto; }

@media (max-width: 720px) {
  .result-chart.has-donut { grid-template-columns: 1fr; gap: 16px; }
  .donut { width: 108px; height: 108px; }
  /* 窄屏把图例放到环形图下面、占满整行：候选名一行放得下，不会把「人均 480」挤到第二行 */
  .donut-wrap { flex-direction: column; align-items: stretch; gap: 14px; }
  .donut { align-self: center; }
  .donut-legend { width: 100%; }
}

/* --- 结果页：投票记录摘要（匿名统计） --- */
.recap {
  margin-top: 12px;
  padding: 14px 16px;
  border-radius: var(--radius-md);
  border: 1px dashed var(--line);
  background: var(--surface-2);
}

.recap-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.recap-head b { font-size: 14px; }
.recap-head span { font-size: 12px; color: var(--ink-3); }

.recap-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}

.recap-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 9px 10px;
  border-radius: 10px;
  background: var(--surface);
  border: 1px solid var(--line);
}

.recap-k { font-size: 11.5px; color: var(--ink-3); }

.recap-v {
  font-size: 18px;
  font-weight: 700;
  color: var(--ink-1);
  line-height: 1.2;
}

.recap-v i {
  font-style: normal;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--ink-3);
  margin-left: 3px;
}

.recap-log {
  margin: 12px 0 0;
  padding-left: 18px;
  font-size: 12.5px;
  color: var(--ink-2);
  line-height: 1.8;
}

.recap-log li + li { margin-top: 3px; }
.recap-log b { font-weight: 700; color: var(--ink-1); margin-right: 6px; }

.recap-note {
  margin: 10px 0 0;
  font-size: 12px;
  color: var(--ink-3);
  line-height: 1.7;
}

/* --- 发起者工具：开下一轮 --- */
.owner-row-next { border-color: var(--brand-line); }
.owner-row-next b { color: var(--brand-ink); }

/* --- 已结束横幅：到点自动关闭的变体 --- */
.ended-banner.is-deadline {
  border-color: var(--warn-line, var(--line));
  background: var(--warn-soft, var(--soft));
}

/* --- 我的：我发起的一行操作 --- */
.me-poll-row--ops {
  gap: 12px;
  align-items: center;
  padding: 10px 12px;
}

.me-poll-main {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1 1 auto;
  min-width: 0;
  color: inherit;
  text-decoration: none;
}

.me-poll-main:hover .me-poll-name { color: var(--brand-ink); }

.me-poll-ops {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  flex: 0 0 auto;
}

.me-poll-ops .btn {
  padding: 5px 10px;
  font-size: 12.5px;
}

/* --- 我的：我参与的 --- */
.me-poll-row--joined { flex-wrap: wrap; }

/* --- 我的：早期参与记录折叠 --- */
.me-more {
  margin-top: 10px;
  border-top: 1px dashed var(--line);
  padding-top: 8px;
}

.me-more summary {
  cursor: pointer;
  font-size: 12.5px;
  color: var(--ink-3);
  list-style: none;
  padding: 6px 2px;
  line-height: 1.6;
}

.me-more summary::-webkit-details-marker { display: none; }

.me-more summary::before { content: "\25B8 "; }
.me-more[open] summary::before { content: "\25BE "; }
.me-more summary:hover { color: var(--brand-ink); }

.me-more .me-poll-list { margin-top: 8px; }

.me-poll-pick {
  font-size: 12.5px;
  color: var(--ink-2);
  white-space: nowrap;
}

.me-poll-time {
  font-size: 12px;
  color: var(--ink-3);
  margin-left: auto;
  white-space: nowrap;
}

@media (max-width: 900px) {
  .rule-card { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .recap-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 599px) {
  .deadline-row .input { flex: 1 1 100%; }
  .deadline-quick { width: 100%; }
  .deadline-quick .chip { flex: 1 1 auto; text-align: center; }
  .rule-card { grid-template-columns: 1fr 1fr; gap: 8px; }
  .rule-item { padding: 9px 11px; }
  .recap { padding: 12px 13px; }
  .recap-grid { grid-template-columns: 1fr 1fr; }
  .me-poll-row--ops { align-items: flex-start; flex-direction: column; }
  .me-poll-main { flex-wrap: wrap; }
  .me-poll-main .me-poll-name { flex: 1 1 100%; }
  .me-poll-ops { width: 100%; }
  .me-poll-ops .btn { flex: 1 1 auto; text-align: center; }
  .me-poll-time { margin-left: 0; width: 100%; white-space: normal; }
  .me-poll-pick { white-space: normal; flex: 1 1 100%; }
  .rule-v { font-size: 12.5px; }
}


/* ============================================================
   二十六、v0.1.4：数据备份
   ============================================================ */
.data-card { display: flex; flex-direction: column; gap: 12px; }
.data-lead {
  margin: 0; font-size: 13.5px; line-height: 1.75; color: var(--ink-2);
}
.data-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.data-upload { cursor: pointer; }
.data-danger { color: var(--danger, #b42318); }
.data-meta { margin: 0; font-size: 12px; color: var(--ink-3); line-height: 1.6; }
@media (max-width: 599px) {
  .data-actions { flex-direction: column; align-items: stretch; }
  .data-actions .btn, .data-upload { width: 100%; text-align: center; }
}


/* ==========================================================================
   第二十七节　计算来源徽章（v0.1.5）
   结论卡下方一行：来源标签 + 一句说明 + 切换按钮。
   故意做得轻——结论才是主角，这行是给评委看"算法来自哪里"的。
   ========================================================================== */
.src-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin: 0 0 12px;
}

.src-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: var(--surface-2);
  color: var(--ink-3);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .02em;
}

.src-badge::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ink-3);
}

.src-badge.is-skill {
  border-color: var(--brand-line);
  background: var(--brand-soft);
  color: var(--brand-ink);
}

.src-badge.is-skill::before { background: var(--brand-vivid); }

.src-note {
  font-size: 11.5px;
  color: var(--ink-3);
}

.src-toggle {
  margin-left: auto;
  padding: 3px 8px;
  border: 1px solid var(--line-strong);
  border-radius: 7px;
  background: transparent;
  color: var(--ink-2);
  font-family: inherit;
  font-size: 11.5px;
  cursor: pointer;
}

.src-toggle:hover {
  border-color: var(--brand-line);
  background: var(--brand-soft);
  color: var(--brand-ink);
}

@media (max-width: 599px) {
  .src-toggle { margin-left: 0; }
}


/* ==========================================================================
   第二十八节　一句话起草候选（v0.1.6 · poll-designer）
   发起页顶部一条输入 + 结果条。做成浅色块，不抢表单的注意力。
   ========================================================================== */
.designer {
  margin-bottom: 16px;
  padding: 12px 14px;
  border: 1px solid var(--brand-line);
  border-radius: var(--r-lg);
  background: var(--brand-soft);
}

.designer-head {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 9px;
}

.designer-badge {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--brand-vivid);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .02em;
}

.designer-hint {
  font-size: 12px;
  color: var(--brand-ink);
  opacity: .85;
}

.designer-row {
  display: flex;
  gap: 8px;
}

.designer-row .input { flex: 1; }

.designer-out {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed var(--brand-line);
}

.dz-line {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 6px;
  font-size: 12.5px;
  color: var(--ink-2);
}

.dz-k {
  color: var(--ink-3);
  font-size: 11.5px;
}

.dz-k::after { content: "："; }

.dz-conf {
  margin-left: auto;
  padding: 1px 7px;
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  font-size: 11px;
  color: var(--ink-3);
}

.dz-note {
  font-size: 11.5px;
  color: var(--ink-3);
  line-height: 1.6;
}

.dz-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 4px;
}

@media (max-width: 599px) {
  .designer-row { flex-wrap: wrap; }
  .designer-row .btn { width: 100%; }
}


/* ==========================================================================
   第二十九节　交换匹配（v0.1.6 · swap-matcher）
   列表页顶部一行，点开后是排序结果。分数用大字，理由用小字。
   ========================================================================== */
.swmatch {
  margin-bottom: 14px;
  padding: 11px 13px;
  border: 1px solid var(--brand-line);
  border-radius: var(--r-lg);
  background: var(--brand-soft);
}

.swmatch-head {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.swmatch-badge {
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--brand-vivid);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
}

.swmatch-hint {
  font-size: 12px;
  color: var(--brand-ink);
  opacity: .85;
}

.swmatch-head .btn { margin-left: auto; }

.swmatch-out {
  margin-top: 11px;
  padding-top: 11px;
  border-top: 1px dashed var(--brand-line);
}

.sm-sum {
  font-size: 12px;
  color: var(--ink-2);
  margin-bottom: 9px;
}

.sm-item {
  display: flex;
  gap: 11px;
  padding: 9px 10px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--line);
  margin-bottom: 7px;
  text-decoration: none;
  color: inherit;
}

.sm-item:hover {
  border-color: var(--brand-line);
}

.sm-score {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 54px;
  padding: 4px 6px;
  border-radius: 9px;
  background: var(--surface-2);
  font-weight: 800;
  font-size: 18px;
  line-height: 1.1;
  color: var(--ink-2);
}

.sm-score i {
  font-style: normal;
  font-size: 10px;
  font-weight: 600;
  opacity: .7;
}

.sm-score em {
  font-style: normal;
  font-size: 10px;
  font-weight: 600;
  margin-top: 2px;
  opacity: .85;
}

.sm-score.is-high { background: var(--ok-soft); color: var(--ok-ink); }
.sm-score.is-mid  { background: var(--brand-soft); color: var(--brand-ink); }
.sm-score.is-low  { background: var(--surface-2); color: var(--ink-3); }

.sm-body {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  flex: 1;
}

.sm-body b { font-size: 13.5px; }

.sm-meta {
  font-size: 11.5px;
  color: var(--ink-3);
}

.sm-why {
  font-size: 11.5px;
  color: var(--ink-2);
  line-height: 1.5;
}

.sm-gap {
  font-size: 11.5px;
  color: var(--warn-ink, #9a6a12);
}

@media (max-width: 599px) {
  .swmatch-head .btn { margin-left: 0; width: 100%; }
}


/* ==========================================================================
   第三十节　知识库（v0.1.7 · #/kb）
   攻略列表与知识库共用一个子导航；参数字段做成可点的倒排标签。
   ========================================================================== */
.subtabs {
  display: flex;
  gap: 6px;
  margin: 0 0 14px;
}

.subtab {
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 13px;
  color: var(--ink-2);
  border: 1px solid transparent;
}

.subtab:hover {
  color: var(--ink);
  background: var(--surface-2);
}

.subtab.is-on {
  background: var(--brand-soft);
  color: var(--brand-ink);

<!-- 顺序加载：无构建、无服务器依赖，双击即可打开 -->
<script>
/* assets/js/pure/decision.js */
/*!
 * decision.js — Pick For Me 的决策计算内核
 *
 * 纯函数：没有 DOM、没有 localStorage、没有 Date.now()、没有随机数。
 * 同一个输入永远得到同一个输出，所以它既能跑在浏览器里，也能跑在 Node / DeepWorks 技能里。
 *
 * 来源：从 web/assets/js/store.js 的 tallyWith / computeCredits / tierOf /
 *       isExpired / isClosed / pollTiming / canVote，以及 views.js 的 suggestHtml 逐行搬迁。
 *       搬迁时刻意不改口径，改口径会让前端与技能算出两套结果。
 *
 * 用法：
 *   浏览器  <script src=".../decision.js"><\/script>  →  window.Decision.evaluate(input)
 *   Node    const D = require('./decision.js');      →  D.evaluate(input)
 *
 * 输入输出契约见同目录 SKILL.md 与 .opencode/skills/poll-result/SKILL.md。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) {
    module.exports = factory();
  } else {
    root.Decision = factory();
  }
}(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ---------- 常量：必须与 docs/11 和 store.js 保持一致 ---------- */
  var K_SHRINK = 5;        // 收缩系数
  var MIN_SAMPLE = 5;      // 分档所需最少样本
  var HIGH_LINE = 0.65;
  var MID_LINE = 0.50;

  var TIER_RANK = { bad: -1, normal: 0, mid: 1, high: 2 };
  var TIER_LABEL = { high: '高可信', mid: '中等可信', normal: '普通', bad: '暂未纳入统计' };

  var GATES = {
    all:  { key: 'all',  label: '所有人',           needRank: 0 },
    mid:  { key: 'mid',  label: '中等信用及以上',   needRank: 1 },
    high: { key: 'high', label: '高可信',           needRank: 2 }
  };

  var KIND = { EMPTY: 'empty', TIE: 'tie', WINNER: 'winner' };

  /* ---------- 小工具 ---------- */
  function round3(x) {
    return Math.round(x * 1000) / 1000;
  }

  function toMs(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    var at = Date.parse(String(v));
    return isNaN(at) ? null : at;
  }

  function gateOf(poll) {
    var key = poll && poll.gate;
    return GATES[key] || GATES.all;
  }

  /* ---------- 计票 ---------- */
  /**
   * @param {Object} poll
   * @param {Array}  [voteList] 传入一组票；默认用 poll.votes（留一法需要传子集）
   * @returns {{rows:Array, total:number, max:number, winners:Array, tie:boolean}}
   */
  function tallyWith(poll, voteList) {
    var opts = (poll && poll.options) || [];
    var votes = voteList || (poll && poll.votes) || [];
    var score = {};
    opts.forEach(function (o) { score[o.id] = 0; });

    votes.forEach(function (v) {
      if (poll.type === 'rank') {
        /* Borda：n 个候选，第 1 名 n-1 分，末位 0 分 */
        var r = v.ranking || [];
        var n = r.length;
        r.forEach(function (oid, i) {
          if (score[oid] != null) score[oid] += (n - 1 - i);
        });
      } else {
        (v.choice || []).forEach(function (oid) {
          if (score[oid] != null) score[oid] += 1;
        });
      }
    });

    var rows = opts.map(function (o) {
      return {
        option: o,
        score: score[o.id] || 0,
        share: votes.length ? (score[o.id] || 0) / votes.length : 0
      };
    }).sort(function (a, b) { return b.score - a.score; });

    var max = rows.length ? rows[0].score : 0;
    var winners = rows.filter(function (r) { return r.score === max && max > 0; });

    return {
      rows: rows,
      total: votes.length,
      max: max,
      winners: winners,
      tie: winners.length > 1
    };
  }

  /* ---------- 投票信用（留一法 + 收缩） ---------- */
  /**
   * @param {Array} voters  已登记的投票人 [{id,name,blacklisted}]
   * @param {Array} polls   用于统计的全部投票（含当前这次）
   * @returns {Object} id -> {n,hit,skipped,score}
   */
  function computeCredits(voters, polls) {
    var acc = {};
    (voters || []).forEach(function (v) {
      acc[v.id] = { id: v.id, name: v.name, n: 0, hit: 0, skipped: 0 };
    });

    (polls || []).forEach(function (p) {
      var votes = (p.votes || []).filter(function (x) {
        return x.voterId && acc[x.voterId];
      });
      if (votes.length < 3) return;          /* 人太少，留一法没有意义 */

      votes.forEach(function (mine) {
        var rest = votes.filter(function (x) { return x.id !== mine.id; });
        var t = tallyWith(p, rest);

        if (t.total === 0 || t.tie) {        /* 剔除后平票 / 无人 → 跳过 */
          acc[mine.voterId].skipped++;
          return;
        }

        var winnerId = t.winners[0].option.id;
        var hit = (mine.choice || []).indexOf(winnerId) >= 0 ? 1 : 0;

        acc[mine.voterId].n++;
        acc[mine.voterId].hit += hit;
      });
    });

    Object.keys(acc).forEach(function (id) {
      var r = acc[id];
      r.score = round3((r.hit + K_SHRINK * 0.5) / (r.n + K_SHRINK));
    });

    return acc;
  }

  function tierOf(score, n) {
    if (n < MIN_SAMPLE) return 'normal';   /* 新人也是普通，不额外标记 */
    if (score >= HIGH_LINE) return 'high';
    if (score >= MID_LINE) return 'mid';
    return 'normal';
  }

  /* ---------- 时间与结束状态 ---------- */
  function isExpired(poll, nowMs) {
    if (!poll || !poll.deadline) return false;
    var at = toMs(poll.deadline);
    if (at == null) return false;
    return at <= nowMs;
  }

  function isClosed(poll, nowMs) {
    if (!poll) return true;
    if (poll.archived) return true;
    return isExpired(poll, nowMs);
  }

  /**
   * 只给结构化时间信息，人话文案交给展示层——
   * 因为 Node 与浏览器的时区可能不同，把"还剩 3 小时"这类字符串写进计算层会产生两套结果。
   */
  function timingOf(poll, nowMs) {
    var closed = isClosed(poll, nowMs);
    var byDeadline = !!(poll && !poll.archived && isExpired(poll, nowMs));
    var hasDeadline = !!(poll && poll.deadline);
    var at = hasDeadline ? toMs(poll.deadline) : null;
    var msLeft = (at == null) ? 0 : (at - nowMs);

    return {
      closed: closed,
      byDeadline: byDeadline,
      hasDeadline: hasDeadline,
      deadlineAt: at,
      msLeft: msLeft,
      /* 手动结束优先：archived 时即使 deadline 在未来也不算"还剩" */
      remaining: (poll && poll.archived) ? 0 : Math.max(0, msLeft)
    };
  }

  /* ---------- 能否投票 ---------- */
  function accessOf(poll, timing, credits, askVoterId) {
    var gate = gateOf(poll);
    var c = askVoterId ? credits[askVoterId] : null;
    var tier = c ? (c.blacklisted ? 'bad' : c.tier) : 'normal';

    var res = {
      ok: true,
      gate: { key: gate.key, label: gate.label, needRank: gate.needRank },
      tier: tier,
      tierLabel: (c && c.blacklisted) ? TIER_LABEL.bad : (TIER_LABEL[tier] || TIER_LABEL.normal),
      needLogin: false,
      needSample: false,
      closed: false,
      closedBy: '',
      reason: ''
    };

    /* 已结束优先告知"结束了"，比"请登录"更有用 */
    if (timing.closed) {
      res.ok = false;
      res.closed = true;
      res.closedBy = timing.byDeadline ? 'deadline' : 'owner';
      res.reason = timing.byDeadline
        ? '这次投票已到最后期限，结果仍然可以看。'
        : '这次投票已经结束了，结果仍然可以看。';
      return res;
    }

    if (!askVoterId) {
      res.ok = false;
      res.needLogin = true;
      res.reason = '登录后才能投票';
      return res;
    }

    if (gate.key === 'all') return res;

    if (!c) {
      res.ok = false;
      res.needSample = true;
      res.reason = '你还没有可计入统计的投票记录，达不到这个门槛。';
      return res;
    }
    if (c.n < MIN_SAMPLE) {
      res.ok = false;
      res.needSample = true;
      res.reason = '你目前只有 ' + c.n + ' 次可计入统计的投票，还差 ' +
        (MIN_SAMPLE - c.n) + ' 次才参与分档。';
      return res;
    }
    if (TIER_RANK[tier] < gate.needRank) {
      res.ok = false;
      res.reason = '这次要求「' + gate.label + '」，你目前是「' + (TIER_LABEL[tier] || TIER_LABEL.normal) + '」。';
      return res;
    }
    return res;
  }

  /* ---------- 结论 ---------- */
  function verdictOf(t, unit) {
    if (!t.total) {
      return { kind: KIND.EMPTY, statement: '还没有人投票，暂时没有结论。', winners: [] };
    }
    /* 有票但没有任何有效计分（例如票全指向已删除的候选）——原实现会在这里崩，纯函数不能崩 */
    if (!t.winners.length) {
      return { kind: KIND.EMPTY, statement: '没有有效票，暂时没有结论。', winners: [] };
    }
    if (t.tie) {
      return {
        kind: KIND.TIE,
        statement: '票数打平：' + t.winners.map(function (w) { return w.option.name; }).join(' / ') +
          '（各 ' + t.max + ' ' + unit + '），需要再补一票或由发起者定夺。',
        winners: t.winners.map(function (w) { return w.option.id; })
      };
    }
    var w = t.winners[0];
    var pct = Math.round(w.score / t.total * 100);
    return {
      kind: KIND.WINNER,
      statement: '建议选「' + w.option.name + '」：' + w.score + ' ' + unit + '，占 ' + pct + '%。',
      winners: [w.option.id]
    };
  }

  /* ---------- 平票建议（按价格，口径同 views.js 的 suggestHtml） ---------- */
  function suggestionOf(t, weights) {
    if (!t.tie || t.winners.length < 2) return null;

    var tied = t.winners.map(function (w) { return w.option; });
    var budgetW = (weights && weights.budget) || 40;
    var withPrice = tied.filter(function (o) { return o.price != null && !isNaN(o.price); });
    var pick, reason, basis;

    if (withPrice.length >= 2) {
      pick = withPrice.slice().sort(function (a, b) { return a.price - b.price; })[0];
      var others = withPrice.filter(function (o) { return o.id !== pick.id; });
      var diff = others[0].price - pick.price;
      basis = 'price';
      reason = '你给"预算"设的权重是 ' + budgetW + '%，' + pick.name + ' 比 ' + others[0].name +
        ' 便宜 ' + diff + '，在票数相同的情况下按预算维度优先。';
    } else {
      pick = tied[0];
      basis = 'fallback';
      reason = '这几个的价格信息不全，先按顺序选 ' + pick.name + '。建议补上价格后重新看一次。';
    }

    return {
      optionId: pick.id,
      name: pick.name,
      basis: basis,
      budgetWeight: budgetW,
      reason: reason,
      /* 明确告诉使用者：这是按权重给的建议，不是投票结果 */
      disclaimer: '这是按你设定的权重的建议，不是投票结果。你可以不采纳。'
    };
  }

  /* ---------- 主入口 ---------- */
  /**
   * @param {Object} input
   *   input.poll       必填，投票对象
   *   input.now        必填，毫秒时间戳或 ISO 字符串（纯函数不允许隐式取当前时间）
   *   input.voters     可选，已登记投票人；不传则不计算信用
   *   input.polls      可选，用于信用统计的全部投票；不传则只用 [poll]
   *   input.askVoterId 可选，判断"这个人能不能投"
   *   input.weights    可选，{ budget: 40 }
   * @returns {Object}
   */
  function evaluate(input) {
    var it = input || {};
    var poll = it.poll;

    if (!poll || typeof poll !== 'object') {
      return { ok: false, error: 'missing_poll', message: '缺少 poll' };
    }

    var nowMs = toMs(it.now);
    if (nowMs == null) {
      return { ok: false, error: 'missing_now', message: '必须传 now（毫秒时间戳或 ISO 字符串），计算层不隐式取当前时间' };
    }

    var unit = poll.type === 'rank' ? '分' : '票';
    var t = tallyWith(poll, null);
    var timing = timingOf(poll, nowMs);

    /* 信用档案：只有在传了 voters 时才输出，避免把"没算"说成"算出来是普通" */
    var credits = null;
    if (it.voters && it.voters.length) {
      var polls = (it.polls && it.polls.length) ? it.polls : [poll];
      var raw = computeCredits(it.voters, polls);
      credits = {};
      it.voters.forEach(function (v) {
        var r = raw[v.id] || { n: 0, hit: 0, skipped: 0, score: 0.5 };
        credits[v.id] = {
          id: v.id,
          name: v.name,
          n: r.n,
          hit: r.hit,
          skipped: r.skipped,
          score: r.score,
          tier: tierOf(r.score, r.n),
          weight: v.blacklisted ? 0 : Math.round((0.5 + r.score) * 100) / 100,
          blacklisted: !!v.blacklisted
        };
      });
    }

    var access = accessOf(poll, timing, credits || {}, it.askVoterId || '');
    var verdict = verdictOf(t, unit);

    return {
      ok: true,
      version: 'poll-result/1',
      unit: unit,
      timing: timing,
      result: {
        total: t.total,
        max: t.max,
        tie: t.tie,
        rows: t.rows.map(function (r) {
          return {
            optionId: r.option.id,
            name: r.option.name,
            price: (r.option.price == null ? null : r.option.price),
            score: r.score,
            share: round3(r.share),
            pct: t.total ? Math.round(r.score / t.total * 100) : 0
          };
        }),
        winners: t.winners.map(function (w) { return w.option.id; }),
        verdict: verdict

      var raw = localStorage.getItem(NS + collection);
      if (!raw) return [];
      var data = JSON.parse(raw);
      return Array.isArray(data) ? data : [];
    } catch (e) {
      console.warn('[store] 读取失败', collection, e);
      return [];
    }
  }

  function write(collection, list) {
    var prev = [];
    try { prev = read(collection); } catch (e) { prev = []; }
    try {
      localStorage.setItem(NS + collection, JSON.stringify(list));
    } catch (e) {
      console.warn('[store] 写入失败（可能是容量满或被禁用）', e);
      return false;
    }
    /* 有云端配置时顺带同步；失败不影响本地写入本身 */
    if (!syncMuted && window.PFSync && typeof window.PFSync.onWrite === 'function') {
      try { window.PFSync.onWrite(collection, list, prev); } catch (e) { /* 忽略 */ }
    }
    return true;
  }

  /**
   * 是不是「云端来的或用户自己建的」数据（相对演示数据而言）。
   * seed 重写集合时要靠它保住真实内容，不能让演示数据把用户的投票冲掉。
   */
  function isUserData(x) {
    if (!x || !x.id) return false;
    if (x.remote) return true;
    if (x.seed) return false;
    return String(x.id).indexOf('demo') < 0;
  }

  function keepUser(list) {
    return (list || []).filter(isUserData);
  }

  function uid(prefix) {
    return (prefix || 'id') + '_' +
      Date.now().toString(36) + '_' +
      Math.random().toString(36).slice(2, 7);
  }

  /* ---------- 时间文案 ---------- */

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  /** 6月8日 20:00 —— 用于"已于 X 截止" */
  function fmtClock(at) {
    var d = new Date(at);
    if (isNaN(d.getTime())) return '未知时间';
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' +
      pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  /** 把剩余毫秒说成人话：3 天 2 小时 / 47 分钟 / 不到 1 分钟 */
  function humanLeft(ms) {
    if (ms <= 0) return '已截止';
    var min = Math.floor(ms / 60000);
    if (min < 1) return '不到 1 分钟';
    if (min < 60) return min + ' 分钟';
    var hr = Math.floor(min / 60);
    if (hr < 24) return hr + ' 小时' + (min % 60 ? ' ' + (min % 60) + ' 分' : '');
    var day = Math.floor(hr / 24);
    return day + ' 天' + (hr % 24 ? ' ' + (hr % 24) + ' 小时' : '');
  }

  /* ---------- 计票（⚠️ 临时实现，迁移后交给 option-scorer） ---------- */

  /**
   * @param {Object} poll
   * @param {Array}  [voteList] 可传入一组票，默认用 poll.votes（留一法要用）
   * @returns {{rows:Array, total:number, max:number, winners:Array, tie:boolean}}
   */
  /**
   * 只留当前轮的票。
   * 开新一轮时 roundStartedAt 会被刷新，早于它的票属于上一轮：
   * 云端可能因为旧数据被拉回来，不挡就会让新一轮的票数从上一轮接着涨。
   * 票没有 at（老数据）时按保留处理，宁可多算也不误删。
   */
  function roundVotesOf(poll, list) {
    var votes = list || (poll && poll.votes) || [];
    var since = poll && poll.roundStartedAt ? Date.parse(poll.roundStartedAt) : 0;
    if (!since) return votes;
    return votes.filter(function (v) {
      var t = Date.parse((v && v.at) || '');
      return !t || t >= since;
    });
  }

  function tallyWith(poll, voteList) {
    var opts = poll.options || [];
    var votes = roundVotesOf(poll, voteList);
    var score = {};
    opts.forEach(function (o) { score[o.id] = 0; });

    votes.forEach(function (v) {
      if (poll.type === 'rank') {
        // Borda：n 个候选，第 1 名 n-1 分，末位 0 分
        var r = v.ranking || [];
        var n = r.length;
        r.forEach(function (oid, i) {
          if (score[oid] != null) score[oid] += (n - 1 - i);
        });
      } else {
        (v.choice || []).forEach(function (oid) {
          if (score[oid] != null) score[oid] += 1;
        });
      }
    });

    var rows = opts.map(function (o) {
      return {
        option: o,
        score: score[o.id] || 0,
        share: votes.length ? (score[o.id] || 0) / votes.length : 0
      };
    }).sort(function (a, b) { return b.score - a.score; });

    var max = rows.length ? rows[0].score : 0;
    var winners = rows.filter(function (r) { return r.score === max && max > 0; });

    return {
      rows: rows,
      total: votes.length,
      max: max,
      winners: winners,
      tie: winners.length > 1
    };
  }

  /* ---------- 投票信用 ---------- */

  /**
   * 留一法 + 收缩（docs/11 第二节）
   *
   * 对每个用户参与的每次投票：
   *   R(v)   = 剔除他本人那一票之后，其余人算出的优胜项
   *   hit    = 他的选择是否命中 R(v)
   *   score  = (hit + K×0.5) / (n + K)
   *
   * 平票（剔除后仍有并列第一）直接跳过，不计入分子分母。
   */
  function computeCredits() {
    var voters = read('voters');
    var polls = read('polls').concat(read('history'));

    var acc = {};
    voters.forEach(function (v) {
      acc[v.id] = { id: v.id, name: v.name, n: 0, hit: 0, skipped: 0 };
    });

    polls.forEach(function (p) {
      var votes = (p.votes || []).filter(function (x) {
        return x.voterId && acc[x.voterId];
      });
      if (votes.length < 3) return;          // 人太少，留一法没有意义

      votes.forEach(function (mine) {
        var rest = votes.filter(function (x) { return x.id !== mine.id; });
        var t = tallyWith(p, rest);

        if (t.total === 0 || t.tie) {         // 剔除后平票 / 无人 → 跳过
          acc[mine.voterId].skipped++;
          return;
        }

        var winnerId = t.winners[0].option.id;
        var hit = (mine.choice || []).indexOf(winnerId) >= 0 ? 1 : 0;

        acc[mine.voterId].n++;
        acc[mine.voterId].hit += hit;
      });
    });

    Object.keys(acc).forEach(function (id) {
      var r = acc[id];
      r.score = Math.round(((r.hit + K_SHRINK * 0.5) / (r.n + K_SHRINK)) * 1000) / 1000;
    });

    return acc;
  }

        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    },

    isLoggedIn: function () { return !!Store.account(); },

    /** 当前账号绑定的投票人 id；未登录返回空串 */
    meId: function () {
      var a = Store.account();
      return (a && a.voterId) ? a.voterId : '';
    },

    me: function () {
      var id = Store.meId();
      return id ? Store.voter(id) : null;
    },

    myName: function () {
      var a = Store.account();
      return a ? a.name : '';
    },

    /**
     * 登录 / 注册合一。演示环境不发短信：验证码填任意 6 位数字都通过。
     * @returns {{ok:boolean, reason:string, account:Object|null, isNew:boolean}}
     */
    signIn: function (input) {
      var it = input || {};
      var method = (it.method === 'phone' || it.method === 'email') ? it.method : 'password';
      var contact = String(it.contact || '').trim();
      var secret = String(it.secret || '').trim();
      var name = String(it.name || '').trim();

      if (!contact) {
        return { ok: false, reason: method === 'email' ? '请填写邮箱' :
          (method === 'phone' ? '请填写手机号' : '请填写账号'), account: null, isNew: false };
      }
      if (method === 'phone' && !/^1\d{10}$/.test(contact)) {
        return { ok: false, reason: '手机号是 11 位数字', account: null, isNew: false };
      }
      if (method === 'email' && contact.indexOf('@') < 1) {
        return { ok: false, reason: '邮箱格式不对', account: null, isNew: false };
      }
      if (method === 'password' && contact.length < 3) {
        return { ok: false, reason: '账号至少 3 个字符', account: null, isNew: false };
      }
      if (method === 'phone') {
        if (!/^\d{6}$/.test(secret)) {
          return { ok: false, reason: '验证码是 6 位数字（演示环境填 123456）', account: null, isNew: false };
        }
      } else if (secret.length < 6) {
        return { ok: false, reason: '密码至少 6 位', account: null, isNew: false };
      }

      var isNew = true;
      var voterId = Store.ensureVoter(contact, name);
      var voter = Store.voter(voterId);
      if (voter && voter.contact === contact && voter.createdAt) isNew = false;

      var acc = {
        id: 'a_' + voterId,
        contact: contact,
        method: method,
        voterId: voterId,
        name: (voter && voter.name) || name || '新用户',
        createdAt: new Date().toISOString()
      };
      try { localStorage.setItem(NS + 'account', JSON.stringify(acc)); } catch (e) { /* 隐私模式 */ }
      return { ok: true, reason: '', account: acc, isNew: isNew };
    },

    /**
     * 云端账号登录成功后，把远端用户落到本地 voters 上。
     * 本地 id 由远端 uuid 派生，保证换设备登录同一账号时身份不变、票能对上。
     */
    adoptAccount: function (p) {
      var remoteId = String((p && p.remoteId) || '');
      if (!remoteId) return null;
      var vid = 'u_' + remoteId.replace(/-/g, '').slice(0, 12);
      var list = read('voters');
      var hit = null;
      var i;
      for (i = 0; i < list.length; i++) {
        if (list[i].id === vid) { hit = list[i]; break; }
      }
      if (!hit) {
        hit = {
          id: vid,
          name: String(p.name || '新用户').slice(0, 20),
          contact: String(p.email || ''),
          createdAt: new Date().toISOString(),
          isMe: false
        };
        list.push(hit);
        write('voters', list);
      } else if (p.name && hit.name !== p.name) {
        hit.name = String(p.name).slice(0, 20);
        write('voters', list);
      }
      var acc = {
        id: 'a_' + vid,
        contact: String(p.email || ''),
        method: 'email',
        voterId: vid,
        name: hit.name,
        createdAt: new Date().toISOString(),
        remoteId: remoteId
      };
      try { localStorage.setItem(NS + 'account', JSON.stringify(acc)); } catch (e) { /* 隐私模式 */ }
      return acc;
    },

    /**
     * 把联系方式绑到一个投票人上。
     * 演示手机号 → 预置的「我」；其它联系方式 → 新建一个没有历史票的投票人。
     */
    ensureVoter: function (contact, name) {
      var list = read('voters');
      var i;

      if (contact === DEMO_CONTACT) {
        for (i = 0; i < list.length; i++) {
          if (list[i].isMe) {
            list[i].contact = contact;
            if (!list[i].createdAt) list[i].createdAt = new Date().toISOString();
            write('voters', list);
            return list[i].id;
          }
        }
      }

      for (i = 0; i < list.length; i++) {
        if (list[i].contact === contact) return list[i].id;
      }

      var id = 'u_' + String(contact).replace(/[^a-z0-9]/gi, '').slice(-8) + '_' +
        Date.now().toString(36).slice(-3);
      list.push({
        id: id,
        name: name || ('用户' + String(contact).slice(-4)),
        contact: contact,
        createdAt: new Date().toISOString(),
        hideBadge: false,
        avatar: ''
      });
      write('voters', list);
      return id;
    },

    logout: function () {
      /* 配了云端账号时，两边一起退：云端会话 + 本地账号 */
      if (window.PFAuth && window.PFAuth.enabled()) {
        try { window.PFAuth.signOut(); } catch (e) { /* 忽略 */ }
      }
      try { localStorage.removeItem(NS + 'account'); } catch (e) { /* 忽略 */ }
      return true;
    },

    /** 改昵称 / 头像 / 隐私开关：账号与投票人两边同步 */
    updateProfile: function (patch) {
      var acc = Store.account();
      if (!acc) return { ok: false, reason: 'login' };
      var voter = Store.voter(acc.voterId);
      var p = patch || {};

      if (voter) {
        if (p.name != null && String(p.name).trim()) voter.name = String(p.name).trim().slice(0, 16);
        if (p.avatar != null) voter.avatar = p.avatar;
        if (p.hideBadge != null) voter.hideBadge = !!p.hideBadge;
        Store.save('voters', voter);
      }
      if (p.name != null && String(p.name).trim()) acc.name = String(p.name).trim().slice(0, 16);
      try { localStorage.setItem(NS + 'account', JSON.stringify(acc)); } catch (e) { /* 忽略 */ }
      return { ok: true, account: acc, voter: voter };
    },

    /* ---------- 导出 / 导入（D20：数据可以带走，也可以搬到另一台机器） ---------- */

  /** 导出：把所有 pf: 开头的键打包成一个对象，不做任何裁剪 */
    exportData: function () {
    var entries = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (!k || k.indexOf(NS) !== 0) continue;
        var raw = localStorage.getItem(k);
        try { entries[k] = JSON.parse(raw); }
        catch (e) { entries[k] = raw; }
      }
    } catch (e) {
      return { ok: false, error: '这个浏览器不允许读取本地数据' };
    }
    return {
      ok: true,
      payload: {
        app: 'pick-for-me',
        format: 1,
        storeVersion: Store.VERSION,
        seed: SEED_VER,
        exportedAt: new Date().toISOString(),
        entries: entries
      }
    };
    },

  /** 导入：只接受本应用导出的文件，逐键覆盖 */
    importData: function (text) {
    var obj;
    try { obj = typeof text === 'string' ? JSON.parse(text) : text; }
    catch (e) { return { ok: false, error: '这不是合法的 JSON 文件' }; }
    if (!obj || obj.app !== 'pick-for-me' || !obj.entries) {
      return { ok: false, error: '这不是「帮我选」导出的数据文件' };
    }
    var keys = Object.keys(obj.entries || {});
    if (!keys.length) return { ok: false, error: '文件里没有可恢复的数据' };

    var n = 0, failed = 0;
    keys.forEach(function (k) {
      if (k.indexOf(NS) !== 0) return;
      var v = obj.entries[k];
      try {
        localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v));
        n++;
      } catch (e) { failed++; }
    });
    return {
      ok: n > 0,
      count: n,
      failed: failed,
      seed: obj.seed || '',
      storeVersion: obj.storeVersion || '',
      exportedAt: obj.exportedAt || '',
      error: n > 0 ? '' : '一条都没写进去，可能浏览器存储被禁用'
    };
    },

  /** 清空：只清本应用的键，不动同域名下别的数据 */
    resetData: function () {
    var keys = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf(NS) === 0) keys.push(k);
      }
      keys.forEach(function (k) { localStorage.removeItem(k); });
    } catch (e) {
      return { ok: false, error: '这个浏览器不允许清除本地数据' };
    }
    return { ok: true, count: keys.length };
    },

  /* ---------- 站内消息 ---------- */

    MESSAGE_TYPES: {
      poll:   { label: '投票结束', cls: 'ok' },
      option: { label: '新增候选', cls: 'brand' },
      swap:   { label: '交换申请', cls: 'warn' },
      system: { label: '系统',     cls: '' }
    },

    /** 当前账号的消息，新的在前 */
    messages: function () {
      var me = Store.meId();
      if (!me) return [];
      return read('messages')
        .filter(function (m) { return m.to === me; })
        .sort(function (a, b) { return String(b.at).localeCompare(String(a.at)); });
    },

    unreadCount: function () {
      return Store.messages().filter(function (m) { return !m.read; }).length;
    },

    /** 给指定收件人写一条消息；不传 to 时默认发给当前账号。没有收件人则丢弃 */
    deliver: function (to, msg) {
      var target = to || Store.meId();
      if (!target || !msg) return null;
      var list = read('messages');
      var item = {
        id: uid('m'),
        to: target,
        type: Store.MESSAGE_TYPES[msg.type] ? msg.type : 'system',
        title: String(msg.title || '').slice(0, 60),
        body: String(msg.body || '').slice(0, 160),
        href: msg.href || '',
        at: new Date().toISOString(),
        read: false
      };
      list.push(item);
      write('messages', list);
      /* 同一页面里刚产生的消息要立刻点亮铃铛，不用等下一次重绘 */
      try {
        if (typeof window !== 'undefined' && window.dispatchEvent) {
          window.dispatchEvent(new Event('pf:messages'));
        }
      } catch (e) { /* 非浏览器环境直接跳过 */ }
      return item;
    },

    /** 给当前账号写一条消息 */
    pushMessage: function (msg) {
      return Store.deliver(Store.meId(), msg);
    },

    markRead: function (id) {
      var list = read('messages');
      list.forEach(function (m) { if (m.id === id) m.read = true; });
      write('messages', list);

    markAllRead: function () {

      list.forEach(function (m) { m.read = true; });
      write('messages', list);
    },

    /* ---------- 攻略收藏 ---------- */

    favs: function () {
      var me = Store.meId();

      return read('favs').filter(function (f) { return f.by === me; });
    },

    isFav: function (guideId) {
      return Store.favs().some(function (f) { return f.guideId === guideId; });
    },

    /** 未登录返回 {ok:false, reason:'login'}，由调用方引导登录 */
    toggleFav: function (guideId) {
      var me = Store.meId();
      if (!me) return { ok: false, reason: 'login', fav: false };
      var list = read('favs');
      var hit = -1;
      list.forEach(function (f, i) {
        if (f.by === me && f.guideId === guideId) hit = i;
      });

        list.splice(hit, 1);
        write('favs', list);

      }

      write('favs', list);
      return { ok: true, reason: '', fav: true };
